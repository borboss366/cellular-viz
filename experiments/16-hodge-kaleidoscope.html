<!doctype html>
<!--
  16b · Hodge Kaleidoscope, "Lucy in the Sky with Hodge Diamonds"   (Millennium track #37, Hodge;
  spec: VIZ research, #37 comment 6444942841). The intro and overlay scene of the 16 Hodge set.

  The Hodge diamond is the kaleidoscope's fundamental cell. Cell (p,q) sits at x = (q−p)·s,
  y = (p+q)·s (a square turned 45°); each cell is a faceted gem whose radius goes as log(1+h^{p,q}),
  with the number engraved on it. The middle column (p = q, where Hodge classes live) is gold.

  Mirrors, honestly labelled:
    true symmetries of the numbers (inner mirrors): left↔right is Hodge symmetry h^{p,q} = h^{q,p};
    a 180° turn about the centre is Serre duality h^{p,q} = h^{n−p,n−q}; top↔bottom is the two together.
    art (outer mirrors): reflecting the cell across its four edges tiles the plane (p4m). Decoration.

  Audio: row k = p+q is tied to frequency band k (7 log bands of what is playing). Cell glow is
  h^{p,q}·L_k, so a row's total glow is b_k·L_k with b_k the Betti number. The glow layer is a
  truncated Gaussian of the same shape in every cell, so its integral is exactly ∝ h^{p,q}·L_k.
  Presets: genus-g curve (g 0–6), K3, quintic 3-fold, mirror quintic (for 16e), abelian surface (16d).
  Motion: the tiling turns once per 32 bars, breathes (1 ± 0.02 per bar) and leaves oil trails
  (previous frame × 0.96, zoom 1.002, turn 0.1°); presets morph on phrase changes over 1 bar
  (old gems shrink as the new ones grow, the numbers crossfade). 60s poster palette, no strobes:
  every flash has an exponential tail of ≥ 120 ms. Max-channel tone map, so colour never clips to white.

  window.__qa: presets, hodge(name, g), table, check() {tableOk, symmetric, bettiOk, eulerOk, details},
  measureRowGlow() (renders the glow layer of the cell with every L_k = 1 into a float buffer before
  tone mapping and integrates it per row: {rows, ratios, expected, maxRelErr, zeroLeak}),
  preset, genus, morph, bands (the 7 L_k), rowGlow, events (kick/snare/hat/morph with
  tBeat/tHeard/perfHeard/perfDrawn), errors.
  ?preset=auto|curve|k3|quintic|mirror|abelian, ?genus=0..6, ?bands=audio|flat, ?bpm, ?phrase=8,
  ?spin, ?tileRadius, ?goldBoost, ?trail, ?labels=0, ?muted=1.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>16b · Hodge Kaleidoscope</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #06071a; color: #f1e9ff;
    font: 14px/1.3 system-ui, -apple-system, sans-serif; }
  body { display: flex; flex-direction: column; }
  #wrap { position: relative; width: min(100vw, calc(100vh - 250px)); width: min(100vw, calc(100dvh - 250px)); aspect-ratio: 16 / 9;
    margin: 0 auto; flex: none; background: #000; }
  #wrap:fullscreen { width: 100vw; height: 100vh; aspect-ratio: auto; }

<body>

<script>
'use strict';
const $ = id => document.getElementById(id);
const query = new URLSearchParams(location.search);
const PRESET_NAMES = ['curve', 'k3', 'quintic', 'mirror', 'abelian'];
const AUTO = ['curve', 'k3', 'quintic'];
const params = { preset: 'auto', genus: 2, bpm: 120, bpb: 4, phrase: 8, spin: 1, tileRadius: 1.6, goldBoost: 1,
  trail: 0.96, floor: 0.3, bands: 'audio', labels: true, muted: false, bandGains: [1, 1, 1, 1, 1, 1, 1],
  kick: 'x...x...x...x...', snare: '....x.......x...', hat: 'x.x.x.x.x.x.x.x.' };

// ================================================================================================
// The numbers. Two independent write-ups: the Hodge numbers h^{p,q} by (p,q), and the spec's table
// (diamond rows bottom → top, left → right). QA checks they agree, plus both symmetries, Betti, Euler.
// ================================================================================================
function hodge(name, g = 2) {   // h[p][q] = h^{p,q}
  switch (name) {
    case 'curve':   return { n: 1, h: [[1, g], [g, 1]] };
    case 'k3':      return { n: 2, h: [[1, 0, 1], [0, 20, 0], [1, 0, 1]] };
    case 'quintic': return { n: 3, h: [[1, 0, 0, 1], [0, 1, 101, 0], [0, 101, 1, 0], [1, 0, 0, 1]] };
    case 'mirror':  return { n: 3, h: [[1, 0, 0, 1], [0, 101, 1, 0], [0, 1, 101, 0], [1, 0, 0, 1]] };
    case 'abelian': return { n: 2, h: [[1, 2, 1], [2, 4, 2], [1, 2, 1]] };
  }
  throw new Error('no preset ' + name);
}
const TITLE = { curve: g => `genus-${g} curve`, k3: () => 'K3 surface', quintic: () => 'quintic 3-fold',
  mirror: () => 'mirror quintic', abelian: () => 'abelian surface' };
// from the spec (#37 comment 6444942841), as written there
const TABLE = { curve: g => `1 / ${g} ${g} / 1`, k3: () => '1 / 0 0 / 1 20 1 / 0 0 / 1',
  quintic: () => '1 / 0 0 / 0 1 0 / 1 101 101 1 / 0 1 0 / 0 0 / 1',
  mirror: () => '1 / 0 0 / 0 101 0 / 1 1 1 1 / 0 101 0 / 0 0 / 1', abelian: () => '1 / 2 2 / 1 4 1 / 2 2 / 1' };
const BETTI = { curve: g => [1, 2 * g, 1], k3: () => [1, 0, 22, 0, 1], quintic: () => [1, 0, 1, 204, 1, 0, 1],
  mirror: () => [1, 0, 101, 4, 101, 0, 1], abelian: () => [1, 4, 6, 4, 1] };
const EULER = { curve: g => 2 - 2 * g, k3: () => 24, quintic: () => -200, mirror: () => 200, abelian: () => 0 };
// the cells of diamond row k, left → right on screen (x = (q−p)s grows to the right, so p falls)
function rowCells(n, k) { const out = []; for (let p = Math.min(k, n); p >= Math.max(0, k - n); p--) out.push([p, k - p]); return out; }
const rowSums = ({ n, h }) => Array.from({ length: 2 * n + 1 }, (_, k) => rowCells(n, k).reduce((s, [p, q]) => s + h[p][q], 0));
function check() {
  const details = [];
  let tableOk = true, symmetric = true, bettiOk = true, eulerOk = true;
  const cases = [...[0, 1, 2, 3, 4, 5, 6].map(g => ['curve', g]), ['k3', 0], ['quintic', 0], ['mirror', 0], ['abelian', 0]];
  for (const [name, g] of cases) {
    const d = hodge(name, g), { n, h } = d, rows = TABLE[name](g).split('/').map(r => r.trim().split(/\s+/).map(Number));
    let t = rows.length === 2 * n + 1;
    if (t) rows.forEach((r, k) => { const cells = rowCells(n, k); if (r.length !== cells.length || cells.some(([p, q], j) => h[p][q] !== r[j])) t = false; });
    let sym = true;
    for (let p = 0; p <= n; p++) for (let q = 0; q <= n; q++) if (h[p][q] !== h[q][p] || h[p][q] !== h[n - p][n - q]) sym = false;
    const b = rowSums(d), be = BETTI[name](g), bOk = b.length === be.length && b.every((x, i) => x === be[i]);
    const chi = b.reduce((s, x, k) => s + (k % 2 ? -x : x), 0), eOk = chi === EULER[name](g);
    tableOk = tableOk && t; symmetric = symmetric && sym; bettiOk = bettiOk && bOk; eulerOk = eulerOk && eOk;
    details.push({ preset: name, genus: name === 'curve' ? g : undefined, table: t, symmetric: sym, betti: b, bettiOk: bOk, euler: chi, eulerOk: eOk });
  }
  return { tableOk, symmetric, bettiOk, eulerOk, details };
}

// ================================================================================================
// metronome (as 14/19) + a 7-band analyser on what is heard (clicks, or the mic)
// ================================================================================================
const TAU = { kick: 0.150, snare: 0.120, hat: 0.040 };
const LANES = ['kick', 'snare', 'hat'];
const metronome = {
  ctx: null, master: null, noise: null, timer: 0, playing: false, nextTime: 0, step: 0, hits: [], steps: [], analyser: null, mic: null,
  ensure() {
    if (this.ctx) return;
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.ctx = ctx; this.master = ctx.createGain(); this.master.connect(ctx.destination);
    this.analyser = ctx.createAnalyser(); this.analyser.fftSize = 2048; this.analyser.smoothingTimeConstant = 0;
    this.master.connect(this.analyser);
    this.noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = this.noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  },
  start() {
    this.ensure();
    this.ctx.resume(); this.master.gain.value = params.muted ? 0 : 0.35;
    this.nextTime = this.ctx.currentTime + 0.05; this.step = 0; this.hits = []; this.steps = [];
    this.playing = true; this.timer = setInterval(() => this.schedule(), 25); this.schedule();
  },
  stop() { clearInterval(this.timer); this.playing = false; },
  setMuted(m) { if (this.master) this.master.gain.value = m ? 0 : 0.35; },
  async useMic() {
    this.ensure(); this.ctx.resume();
    const s = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    this.mic = this.ctx.createMediaStreamSource(s); this.mic.connect(this.analyser);
  },
  schedule() {
    while (this.nextTime < this.ctx.currentTime + 0.1) { this.queueStep(this.step, this.nextTime); this.nextTime += 60 / params.bpm / 4; this.step++; }
    const old = this.ctx.currentTime - 1;
    this.hits = this.hits.filter(h => h.time > old);
    while (this.steps.length > 2 && this.steps[1].time < old) this.steps.shift();
  },
  queueStep(step, time) {
    const inBar = step % (params.bpb * 4); this.steps.push({ time, step });
    for (const lane of LANES) { if (params[lane][inBar % 16] !== 'x') continue; const vel = inBar === 0 ? 1 : 0.7; this.hits.push({ lane, time, vel }); this.click(lane, time, vel); }
  },
  click(lane, t, vel) {
    const ctx = this.ctx, g = ctx.createGain(); g.connect(this.master);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vel, t + 0.003);
    let src;
    if (lane === 'kick') { src = ctx.createOscillator(); src.frequency.setValueAtTime(150, t); src.frequency.exponentialRampToValueAtTime(60, t + 0.08); src.connect(g); }
    else { src = ctx.createBufferSource(); src.buffer = this.noise; const f = ctx.createBiquadFilter(); f.type = lane === 'snare' ? 'bandpass' : 'highpass'; f.frequency.value = lane === 'snare' ? 1800 : 8000; src.connect(f); f.connect(g); }
    const end = t + TAU[lane] * 4; g.gain.exponentialRampToValueAtTime(0.001, end); src.start(t); src.stop(end + 0.01);
  },
  latency() { return this.ctx ? Math.min(0.3, this.ctx.outputLatency || this.ctx.baseLatency || 0) : 0; },
  read() {
    const out = { kick: 0, snare: 0, hat: 0, beats: -1 };
    if (!this.ctx) return out;
    const now = this.ctx.currentTime - this.latency();
    for (const h of this.hits) { const dt = now - h.time; if (dt >= 0) out[h.lane] = Math.max(out[h.lane], h.vel * (1 - Math.exp(-dt / 0.005)) * Math.exp(-dt / TAU[h.lane])); }
    let last = null; for (const s of this.steps) if (s.time <= now) last = s;
    if (last) out.beats = (last.step + Math.min(1, (now - last.time) / (60 / params.bpm / 4))) / 4;
    return out;
  },
};
// 7 log bands, 40 Hz – 16 kHz; level from dB, attack 30 ms, release 180 ms (no strobe: tails ≥ 120 ms)
const BAND_EDGES = Array.from({ length: 8 }, (_, i) => 40 * Math.pow(16000 / 40, i / 7));
const bandLevel = new Float32Array(7);
let fbuf = null;
function readBands(dt) {
  const A = metronome.analyser;
  const raw = new Float32Array(7);
  if (A && (metronome.playing || metronome.mic)) {
    if (!fbuf) fbuf = new Float32Array(A.frequencyBinCount);
    A.getFloatFrequencyData(fbuf);
    const hz = metronome.ctx.sampleRate / A.fftSize;
    for (let b = 0; b < 7; b++) {
      const i0 = Math.max(1, Math.floor(BAND_EDGES[b] / hz)), i1 = Math.max(i0 + 1, Math.ceil(BAND_EDGES[b + 1] / hz));
      let p = 0; for (let i = i0; i < i1 && i < fbuf.length; i++) p += Math.pow(10, fbuf[i] / 10);
      const db = 10 * Math.log10(p / (i1 - i0) + 1e-12);
      raw[b] = Math.min(1, Math.max(0, (db + 80) / 50));
    }
  }
  for (let b = 0; b < 7; b++) {
    const tau = raw[b] > bandLevel[b] ? 0.03 : 0.18;
    bandLevel[b] += (raw[b] - bandLevel[b]) * (1 - Math.exp(-dt / tau));
  }
}

// ================================================================================================
// WebGL2: scene → HDR, oil feedback (max of the new frame and the old one, zoomed and turned), tone map
// ================================================================================================
const canvas = $('c'), ov = $('ov'), octx = ov.getContext('2d'), hud = $('hud');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, preserveDrawingBuffer: false });
if (!gl) throw new Error('WebGL2 needed');
const floatOk = !!gl.getExtension('EXT_color_buffer_float');
gl.getExtension('OES_texture_float_linear');
const VS = `#version 300 es
void main(){ vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;
const SCENE_FS = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uZoom, uAng, uBreath, uTime, uMode, uGold, uKick, uSnare, uLabels;
uniform float uNA, uNB, uAA, uAB; uniform float uRA[16], uRB[16], uWA[16], uWB[16];
out vec4 o;
const float SIG = 0.15, CUT = 0.45, PI = 3.14159265;
const vec3 GOLD = vec3(1.0, 0.784, 0.239), MAG = vec3(1.0, 0.122, 0.557), TAN = vec3(1.0, 0.549, 0.102),
           ACID = vec3(0.714, 1.0, 0.102), COB = vec3(0.122, 0.294, 1.0);
vec3 film(float d) { vec3 lam = vec3(650.0, 532.0, 450.0); return 0.5 - 0.5 * cos(4.0 * PI * 1.33 * d / lam); }
vec3 hue(float p, float q) { float k = abs(p - q); return k < 0.5 ? GOLD : k < 1.5 ? MAG : k < 2.5 ? TAN : ACID; }
float sdOct(vec2 p, float r) { const vec3 k = vec3(-0.9238795, 0.3826834, 0.4142135); p = abs(p);
  p -= 2.0 * min(dot(k.xy, p), 0.0) * k.xy; p -= 2.0 * min(dot(vec2(-k.x, k.y), p), 0.0) * vec2(-k.x, k.y);
  p -= vec2(clamp(p.x, -k.z * r, k.z * r), r); return length(p) * sign(p.y); }
// one diamond (size n, gem radii R in units of s, glow weights W) at cell-local point loc (tile half-diagonal 1)
void diamond(vec2 loc, float n, float R[16], float W[16], float alpha, inout vec3 col, inout float glow) {
  if (n < 0.5) return;
  float s = 1.0 / (n + 0.7);
  float fp = (loc.y / s + n - loc.x / s) * 0.5, fq = (loc.y / s + n + loc.x / s) * 0.5;
  float p = floor(fp + 0.5), q = floor(fq + 0.5);
  if (p < 0.0 || q < 0.0 || p > n || q > n) return;
  vec2 c = vec2((q - p) * s, (p + q - n) * s), d = (loc - c) / s;
  int i = int(p) * 4 + int(q);
  float r = length(d), w = W[i], rad = R[i];
  if (r < CUT) glow += w * exp(-r * r / (2.0 * SIG * SIG));
  if (uMode > 0.5) return;
  vec3 base = hue(p, q) * (abs(p - q) < 0.5 ? (0.7 + 0.5 * uGold) : 1.0);
  // the glow, coloured
  if (r < CUT) col += base * w * exp(-r * r / (2.0 * SIG * SIG)) * 1.2;
  // a faint ring marks every cell of the diamond, so the zeros are visible
  col += base * 0.10 * alpha * smoothstep(0.012, 0.0, abs(r - 0.13));
  if (rad > 0.002) {
    float sd = sdOct(d, rad);
    if (sd < 0.0) {
      float a = atan(d.y, d.x), facet = floor(a / (2.0 * PI) * 8.0 + 0.5), rr = r / rad;
      float th = 320.0 + 220.0 * sin(facet * 1.7 + uTime * 0.3 + p * 1.3 + q * 0.7) + 260.0 * rr + 90.0 * uSnare;
      float table = smoothstep(0.42, 0.38, rr);
      vec3 f = film(th);
      float light = mix(0.55 + 0.45 * cos(facet * 0.785 - uTime * 0.2), 0.95, table);
      vec3 g = base * (0.30 + 0.70 * f) * light * (1.0 + 0.35 * uKick);
      float edge = smoothstep(-0.03, 0.0, sd);
      col = mix(g, base * 1.6, edge * 0.6);
    } else {
      col += base * 0.35 * exp(-sd * 40.0);   // rim light
    }
  }
}
void main() {
  vec2 p = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y * 2.0 * uZoom;
  vec3 col = vec3(0.0); float glow = 0.0;
  vec2 loc;
  float tile = 0.0;
  if (uMode > 0.5) { loc = p; }
  else {
    float ca = cos(uAng), sa = sin(uAng);
    p = mat2(ca, sa, -sa, ca) * p / uBreath;
    // p4m: rotate 45°, fold across the square cell's edges (half-side a), rotate back
    const float a = 0.70710678;
    vec2 uv = vec2(p.x + p.y, p.y - p.x) * 0.70710678;
    vec2 cell = floor((uv + a) / (2.0 * a));
    tile = max(abs(cell.x), abs(cell.y));
    vec2 f = abs(mod(uv - a, 4.0 * a) - 2.0 * a) - a;
    loc = vec2(f.x - f.y, f.x + f.y) * 0.70710678;
    // background: deep cobalt-violet with slow marbling
    float m = sin(3.0 * p.x + 1.7 * sin(2.3 * p.y + uTime * 0.21)) * sin(2.6 * p.y - 1.3 * sin(1.9 * p.x - uTime * 0.17));
    col = mix(vec3(0.020, 0.025, 0.11), vec3(0.09, 0.02, 0.14), 0.5 + 0.5 * m);
    // outer mirrors (decoration): the cell edges
    float e = min(abs(abs(f.x) - a), abs(abs(f.y) - a));
    col += COB * 0.25 * smoothstep(0.012, 0.0, e);
    // inner mirrors, only in the fundamental cell: Hodge (x = 0), both (y = 0), Serre (the centre point)
    if (tile < 0.5 && uLabels > 0.5) {
      col += GOLD * 0.18 * smoothstep(0.006, 0.0, abs(loc.x)) * step(0.5, fract(loc.y * 12.0));
      col += GOLD * 0.12 * smoothstep(0.006, 0.0, abs(loc.y)) * step(0.5, fract(loc.x * 12.0));
      col += GOLD * 0.5 * smoothstep(0.03, 0.015, length(loc));
    }
  }
  diamond(loc, uNA, uRA, uWA, uAA, col, glow);
  diamond(loc, uNB, uRB, uWB, uAB, col, glow);
  o = uMode > 0.5 ? vec4(glow, 0.0, 0.0, 1.0) : vec4(col, 1.0);
}`;
const FB_FS = `#version 300 es
precision highp float;
uniform sampler2D uCur, uPrev; uniform vec2 uRes; uniform float uDecay, uZoomFb, uTurn;
out vec4 o;
void main() {
