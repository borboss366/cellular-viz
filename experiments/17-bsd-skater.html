<!doctype html>
<!--
  17 · BSD Skater   (Millennium track #37: 10 take two, the user's idea; spec #37 comment 6391386393)

  The elliptic curve y² = x³ + ax + b becomes a glowing half-pipe and the camera is a skater
  riding it. Pace (the user: "way slower, chill"): by default the skater carves slowly along
  the pipe and lands one trick every 4 bars, each trick floating over 2 bars, with the camera
  low over the ramp (?cam). Trick pacing (user: still too often and too fast, ~4× slower):
  trickOn = sections (a trick at each phrase's drop and change, phrase = trickEvery = 16 bars),
  bars (every trickEvery bars) or drops; a trick lasts 2/trickSpeed bars (8 at 0.25), and one
  that would overlap the last is skipped; glideSpeed sets the carving. A grind every 4th trick (?pace=beat is the first
  version: one trick per beat, a grind on each downbeat). The tricks are the group law, exact:
    add (every beat)   ollie along the chord from P through Q, land on the third crossing R,
                       then flip across the x-axis onto P + Q = −R
    double (downbeat)  grind along the tangent at P to where it meets the curve again, flip to 2P
    big air            when the sum is the point at infinity O (the line is vertical), launch
                       straight up into the sky and drop back in, reseeded, on the next bar
  The real points stay exact BigInt fractions (as in 10); floats are only for drawing. The view
  squashes the plane with asinh (x, y → 3·asinh(v/3)) so huge points stay on screen; it is odd,
  so the flip across the x-axis is still a mirror. Chords are drawn through the same squash.
  Below, the curve mod p is a city of lights rebuilt each bar for the next good prime, with
  a_p = p + 1 − #E(F_p) setting its brightness. On x³+17 its whole-number points are coins.
  Default curve x³−25x (the user's "maybe"): two pieces, a closed egg and the main run.
  window.__qa: the last hop as exact "n/d" strings {type, P, Q, R, sum} plus onCurve flags,
  bigAirs (each with the reason), p, count, ap, hasse, countPoints(a, b, p).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>17 · BSD Skater</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #05070c; color: #e8eef5;
    font: 14px/1.3 system-ui, -apple-system, sans-serif; }
  body { display: flex; flex-direction: column; }
  #wrap { position: relative; width: min(100vw, calc(100vh - 250px)); width: min(100vw, calc(100dvh - 250px)); aspect-ratio: 1;
    margin: 0 auto; flex: none; background: #000; }
  #wrap:fullscreen { width: 100vw; height: 100vh; aspect-ratio: auto; }
  #wrap:fullscreen #hud { display: none; }
  canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  #hud { position: absolute; left: 6px; bottom: 6px; padding: 4px 7px; border-radius: 6px;
    background: rgba(0,0,0,.55); font: 12px/1.35 ui-monospace, Menlo, monospace;
    white-space: pre-wrap; max-width: calc(100% - 12px); pointer-events: none; }
  #panel { flex: 1; min-height: 200px; padding: 8px 12px 16px; }

<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud">loading…</div>
</div>
<div id="panel">
  <div class="buttons">
    <button id="play">▶ Play</button>
    <button id="mute">Mute clicks</button>
    <button id="full">Fullscreen</button>
  </div>
  <h3>Curve</h3>
  <div class="buttons" id="presets"></div>
  <div class="buttons"><button id="reseed">Reseed</button></div>
  <div class="row"><label for="bpm">BPM</label><input id="bpm" type="range" min="60" max="180" step="1"><output id="bpmOut"></output></div>
  <h3>Pace</h3>
  <div class="buttons"><button id="pace-chill">Chill: slide, trick now and then</button><button id="pace-beat">Trick every beat</button></div>
  <div class="buttons" id="trickOn"><button data-on="sections">tricks on sections</button><button data-on="bars">every N bars</button><button data-on="drops">drops only</button></div>
  <div class="row"><label for="trickEvery">trick every</label><input id="trickEvery" type="range" min="4" max="64" step="4"><output id="trickEveryOut"></output></div>
  <div class="row"><label for="trickSpeed">trick speed</label><input id="trickSpeed" type="range" min="0.25" max="2" step="0.05"><output id="trickSpeedOut"></output></div>
  <div class="row"><label for="glideSpeed">glide speed</label><input id="glideSpeed" type="range" min="0.25" max="2" step="0.05"><output id="glideSpeedOut"></output></div>
  <div class="row"><label for="cam">camera</label><input id="cam" type="range" min="0.2" max="1.5" step="0.05"><output id="camOut"></output></div>
  <div class="row"><label for="slide">slide</label><input id="slide" type="range" min="0" max="4" step="0.1"><output id="slideOut"></output></div>
  <div class="row"><label for="hops">hops / reseed</label><input id="hops" type="range" min="4" max="64" step="1"><output id="hopsOut"></output></div>
  <div class="buttons"><button id="copy" class="wide">Copy setup</button></div>
  <a href="../index.html">← all experiments</a>
</div>

<script>
'use strict';

const query = new URLSearchParams(location.search);
// pace: 'chill' (default, the user's ask: "way slower, chill, slowly slides and sometimes jumps")
// carves along the half-pipe and lands a trick on the schedule (trickOn, trickEvery); 'beat' is the first
// version, one trick on every beat (?pace=beat).
// curve: x3-2x is the user's pick in the chill grades (3–0)
const params = { curve: 'x3-2x', bpm: 120, bpb: 4, hops: 24, pmax: 1500, muted: false,
                 pace: 'chill', trickEvery: 16, trickSpeed: 0.25, trickOn: 'sections', glideSpeed: 0.5, slide: 1.4, cam: 0.5,
                 kick: 'x...x...x...x...', snare: '....x.......x...', hat: 'x.x.x.x.x.x.x.x.' };

// ---------- exact rationals and the group law (as 10) ----------
const babs = n => n < 0n ? -n : n;
function bgcd(a, b) { a = babs(a); b = babs(b); while (b) [a, b] = [b, a % b]; return a; }
function F(n, d = 1n) { n = BigInt(n); d = BigInt(d); if (d < 0n) { n = -n; d = -d; } const g = bgcd(n, d) || 1n; return { n: n / g, d: d / g }; }
const fadd = (p, q) => F(p.n * q.d + q.n * p.d, p.d * q.d);
const fsub = (p, q) => F(p.n * q.d - q.n * p.d, p.d * q.d);
const fmul = (p, q) => F(p.n * q.n, p.d * q.d);
const fdiv = (p, q) => F(p.n * q.d, p.d * q.n);
const feq = (p, q) => p.n === q.n && p.d === q.d;
const fneg = p => ({ n: -p.n, d: p.d });
const fstr = p => p.d === 1n ? `${p.n}` : `${p.n}/${p.d}`;
const blen = n => babs(n).toString(2).length;
function fnum(p) { const s = Math.max(0, Math.max(blen(p.n), blen(p.d)) - 60); const n = Number(p.n >> BigInt(s)), d = Number(p.d >> BigInt(s)); return d === 0 ? Math.sign(n) * Infinity : n / d; }

const PRESETS = {
  'x3-25x': { label: 'x³−25x', a: -25, b: 0, P: [-4, 6], G: [45, 300] },   // (45, 300): 91125 − 1125 = 90000
  'x3+17':  { label: 'x³+17',  a: 0,   b: 17, P: [2, 5], G: [-1, 4] },
  'x3-2x':  { label: 'x³−2x',  a: -2,  b: 0, P: [2, 2], G: [-1, 1] },
};
const curve = { key: 'x3-25x', a: -25, b: 0, A: F(-25) };
const onCurve = P => !P || feq(fmul(P.y, P.y), fadd(fadd(fmul(fmul(P.x, P.x), P.x), fmul(curve.A, P.x)), F(curve.b)));
function third(P, Q, s) {
  const xr = fsub(fsub(fmul(s, s), P.x), Q.x);
  const yr = fadd(P.y, fmul(s, fsub(xr, P.x)));
  return { sum: { x: xr, y: fneg(yr) }, R: { x: xr, y: yr } };
}
function dbl(P) {
  if (!P || P.y.n === 0n) return { sum: null, R: null, why: 'vertical tangent (y = 0)' };
  return third(P, P, fdiv(fadd(fmul(F(3), fmul(P.x, P.x)), curve.A), fmul(F(2), P.y)));
}
function add(P, Q) {
  if (feq(P.x, Q.x)) return feq(P.y, Q.y) ? dbl(P) : { sum: null, R: null, why: 'P + (−P): vertical chord' };
  return third(P, Q, fdiv(fsub(Q.y, P.y), fsub(Q.x, P.x)));
}
const pt = ([x, y]) => ({ x: F(x), y: F(y) });

// ---------- mod p (as 10) ----------
function countPoints(a, b, p) {
  const cnt = new Int32Array(p); for (let y = 0; y < p; y++) cnt[(y * y) % p]++;
  const am = ((a % p) + p) % p, bm = ((b % p) + p) % p; let N = 1;
  for (let x = 0; x < p; x++) N += cnt[((x * x % p) * x % p + am * x % p + bm) % p];
  return N;
}
function cellsMod(a, b, p) {
  const roots = Array.from({ length: p }, () => []); for (let y = 0; y < p; y++) roots[(y * y) % p].push(y);
  const am = ((a % p) + p) % p, bm = ((b % p) + p) % p, out = [];
  for (let x = 0; x < p; x++) for (const y of roots[((x * x % p) * x % p + am * x % p + bm) % p]) out.push(x, y);
  return out;
}
const PRIMES = (() => { const n = 5001, s = new Uint8Array(n), o = []; for (let i = 2; i < n; i++) { if (s[i]) continue; o.push(i); for (let j = i * i; j < n; j += i) s[j] = 1; } return o; })();
const isBad = p => p === 2 || p === 3 || ((4 * curve.a ** 3 + 27 * curve.b ** 2) % p === 0);

// ---------- the view squash ----------
const SQ = 3;
const M = v => SQ * Math.asinh(v / SQ);
const Minv = X => SQ * Math.sinh(X / SQ);
const fx = x => x * x * x + curve.a * x + curve.b;

// ---------- metronome (as 04, reduced) ----------
const TAU = { kick: 0.150, snare: 0.120, hat: 0.040 };
const LANES = ['kick', 'snare', 'hat'];
const metronome = {
  ctx: null, master: null, noise: null, timer: 0, playing: false, nextTime: 0, step: 0, hits: [], steps: [],
  start() {
    if (!this.ctx) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.ctx = ctx; this.master = ctx.createGain(); this.master.connect(ctx.destination);
      this.noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = this.noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    this.ctx.resume(); this.master.gain.value = params.muted ? 0 : 0.35;
    this.nextTime = this.ctx.currentTime + 0.05; this.step = 0; this.hits = []; this.steps = [];
    this.playing = true; this.timer = setInterval(() => this.schedule(), 25); this.schedule();
  },
  stop() { clearInterval(this.timer); this.playing = false; },
  setMuted(m) { if (this.master) this.master.gain.value = m ? 0 : 0.35; },
  schedule() {
    while (this.nextTime < this.ctx.currentTime + 0.1) { this.queueStep(this.step, this.nextTime); this.nextTime += 60 / params.bpm / 4; this.step++; }
    const old = this.ctx.currentTime - 1;
    this.hits = this.hits.filter(h => h.time > old);
    while (this.steps.length > 2 && this.steps[1].time < old) this.steps.shift();
  },
  queueStep(step, time) {
    const inBar = step % (params.bpb * 4); this.steps.push({ time, step });
    for (const lane of LANES) { if (params[lane][inBar % 16] !== 'x') continue; const vel = inBar === 0 ? 1 : 0.7; this.hits.push({ lane, time, vel }); this.click(lane, time, vel); }
  },
  click(lane, t, vel) {
    const ctx = this.ctx, g = ctx.createGain(); g.connect(this.master);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vel, t + 0.003);
    let src;
    if (lane === 'kick') { src = ctx.createOscillator(); src.frequency.setValueAtTime(150, t); src.frequency.exponentialRampToValueAtTime(60, t + 0.08); src.connect(g); }
    else { src = ctx.createBufferSource(); src.buffer = this.noise; const f = ctx.createBiquadFilter(); f.type = lane === 'snare' ? 'bandpass' : 'highpass'; f.frequency.value = lane === 'snare' ? 1800 : 8000; src.connect(f); f.connect(g); }
    const end = t + TAU[lane] * 4; g.gain.exponentialRampToValueAtTime(0.001, end); src.start(t); src.stop(end + 0.01);
  },
  // levels and the beat position, at the moment the listener hears it
  read() {
    const out = { kick: 0, snare: 0, hat: 0, beats: -1 };
    if (!this.ctx) return out;
    const now = this.ctx.currentTime - Math.min(0.3, this.ctx.outputLatency || this.ctx.baseLatency || 0);
    for (const h of this.hits) { const dt = now - h.time; if (dt >= 0) out[h.lane] = Math.max(out[h.lane], h.vel * (1 - Math.exp(-dt / 0.005)) * Math.exp(-dt / TAU[h.lane])); }
    let last = null; for (const s of this.steps) if (s.time <= now) last = s;
    if (last) out.beats = (last.step + Math.min(1, (now - last.time) / (60 / params.bpm / 4))) / 4;
    return out;
  },
};

// ---------- WebGL ----------
const canvas = document.getElementById('c');
const hud = document.getElementById('hud');
const gl = canvas.getContext('webgl2', { antialias: true, alpha: false });
if (!gl) fail('WebGL2 is not available in this browser.');
function fail(msg) { hud.textContent = msg; throw new Error(msg); }
function compile(type, src) { const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh); if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) fail('Shader error:\n' + gl.getShaderInfoLog(sh)); return sh; }
function program(vs, fs) {
  const p = gl.createProgram(); gl.attachShader(p, compile(gl.VERTEX_SHADER, vs)); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) fail('Link error:\n' + gl.getProgramInfoLog(p));
  const u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const nm = gl.getActiveUniform(p, i).name.replace('[0]', ''); u[nm] = gl.getUniformLocation(p, nm); }
  return { p, u };
}
const skyProg = program(`#version 300 es
out vec2 vUv;
void main() { vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); vUv = p; gl_Position = vec4(p * 2.0 - 1.0, 0.999, 1.0); }`, `#version 300 es
precision highp float;
uniform float uFlash, uAir;
in vec2 vUv; out vec4 o;
void main() {
  vec3 c = mix(vec3(0.01, 0.01, 0.03), vec3(0.07, 0.03, 0.12), vUv.y);
  c += vec3(0.6, 0.7, 1.0) * uAir * smoothstep(0.3, 1.0, vUv.y);   // the point at infinity is up there
  o = vec4(c + uFlash * 0.35, 1.0);
}`);
const meshProg = program(`#version 300 es
layout(location = 0) in vec3 aPos;
layout(location = 1) in vec3 aNor;
layout(location = 2) in vec2 aData;   // arc length, kind (0 surface, 1 rail)
uniform mat4 uVP;
out vec3 vP; out vec3 vN; out vec2 vD;
void main() { vP = aPos; vN = aNor; vD = aData; gl_Position = uVP * vec4(aPos, 1.0); }`, `#version 300 es
precision highp float;
uniform vec3 uEye; uniform float uKick, uHat, uBeat;
in vec3 vP; in vec3 vN; in vec2 vD; out vec4 o;
void main() {
  float fog = exp(-length(uEye - vP) * 0.045);
  if (vD.y > 0.5) {   // rails: neon
    float fres = pow(1.0 - abs(dot(normalize(vN), normalize(uEye - vP))), 1.5);
    vec3 c = vec3(0.25, 0.85, 1.0) * (0.6 + 1.2 * fres) * (1.0 + 0.8 * uKick);
    o = vec4(c * fog, 1.0);
  } else {            // the half-pipe floor: dim, with ties that run on the beat
    float tie = smoothstep(0.92, 1.0, fract(vD.x * 1.5 - uBeat));
    vec3 c = vec3(0.05, 0.12, 0.2) + vec3(0.3, 0.6, 1.0) * tie * (0.35 + 0.8 * uKick) + vec3(1.0) * uHat * 0.04;
    o = vec4(c * fog, 1.0);
  }
}`);
const pointProg = program(`#version 300 es
layout(location = 0) in vec3 aPos;
layout(location = 1) in vec4 aCol;   // rgb, size
uniform mat4 uVP; uniform float uScale;
out vec3 vC;
void main() { gl_Position = uVP * vec4(aPos, 1.0); gl_PointSize = clamp(aCol.a * uScale / gl_Position.w, 1.0, 64.0); vC = aCol.rgb; }`, `#version 300 es
precision highp float;
in vec3 vC; out vec4 o;
void main() { float d = length(gl_PointCoord - 0.5) * 2.0; o = vec4(vC * (1.0 - smoothstep(0.2, 1.0, d)), 1.0); }`);
const lineProg = program(`#version 300 es
layout(location = 0) in vec3 aPos;
uniform mat4 uVP;
void main() { gl_Position = uVP * vec4(aPos, 1.0); }`, `#version 300 es
precision highp float;
uniform vec4 uColor; out vec4 o;
void main() { o = uColor; }`);
const emptyVao = gl.createVertexArray();

// ---------- matrices ----------
function perspective(fovy, aspect, near, far) { const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far); return new Float32Array([f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) * nf, -1, 0, 0, 2 * far * near * nf, 0]); }
const sub3 = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const add3 = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const mul3 = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross3 = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm3 = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const lerp3 = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
function lookAt(eye, at, up) { const z = norm3(sub3(eye, at)), x = norm3(cross3(up, z)), y = cross3(z, x); return new Float32Array([x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, -dot3(x, eye), -dot3(y, eye), -dot3(z, eye), 1]); }
function mul4(a, b) { const o = new Float32Array(16); for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + j] * b[i * 4 + k]; o[i * 4 + j] = s; } return o; }

// ---------- the track: branches of the real curve, squashed, as a half-pipe ----------
const HALF = 0.45, RAIL_R = 0.045, XMAX = 400;
const HEIGHT_BITS = 600;   // reseed once a point's x needs more than this many bits
function branches() {   // polylines of [X, Y] in squashed space
  const X0 = M(-60), X1 = M(XMAX), N = 6000, runs = []; let cur = null;
  const root = (lo, hi) => { for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if (Math.sign(fx(m)) === Math.sign(fx(lo))) lo = m; else hi = m; } return (lo + hi) / 2; };
  let prevX = null;
  for (let i = 0; i <= N; i++) {
    const x = Minv(X0 + (X1 - X0) * i / N), v = fx(x);
    if (v >= 0) {
      if (!cur) { cur = []; if (prevX !== null) cur.push(root(prevX, x)); }
      cur.push(x);
    } else if (cur) { cur.push(root(cur[cur.length - 1], x)); runs.push(cur); cur = null; }
    prevX = x;
  }
  if (cur) runs.push(cur);
  // each run of x becomes one polyline: lower half back to the root, then the upper half
  return runs.map(xs => {
    const up = xs.map(x => [M(x), M(Math.sqrt(Math.max(0, fx(x))))]);
    const lo = up.map(([X, Y]) => [X, -Y]).reverse();
    const closed = fx(xs[xs.length - 1] + 1e-6) < 0 || xs[xs.length - 1] < XMAX * 0.99;   // the egg closes
    return closed ? [...up, ...lo.slice(1)] : [...lo, ...up.slice(1)];
  });
}
let track = null;
function buildTrack() {
  const pos = [], nor = [], dat = [], idx = [];
  const pushTube = (pts, zoff) => {   // a rail along a polyline in the z = zoff plane
    const base = pos.length / 3, RING = 6;
    for (let i = 0; i < pts.length; i++) {
      const p = [pts[i][0], pts[i][1], zoff];
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
      const T = norm3([b[0] - a[0], b[1] - a[1], 0]), N1 = [-T[1], T[0], 0], N2 = [0, 0, 1];
      for (let r = 0; r < RING; r++) {
        const ang = r / RING * Math.PI * 2, n = add3(mul3(N1, Math.cos(ang)), mul3(N2, Math.sin(ang)));
        pos.push(...add3(p, mul3(n, RAIL_R))); nor.push(...n); dat.push(0, 1);
      }

    const arr = [], ext = 0.6;
    for (let i = 0; i <= 96; i++) {
      const t = -ext + (1 + 2 * ext) * i / 96, x = h.P[0] + (h.R[0] - h.P[0]) * t, y = h.P[1] + (h.R[1] - h.P[1]) * t;
      arr.push(M(x), M(y), 0);
    }
    arr.push(M(h.S[0]), M(h.R[1]), 0, M(h.S[0]), M(h.S[1]), 0);   // the flip, R to −R
    fill(chordBuf, arr);
    gl.useProgram(lineProg.p); gl.uniformMatrix4fv(lineProg.u.uVP, false, vp);
    gl.uniform4f(lineProg.u.uColor, 1.0, 0.8, 0.45, 0.65 * (1 - u * 0.7) * (1 - w));
    gl.bindVertexArray(chordBuf.vao); gl.drawArrays(gl.LINE_STRIP, 0, 97); gl.drawArrays(gl.LINES, 97, 2);
  }
  // sprites: P, Q, R markers, coins, the skater and its trail
  const sp = [];
  const mark = (q, c, s) => { if (q && q.every(Number.isFinite)) sp.push(M(q[0]), M(q[1]), 0, ...c, s); };
  if (h && h.type !== 'air') { mark(h.Q, [0.4, 0.8, 1.0], 22); mark(h.R, [1.0, 0.7, 0.3], 18); mark(h.S, [1.0, 1.0, 0.9], 26); }
  for (const [cx, cy] of st.coins) {
    const pos = W3(cx, cy, 0), near = Math.hypot(pos[0] - sk.pos[0], pos[1] - sk.pos[1]) < 0.35;
    if (near) st.coinFlash.set(`${cx},${cy}`, now);
    const f = Math.max(0, 1 - (now - (st.coinFlash.get(`${cx},${cy}`) || -1e9)) / 600);
    sp.push(...pos, 1.0, 0.85, 0.2, 18 + 40 * f);
  }
  st.trail.forEach((q, i) => sp.push(...q, 1.0, 0.55, 0.2, 6 + 10 * i / st.trail.length));
  sp.push(...sk.pos, 1.0, 1.0, 1.0, 30 * (1 + 0.6 * L.kick));
  fill(fxBuf, sp); fxBuf.count = sp.length / 7;
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(pointProg.p); gl.uniformMatrix4fv(pointProg.u.uVP, false, vp); gl.uniform1f(pointProg.u.uScale, H / 120);
  gl.bindVertexArray(fxBuf.vao); gl.drawArrays(gl.POINTS, 0, fxBuf.count);
  gl.disable(gl.BLEND);

  Object.assign(window.__qa, { beats, errors });
  frames++;
  if (now - lastFpsTime > 500) { fps = Math.round(frames * 1000 / (now - lastFpsTime)); frames = 0; lastFpsTime = now; }
  if (now - lastHud > 200) {
    lastHud = now;
    const state = metronome.playing ? '▶' : (metronome.ctx ? '■' : 'tap ▶ Play');
    const t = h ? (h.type === 'air' ? 'BIG AIR (sum = O)' : h.type === 'dbl' ? 'grind: 2P' : 'ollie: P + G') : '';
    hud.textContent = `BSD skater · y² = ${PRESETS[curve.key].label} · ${params.bpm} bpm · ${state}\n` +
      `${t} · hop ${st.hops}/${params.hops} · height ${Math.max(blen(st.P.x.n), blen(st.P.x.d))} bits\n` +
      `p ${st.p} · a_p ${st.ap} · ${W}×${H} · ${fps} fps`;
  }
}

const q = k => query.get(k);
for (const k of ['bpm', 'hops', 'trickEvery', 'trickSpeed', 'glideSpeed', 'slide', 'cam']) { const v = parseFloat(q(k)); if (Number.isFinite(v)) params[k] = v; }
if (['bars', 'sections', 'drops'].includes(q('trickOn'))) params.trickOn = q('trickOn');
if (q('pace') === 'beat' || q('pace') === 'chill') params.pace = q('pace');
params.muted = q('muted') === '1';
window.__qa = { errors, events };
setCurve(q('curve') || params.curve);
sync();
requestAnimationFrame(frame);
</script>
</body>
