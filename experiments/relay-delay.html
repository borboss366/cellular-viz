<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>relay delay</title>
<!--
  The beat relay's delay from a browser (docs/CELLULAR_VIZ_BRIEF_BEAT_SERVER.md task 6; the steps:
  docs/BEAT_RELAY_DELAY.md). Served at / by the TEST relay (node qa/relay-delay.mjs --serve), so it reaches the
  box through the tunnel without a conduct-serve restart; it also works on any page origin with a relay at /relay.
  Two sockets on this page: one sends { type: 'delay-probe', v: 1, i, t } at the rate set below, the other takes
  now - t for each (one clock, so no offset in it): sender -> relay -> receiver, as a scene sees the conductor.
  Also 20 time-ask pings: the round trip to the relay and its clock offset (the box's clock against this machine's).
  "Download" saves the numbers as JSON. Plain ASCII only (#205).
-->
<style>
:root{color-scheme:dark}body{margin:0;font:16px/1.45 system-ui,sans-serif;background:#0b0e14;color:#dde3ee}
main{max-width:760px;margin:0 auto;padding:16px}h1{font-size:20px;margin:0 0 8px}
button{font:inherit;color:inherit;background:#2b5cff;border:0;border-radius:8px;padding:8px 16px;cursor:pointer}
button:disabled{background:#3a4560;cursor:default}input{width:5em;font:inherit}
table{border-collapse:collapse;margin-top:12px}td,th{padding:4px 12px;border-bottom:1px solid #222a3a;text-align:right}
th:first-child,td:first-child{text-align:left}small{color:#8a96ad}
</style>
</head>
<body>
<main>
  <h1>Relay delay</h1>
  <p>Probes <input id="n" value="600"> at <input id="rate" value="20"> a second, <input id="bytes" value="300"> bytes each.</p>
  <p><button id="run">Start</button> <button id="save" disabled>Download</button> <small id="state">ready</small></p>
  <table id="out"></table>
</main>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const url = (location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/relay?v=1';
  const now = () => performance.now();
  const r2 = x => Math.round(x * 100) / 100;
  const pct = (s, p) => (s.length ? s[Math.min(s.length - 1, Math.max(0, Math.ceil(p / 100 * s.length) - 1))] : null);
  const sum = (d, sent) => {
    const s = d.slice().sort((a, b) => a - b);
    return { sent, got: s.length, lost: Math.max(0, sent - s.length), p50: s.length ? r2(pct(s, 50)) : null, p90: s.length ? r2(pct(s, 90)) : null,
      p99: s.length ? r2(pct(s, 99)) : null, max: s.length ? r2(s[s.length - 1]) : null };
  };
  const open = () => new Promise((resolve, reject) => {
    const ws = new WebSocket(url);
    const t = setTimeout(() => reject(new Error('no hello in 5 s')), 5000);
    ws.onmessage = e => { let m = null; try { m = JSON.parse(e.data); } catch (err) { m = null; } if (m && m.type === 'hello') { clearTimeout(t); ws.onmessage = null; resolve(ws); } };
    ws.onerror = () => { clearTimeout(t); reject(new Error('the socket failed: is the test relay running, and the tunnel open?')); };
  });
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  let last = null;
  window.__qa = Object.assign(window.__qa || {}, {});
  Object.defineProperty(window.__qa, 'relayDelay', { get: () => last, configurable: true, enumerable: true });
  function show(res) {
    const rows = [['', 'p50 ms', 'p90 ms', 'p99 ms', 'max ms', 'got', 'lost'],
      ['sender to receiver', res.probes.p50, res.probes.p90, res.probes.p99, res.probes.max, res.probes.got, res.probes.lost],
      ['round trip to the relay', res.rtt.p50, res.rtt.p90, res.rtt.p99, res.rtt.max, res.rtt.got, res.rtt.lost]];
    $('out').innerHTML = '';
    rows.forEach((r, i) => { const tr = document.createElement('tr'); for (const c of r) { const td = document.createElement(i ? 'td' : 'th'); td.textContent = c === null ? '-' : String(c); tr.append(td); } $('out').append(tr); });
    const tr = document.createElement('tr'), td = document.createElement('td');
    td.colSpan = 7; td.textContent = `relay clock offset (relay minus this machine): ${res.relayOffsetMs === null ? '-' : res.relayOffsetMs + ' ms'}`;
    tr.append(td); $('out').append(tr);
  }
  $('run').onclick = async () => {
    const n = Math.max(1, Math.min(20000, Number($('n').value) || 600)), rate = Math.max(1, Math.min(200, Number($('rate').value) || 20));
    const bytes = Math.max(60, Math.min(60000, Number($('bytes').value) || 300));
    $('run').disabled = true; $('save').disabled = true; $('state').textContent = 'opening ...';
    let tx = null, rx = null;
    try {
      tx = await open(); rx = await open();
      // the round trip and the relay's clock: 20 time-ask pings
      const rtts = [], offs = [];
      for (let i = 0; i < 20; i++) {
        const t0 = now(), wall0 = performance.timeOrigin + t0;
        const ans = await new Promise(resolve => {
          const to = setTimeout(() => resolve(null), 2000);
          tx.onmessage = e => { let m = null; try { m = JSON.parse(e.data); } catch (err) { m = null; } if (m && m.type === 'time' && m.id === i) { clearTimeout(to); resolve(m); } };
          tx.send(JSON.stringify({ type: 'time-ask', v: 1, id: i, t0: wall0 }));
        });
        const t1 = now();
        if (ans) { rtts.push(t1 - t0); offs.push({ rtt: t1 - t0, off: ans.ts - (wall0 + (t1 - t0) / 2) }); }
        await sleep(50);
      }
      tx.onmessage = null;
      const best = offs.length ? offs.reduce((a, b) => (b.rtt < a.rtt ? b : a)) : null;
      // the probes
      const delays = new Array(n).fill(NaN);
      rx.onmessage = e => { let m = null; try { m = JSON.parse(e.data); } catch (err) { m = null; } if (m && m.type === 'delay-probe' && m.i >= 0 && m.i < n && Number.isNaN(delays[m.i])) delays[m.i] = now() - m.t; };
      const pad = 'x'.repeat(bytes - 60), gap = 1000 / rate, t0 = now();
      for (let i = 0; i < n; i++) {
        const wait = t0 + i * gap - now();
        if (wait > 0) await sleep(wait);
        tx.send(JSON.stringify({ type: 'delay-probe', v: 1, i, t: now(), pad }));
        if (i % rate === 0) $('state').textContent = `probing ${i} / ${n} ...`;
      }
      await sleep(1500);
      last = { at: new Date().toISOString(), page: location.host, n, rate, bytes, userAgent: navigator.userAgent,
        probes: sum(delays.filter(x => !Number.isNaN(x)), n), rtt: sum(rtts, 20), relayOffsetMs: best ? r2(best.off) : null };
      show(last);
      $('state').textContent = 'done'; $('save').disabled = false;
    } catch (e) {
      $('state').textContent = String((e && e.message) || e);
    } finally {
      for (const s of [tx, rx]) { try { if (s) s.close(); } catch (e) { /* closed */ } }
      $('run').disabled = false;
    }
  };
  $('save').onclick = () => {
    if (!last) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(last, null, 1) + '\n'], { type: 'application/json' }));
    a.download = 'relay-delay-' + last.at.replace(/[:.]/g, '-') + '.json';
    a.click();
  };
})();
</script>
</body>
</html>
