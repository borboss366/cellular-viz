<!doctype html>
<!--
  19 · Skate Park   (Millennium track #37, BSD; spec: #37 comment 6396657302)

  17 kept the skater on the real picture of one elliptic curve. The user: "it is about the
  path", slower, the camera close to the ramp, and more complicated ramps even if they are not
  exact BSD. Three tracks, each a preset; `auto` moves on every 2 sections. The rider glides
  slowly along a neon rail with a low camera close behind it. Tricks follow 17's schedule
  (trickOn sections | bars | drops, trickEvery, trickSpeed: at 0.25 a 2-bar hang takes 8 bars,
  never overlapping); a section change outside a trick is a low 1-bar transfer.

    torus  Over the complex numbers an elliptic curve is a torus. The donut glows with its
           period lattice, and the rail is a straight line on the flat torus, which in 3-D is a
           (p, q) torus knot: ((R + r cos qt) cos pt, (R + r cos qt) sin pt, r sin qt). The beads
           are the 24-torsion points n·P along that line, lit one per beat. The knot changes
           every section, (2,3) → (3,5) → (5,8), and the rider jumps from the old knot onto the
           new one; the drop trick is a hop along the knot.
    morph  The family y² = x³ − 3x + b, drawn as rails in the plane. During the build-up b
           rises from 0 to 2 and the rider loops round the egg as it swells toward the main
           branch. On the drop b = 2: Δ = −16(4a³ + 27b²) = 0, the egg pinches into the main
           branch at the node (1, 0) and the rider rides through it and out along the main
           branch; after that the egg is gone (one real component), and the next section starts
           a new one.
    free   Art, "inspired by": a closed 3-D Fourier curve from a seed with corkscrews and banked
           turns. No maths checks.
  Under every track: 17's city of points of y² = x³ − 25x mod p (a new good prime each bar).

  window.__qa: knot {p, q, R, r}, railPoint(t) (torus), torusError, winding {p, q, closure},
  morph {a, b, disc, crossings[]}, rider {track, s, jumping}, events (kick/snare/hat, trick,
  knot, merge with tBeat/tHeard/perfHeard/perfDrawn), errors. Modules: window.__modules.
-->
<html lang="en">
<head>
<meta charset="utf-8">

<title>19 · Skate Park</title>
<style>

<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud">loading…</div>
</div>
<div id="panel">
  <div class="buttons">
    <button id="play">▶ Play</button>
    <button id="mute">Mute clicks</button>
    <button id="full">Fullscreen</button>
  </div>
  <h3>Track</h3>
  <div class="buttons" id="tracks"></div>
  <div class="row"><label for="bars">bars / section</label><input id="bars" type="range" min="4" max="32" step="1"><output id="barsOut"></output></div>
  <div class="row"><label for="glideSpeed">glide speed</label><input id="glideSpeed" type="range" min="0.25" max="2" step="0.05"><output id="glideSpeedOut"></output></div>
  <div class="buttons" id="trickOn"><button data-on="sections">tricks on sections</button><button data-on="bars">every N bars</button><button data-on="drops">drops only</button></div>
  <div class="row"><label for="trickEvery">trick every</label><input id="trickEvery" type="range" min="4" max="64" step="4"><output id="trickEveryOut"></output></div>
  <div class="row"><label for="trickSpeed">trick speed</label><input id="trickSpeed" type="range" min="0.25" max="2" step="0.05"><output id="trickSpeedOut"></output></div>
  <div class="row"><label for="camD">cam distance</label><input id="camD" type="range" min="0.3" max="4" step="0.05"><output id="camDOut"></output></div>
  <div class="row"><label for="camH">cam height</label><input id="camH" type="range" min="0.05" max="2" step="0.05"><output id="camHOut"></output></div>
  <div class="row"><label for="trickLen">bars in air</label><input id="trickLen" type="range" min="1" max="4" step="1"><output id="trickLenOut"></output></div>
  <div class="row"><label for="p">knot p</label><input id="p" type="range" min="0" max="9" step="1"><output id="pOut"></output></div>
  <div class="row"><label for="q">knot q</label><input id="q" type="range" min="0" max="13" step="1"><output id="qOut"></output></div>
  <div class="row"><label for="bpm">BPM</label><input id="bpm" type="range" min="60" max="180" step="1"><output id="bpmOut"></output></div>
  <div class="buttons"><button id="copy" class="wide">Copy setup</button></div>
  <a href="../index.html">← all experiments</a>
</div>

<script>
'use strict';

const query = new URLSearchParams(location.search);
const TRACKS = ['torus', 'morph', 'free'];
// p, q = 0: the knot follows the sections ((2,3) → (3,5) → (5,8)); otherwise it is pinned.
const params = { track: 'auto', bars: 16, bpm: 120, bpb: 4, muted: false, glideSpeed: 0.5, camD: 1.1, camH: 0.35,
                 trickOn: 'sections', trickEvery: 16, trickSpeed: 0.25,   // user: tricks ~4× slower and rarer (spec on #45)
                 trickLen: 2, p: 0, q: 0, seed: 1,
                 kick: 'x...x...x...x...', snare: '....x.......x...', hat: 'x.x.x.x.x.x.x.x.' };
const KNOTS = [[2, 3], [3, 5], [5, 8]];
const TOR_R = 4, TOR_r = 1.6, MORPH_A = -3, BEADS = 24;

// ---------- metronome (as 17, with latency()) ----------
const TAU = { kick: 0.150, snare: 0.120, hat: 0.040 };
const LANES = ['kick', 'snare', 'hat'];
const metronome = {
  ctx: null, master: null, noise: null, timer: 0, playing: false, nextTime: 0, step: 0, hits: [], steps: [],
  start() {
    if (!this.ctx) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.ctx = ctx; this.master = ctx.createGain(); this.master.connect(ctx.destination);
      this.noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = this.noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    this.ctx.resume(); this.master.gain.value = params.muted ? 0 : 0.35;
    this.nextTime = this.ctx.currentTime + 0.05; this.step = 0; this.hits = []; this.steps = [];
    this.playing = true; this.timer = setInterval(() => this.schedule(), 25); this.schedule();
  },
  stop() { clearInterval(this.timer); this.playing = false; },
  setMuted(m) { if (this.master) this.master.gain.value = m ? 0 : 0.35; },
  schedule() {
    while (this.nextTime < this.ctx.currentTime + 0.1) { this.queueStep(this.step, this.nextTime); this.nextTime += 60 / params.bpm / 4; this.step++; }
    const old = this.ctx.currentTime - 1;
    this.hits = this.hits.filter(h => h.time > old);
    while (this.steps.length > 2 && this.steps[1].time < old) this.steps.shift();
  },
  queueStep(step, time) {
    const inBar = step % (params.bpb * 4); this.steps.push({ time, step });
    for (const lane of LANES) { if (params[lane][inBar % 16] !== 'x') continue; const vel = inBar === 0 ? 1 : 0.7; this.hits.push({ lane, time, vel }); this.click(lane, time, vel); }
  },
  click(lane, t, vel) {
    const ctx = this.ctx, g = ctx.createGain(); g.connect(this.master);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vel, t + 0.003);
    let src;
    if (lane === 'kick') { src = ctx.createOscillator(); src.frequency.setValueAtTime(150, t); src.frequency.exponentialRampToValueAtTime(60, t + 0.08); src.connect(g); }
    else { src = ctx.createBufferSource(); src.buffer = this.noise; const f = ctx.createBiquadFilter(); f.type = lane === 'snare' ? 'bandpass' : 'highpass'; f.frequency.value = lane === 'snare' ? 1800 : 8000; src.connect(f); f.connect(g); }
    const end = t + TAU[lane] * 4; g.gain.exponentialRampToValueAtTime(0.001, end); src.start(t); src.stop(end + 0.01);
  },
  latency() { return this.ctx ? Math.min(0.3, this.ctx.outputLatency || this.ctx.baseLatency || 0) : 0; },
  read() {   // levels and the beat position at the moment the listener hears them
    const out = { kick: 0, snare: 0, hat: 0, beats: -1 };
    if (!this.ctx) return out;
    const now = this.ctx.currentTime - this.latency();
    for (const h of this.hits) { const dt = now - h.time; if (dt >= 0) out[h.lane] = Math.max(out[h.lane], h.vel * (1 - Math.exp(-dt / 0.005)) * Math.exp(-dt / TAU[h.lane])); }
    let last = null; for (const s of this.steps) if (s.time <= now) last = s;
    if (last) out.beats = (last.step + Math.min(1, (now - last.time) / (60 / params.bpm / 4))) / 4;
    return out;
  },
};

// ---------- vectors and matrices ----------
const sub3 = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const add3 = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const mul3 = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross3 = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm3 = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const lerp3 = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
function perspective(fovy, aspect, near, far) { const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far); return new Float32Array([f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) * nf, -1, 0, 0, 2 * far * near * nf, 0]); }
function lookAt(eye, at, up) { const z = norm3(sub3(eye, at)), x = norm3(cross3(up, z)), y = cross3(z, x); return new Float32Array([x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, -dot3(x, eye), -dot3(y, eye), -dot3(z, eye), 1]); }
function mul4(a, b) { const o = new Float32Array(16); for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + j] * b[i * 4 + k]; o[i * 4 + j] = s; } return o; }
const ease = u => u * u * (3 - 2 * u);
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- rails: a polyline with arc length and an "up" for the rider and camera ----------
function makeRail(pts, closed, upOf) {
  const n = pts.length, cum = new Float64Array(n);
  for (let i = 1; i < n; i++) cum[i] = cum[i - 1] + Math.hypot(...sub3(pts[i], pts[i - 1]));
  const len = cum[n - 1] + (closed ? Math.hypot(...sub3(pts[0], pts[n - 1])) : 0);
  const T = pts.map((p, i) => {
    const a = pts[closed ? (i - 1 + n) % n : Math.max(0, i - 1)], b = pts[closed ? (i + 1) % n : Math.min(n - 1, i + 1)];
    return norm3(sub3(b, a));
  });
  const ups = pts.map((p, i) => upOf(p, T[i], i, T));
  return { pts, cum, len, closed, T, ups };
}
function sampleRail(r, s) {
  const n = r.pts.length;
  s = r.closed ? ((s % r.len) + r.len) % r.len : Math.max(0, Math.min(r.cum[n - 1], s));
  let lo = 0, hi = n - 1;
  if (s >= r.cum[n - 1]) { lo = n - 1; hi = r.closed ? 0 : n - 1; }
  else while (hi - lo > 1) { const m = (lo + hi) >> 1; if (r.cum[m] <= s) lo = m; else hi = m; }
  const segLen = (hi === 0 ? r.len : r.cum[hi]) - r.cum[lo], f = segLen > 0 ? (s - r.cum[lo]) / segLen : 0;
  return { p: lerp3(r.pts[lo], r.pts[hi], f), T: norm3(lerp3(r.T[lo], r.T[hi], f)), up: norm3(lerp3(r.ups[lo], r.ups[hi], f)), s };
}
// up that leans gently into turns: world z, tilted toward the centre of curvature
const bankedUp = (bank) => (p, t, i, T) => {
  const n = T.length, a = T[(i - 2 + n) % n], b = T[(i + 2) % n];
  let k = mul3(sub3(b, a), bank); const m = Math.hypot(...k); if (m > 0.8) k = mul3(k, 0.8 / m);   // lean, at most ~40°
  let u = add3([0, 0, 1], k);
  u = sub3(u, mul3(t, dot3(u, t)));
  return Math.hypot(...u) < 1e-3 ? norm3(cross3(t, [1, 0, 0])) : norm3(u);
};

// ---------- track A: torus knots ----------
const torusPoint = (p, q, t) => [(TOR_R + TOR_r * Math.cos(q * t)) * Math.cos(p * t), (TOR_R + TOR_r * Math.cos(q * t)) * Math.sin(p * t), TOR_r * Math.sin(q * t)];
function torusRail(p, q) {
  const N = 2400, pts = [];
  for (let i = 0; i < N; i++) pts.push(torusPoint(p, q, 2 * Math.PI * i / N));
  const rail = makeRail(pts, true, (P, t) => {   // between world up and "out of the tube"
    const rho = Math.hypot(P[0], P[1]), c = [P[0] / rho * TOR_R, P[1] / rho * TOR_R, 0], out = norm3(sub3(P, c));
    let u = add3([0, 0, 1], mul3(out, 0.5)); u = sub3(u, mul3(t, dot3(u, t)));
    return norm3(u);
  });
  rail.knot = { p, q };
  return rail;
}
function knotChecks(p, q) {   // what QA asks: on the torus, closes, winds p times round z and q round the tube
  let err = 0, wz = 0, wt = 0, prevA = null, prevB = null;
  const N = 4000;
  for (let i = 0; i <= N; i++) {
    const P = torusPoint(p, q, 2 * Math.PI * i / N), rho = Math.hypot(P[0], P[1]);
    err = Math.max(err, Math.abs((rho - TOR_R) ** 2 + P[2] ** 2 - TOR_r ** 2));
    const A = Math.atan2(P[1], P[0]), B = Math.atan2(P[2], rho - TOR_R);
    if (prevA !== null) { wz += ((A - prevA + 3 * Math.PI) % (2 * Math.PI)) - Math.PI; wt += ((B - prevB + 3 * Math.PI) % (2 * Math.PI)) - Math.PI; }
    prevA = A; prevB = B;
  }
  const closure = Math.hypot(...sub3(torusPoint(p, q, 0), torusPoint(p, q, 2 * Math.PI)));
  return { torusError: err, winding: { p: wz / (2 * Math.PI), q: wt / (2 * Math.PI), closure } };
}

// ---------- track B: the morphing pipe y² = x³ − 3x + b ----------
const MX0 = -2.6, MX1 = 3.4, MS = 1.15;   // x range, world scale
const fm = (x, b) => x * x * x + MORPH_A * x + b;
const discOf = b => -16 * (4 * MORPH_A ** 3 + 27 * b * b);
function morphB(sec) {   // b over the section: 0 → 2 through the build-up (2 exactly at the drop), then on to 2.5
  return sec.drop ? 2 + 0.5 * sec.dropPhase : 2 * sec.buildPhase;
}
function morphRails(b) {
  const N = 1400, xs = [], runs = [];
  const root = (lo, hi) => { for (let i = 0; i < 50; i++) { const m = (lo + hi) / 2; if ((fm(m, b) >= 0) === (fm(lo, b) >= 0)) lo = m; else hi = m; } return (lo + hi) / 2; };
  let cur = null, prev = null;
  for (let i = 0; i <= N; i++) {
    const x = MX0 + (MX1 - MX0) * i / N;
    if (fm(x, b) >= 0) { if (!cur) { cur = []; if (prev !== null) cur.push(root(prev, x)); } cur.push(x); }
    else if (cur) { cur.push(root(cur[cur.length - 1], x)); runs.push(cur); cur = null; }
    prev = x;
  }
  if (cur) runs.push(cur);
  const P = (x, s) => [x * MS, s * Math.sqrt(Math.max(0, fm(x, b))) * MS, 0];
  const up = () => [0, 0, 1];
  return runs.map(xs => {
    const closed = xs[xs.length - 1] < MX1 - 1e-6;
    // the egg starts at its right end and goes over the top; the main branch runs bottom → top
    const pts = closed ? [...xs.slice().reverse().map(x => P(x, 1)), ...xs.slice(1, -1).map(x => P(x, -1))]
                       : [...xs.slice().reverse().map(x => P(x, -1)), ...xs.slice(1).map(x => P(x, 1))];
    const r = makeRail(pts, closed, up); r.egg = closed; r.x0 = xs[0]; r.x1 = xs[xs.length - 1];
    return r;
  });
}
function mainUpper(b, x0) {   // the rider's way out through the node: the upper half from x0 to the end
  const pts = [];
  for (let i = 0; i <= 400; i++) { const x = x0 + (MX1 - x0) * i / 400; pts.push([x * MS, Math.sqrt(Math.max(0, fm(x, b))) * MS, 0]); }
  return makeRail(pts, false, () => [0, 0, 1]);
}

// ---------- track C: free ride (art only) ----------
function freeRail(seed) {
  const rand = mulberry(seed * 9973 + 17), H = [];
  for (let k = 1; k <= 4; k++) H.push({ k, ax: (rand() * 2 - 1) * 7 / k, ay: (rand() * 2 - 1) * 7 / k, az: (rand() * 2 - 1) * 2 / k,
                                         px: rand() * 6.28, py: rand() * 6.28, pz: rand() * 6.28 });
  H[0].ax = 7; H[0].ay = 5;   // a wide base loop so it never folds onto itself
  const base = t => H.reduce((s, h) => [s[0] + h.ax * Math.cos(h.k * t + h.px), s[1] + h.ay * Math.sin(h.k * t + h.py), s[2] + h.az * Math.sin(h.k * t + h.pz)], [0, 0, 0]);
  const N = 3000, pts = [];
  const screws = [0, 1, 2].map(() => ({ c: rand(), w: 0.05 + 0.04 * rand(), turns: 2 + Math.floor(rand() * 3), r: 0.5 + 0.4 * rand() }));
  for (let i = 0; i < N; i++) {
    const t = 2 * Math.PI * i / N, p = base(t), d = norm3(sub3(base(t + 1e-3), base(t - 1e-3)));
    const nrm = norm3(cross3(d, [0, 0, 1])), bin = cross3(nrm, d);
    let off = [0, 0, 0];
    for (const sc of screws) {   // corkscrews: a few turns around the path inside a smooth window
      let u = (i / N - sc.c + 1) % 1; if (u > 0.5) u -= 1;
      const wgt = Math.abs(u) < sc.w ? 0.5 + 0.5 * Math.cos(Math.PI * u / sc.w) : 0;
      if (!wgt) continue;
      const th = 2 * Math.PI * sc.turns * (u / sc.w + 1) / 2;
      off = add3(off, mul3(add3(mul3(nrm, Math.sin(th)), mul3(bin, 1 - Math.cos(th))), sc.r * wgt));
    }
    pts.push(add3(p, off));
  }
  return makeRail(pts, true, bankedUp(30));
}

// ---------- mod-p city (as 17) on y² = x³ − 25x ----------
const CITY_A = -25, CITY_B = 0;
const PRIMES = (() => { const n = 600, s = new Uint8Array(n), o = []; for (let i = 2; i < n; i++) { if (s[i]) continue; o.push(i); for (let j = i * i; j < n; j += i) s[j] = 1; } return o; })()
  .filter(p => p >= 7 && (4 * CITY_A ** 3 + 27 * CITY_B ** 2) % p !== 0);
function cellsMod(a, b, p) {
  const roots = Array.from({ length: p }, () => []); for (let y = 0; y < p; y++) roots[(y * y) % p].push(y);
  const am = ((a % p) + p) % p, bm = ((b % p) + p) % p, out = [];
  for (let x = 0; x < p; x++) for (const y of roots[((x * x % p) * x % p + am * x % p + bm) % p]) out.push(x, y);
  return out;
}

// ---------- WebGL ----------
const canvas = document.getElementById('c');
const hud = document.getElementById('hud');
const gl = canvas.getContext('webgl2', { antialias: true, alpha: false });
function fail(msg) { hud.textContent = msg; throw new Error(msg); }
if (!gl) fail('WebGL2 is not available in this browser.');
function compile(type, src) { const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh); if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) fail('Shader error:\n' + gl.getShaderInfoLog(sh)); return sh; }
function program(vs, fs) {
  const p = gl.createProgram(); gl.attachShader(p, compile(gl.VERTEX_SHADER, vs)); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);

    gl.uniform1f(railProg.u.uKick, L.kick); gl.uniform1f(railProg.u.uBeat, beats); gl.uniform1f(railProg.u.uAlpha, alpha);
    gl.uniform1f(railProg.u.uRider, st.kind !== 'morph' && alpha === 1 ? rider.s : -1e3);
    gl.bindVertexArray(mesh.vao); gl.drawElements(gl.TRIANGLES, mesh.count, gl.UNSIGNED_INT, 0);
  };
  gl.disable(gl.BLEND);
  drawRail(railMeshes[1], st.kind, 1);
  gl.enable(gl.BLEND);
  if (st.jump && st.prevRails.length) drawRail(railMeshes[0], st.prevKind, 1 - ease(Math.min(1, (bars - st.jump.bar0) / st.jump.len)));
  if (st.kind === 'torus' || (st.jump && st.prevKind === 'torus')) {   // the donut, translucent
    const a = st.kind === 'torus' ? (st.jump && st.prevKind !== 'torus' ? ease(Math.min(1, (bars - st.jump.bar0) / st.jump.len)) : 1) : 1 - ease(Math.min(1, (bars - st.jump.bar0) / st.jump.len));
    gl.depthMask(false);
    gl.useProgram(surfProg.p); gl.uniformMatrix4fv(surfProg.u.uVP, false, vp); gl.uniform3fv(surfProg.u.uEye, st.cam.eye);
    gl.uniform1f(surfProg.u.uKick, L.kick); gl.uniform1f(surfProg.u.uHat, L.hat); gl.uniform1f(surfProg.u.uAlpha, a);
    gl.bindVertexArray(torusMesh.vao); gl.drawElements(gl.TRIANGLES, torusMesh.count, gl.UNSIGNED_INT, 0);
    gl.depthMask(true);
  }

  // sprites: halo along the rail near the rider, torsion beads, the node, the rider and its trail
  const sp = [];
  const col = railCol[st.kind] || railCol.free;
  if (rider.rail) for (let d = -6; d <= 10; d += 0.12) {
    const q = sampleRail(rider.rail, rider.s + d), f = Math.exp(-Math.abs(d) * 0.35) * 0.35;
    sp.push(...q.p, col[0] * f, col[1] * f, col[2] * f, 9);
  }
  if (st.kind === 'torus' && st.knot) {
    const beat = Math.floor(beats);
    for (let n = 0; n < BEADS; n++) {
      const P = torusPoint(st.knot.p, st.knot.q, 2 * Math.PI * n / BEADS), lit = n === beat % BEADS ? 1 : 0;
      sp.push(...P, 0.9 + lit, 0.85 + lit * 0.5, 0.5 + lit * 0.3, 7 + 14 * lit * (0.5 + L.kick));
    }
  }
  if (st.kind === 'morph') {   // the node, where the egg will touch the main branch
    const g = 0.4 + 1.6 * st.flash + 0.4 * Math.exp(-Math.abs(st.morph.b - 2) * 3);
    sp.push(1 * MS, 0, 0, g, g * 0.95, g * 0.8, 16 + 30 * st.flash);
  }
  st.trail.forEach((q, i) => { const f = i / st.trail.length; sp.push(...q, 1.0 * f, 0.6 * f, 0.3 * f, 3 + 7 * f); });
  sp.push(...pos, 1, 1, 1, 18 * (1 + 0.5 * L.kick));
  fillPoints(fxBuf, sp);
  gl.disable(gl.DEPTH_TEST);
  gl.useProgram(pointProg.p); gl.uniformMatrix4fv(pointProg.u.uVP, false, vp); gl.uniform1f(pointProg.u.uScale, Hh / 160);
  gl.bindVertexArray(fxBuf.vao); gl.drawArrays(gl.POINTS, 0, fxBuf.count);
  gl.disable(gl.BLEND);

  Object.assign(window.__qa, {
    track: st.kind, section: sec.k, drop: sec.drop, bars, beats,
    knot: st.kind === 'torus' ? st.knot : null, torusError: st.checks && st.checks.torusError, winding: st.checks && st.checks.winding,
    morph: { a: MORPH_A, b: st.morph.b, disc: st.morph.disc, crossings: st.morph.crossings.slice() },
    rider: { track: st.kind, s: rider.s, pos, jumping: !!st.jump }, p: st.p, ap: st.ap,
    trick: { on: params.trickOn, every: params.trickEvery, speed: params.trickSpeed, prev: st.trickPrev, next: st.trickNext, dur: st.trickDur, low: !!(st.jump && st.jump.low) },
  });
  frames++;
  if (now - lastFpsTime > 500) { fps = Math.round(frames * 1000 / (now - lastFpsTime)); frames = 0; lastFpsTime = now; }
  if (now - lastHud > 200) {
    lastHud = now;
    const state = metronome.playing ? '▶' : (metronome.ctx ? '■' : 'tap ▶ Play');
    const what = st.kind === 'torus' ? `(${st.knot.p},${st.knot.q}) torus knot` : st.kind === 'morph' ? `y² = x³ − 3x + ${st.morph.b.toFixed(2)} · Δ ${st.morph.disc > 0 ? '> 0' : st.morph.disc < 0 ? '< 0' : '= 0'}` : 'free ride (inspired by)';
    hud.textContent = `Skate Park · ${what} · ${sec.drop ? 'DROP' : 'build-up'}${st.jump ? ' · trick' : ''} · ${state}\n` +
      `city mod ${st.p} · ${W}×${Hh} · ${fps} fps`;
  }
}
function startJump(bar0, len, low) {
  const h = st.kind === 'torus' ? 1.6 : st.kind === 'morph' ? 1.2 : 1.4;
  st.jump = { bar0, len, low, from: st.riderPos || [0, 0, 0], up: st.cam.up.slice(), height: low ? 0.3 * h : h };
}
// Trick schedule (the same as 17): candidates every `every` bars (on = bars), at each section
// start and drop (sections) or at drops only (drops); one inside the last trick is skipped.
function trickSchedule(bar, o) {
  const S = o.on === 'bars' ? o.every : o.section;
  let lastEnd = -Infinity, prev = null, next = null;
  for (let k = 0; next === null && k < 1e5; k++) {
    const c = [];
    if (o.on === 'bars') c.push(k * S);
    else {
      const dropOk = o.dropBars > 0 && !(o.skipDrop && o.skipDrop(k));
      if (o.on === 'sections' || !dropOk) c.push(k * S);
      if (dropOk) c.push(k * S + S - o.dropBars);
    }
    for (const t of c) {
      if (t < lastEnd) continue;
      lastEnd = t + o.dur;
      if (t <= bar) prev = t; else if (next === null) next = t;
    }
  }
  return { prev, next };
}

window.__qa = {
  errors, events, torusPoint, knotChecks, discOf, morphB: (buildPhase, drop = false, dropPhase = 0) => morphB({ buildPhase, drop, dropPhase }),
  railPoint: t => st.knot ? torusPoint(st.knot.p, st.knot.q, t) : null, R: TOR_R, r: TOR_r, a: MORPH_A,
};
const q = k => query.get(k);
if (q('track') && (q('track') === 'auto' || TRACKS.includes(q('track')))) params.track = q('track');
for (const k of Object.keys(SLIDERS).concat(['seed'])) { const v = parseFloat(q(k)); if (Number.isFinite(v)) params[k] = v; }
params.muted = q('muted') === '1';
if (['bars', 'sections', 'drops'].includes(q('trickOn'))) params.trickOn = q('trickOn');
window.__qa.trickSchedule = trickSchedule;
sync();
requestAnimationFrame(frame);
</script>
