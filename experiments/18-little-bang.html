<!--
  18 · Little Bang   (Millennium track #37, Yang–Mills take two; spec: #37 comment 6395831220)

  12 Mass Gap stays as it is; the user found it dull apart from the particle look and the lava
  lamp too basic. This page is a collider show built only from particles: everything we can see
  of the strong force. Three scenes, switching every `bars` bars; each section is a build-up
  (beam energy rising collision by collision) and a drop (the last 2 bars, the biggest ones).

    collide  On every downbeat two gold nuclei (197 nucleons each, flattened by their speed) meet
             with impact parameter b. Nucleons in the overlap are participants and become the
             fireball; the rest (spectators) fly on down the beam. The fireball is quark–gluon
             plasma: an almond (short axis along b) that expands under its own pressure, faster
             along the short axis (a ∝ 1/R), so the almond turns round: elliptic flow. It cools
             as T = T0 (V0/V)^(1/3) and glows ∝ T⁴, white to orange; at T = 156 MeV it
             hadronizes into thousands of tracks. Charged tracks curl in the detector's 0.5 T
             field along the beam with radius r = pT/(0.3 B) [m, GeV, T], losing energy at a
             constant rate (dE/dx), so r shrinks linearly with path length and slow ones spiral
             in. The azimuthal spread follows dN/dφ ∝ 1 + 2 v2 cos 2(φ − Ψ) with v2 > 0 from the
             almond's eccentricity. On each snare a jet pair fires back to back.
    strings  The Lund string model. On each kick a quark and an antiquark fly apart, tied by a
             colour string with constant tension κ = 1 GeV/fm (energy κ·L). When it breaks, a new
             quark–antiquark pair appears at the break, 2m/κ apart, so energy is conserved; it
             repeats into a cascade of mesons. Each piece is a quark of one colour plus its
             anticolour (red + cyan, green + magenta, blue + yellow), so every group is white.
    quench   Collisions as above, but each snare jet pair is lopsided: one jet escapes, the other
             crosses the plasma, loses most of its energy (dE/dx) and frays into soft curling
             sparks. A_J = (E1 − E2)/(E1 + E2) is shown. The absorbed jet drives a Mach cone through
             the plasma: a glowing V behind it with half-angle sin α = c_s / v (c_s = 1/√3, v = c: 35°).
    beamline (#58, replaces strings in auto) A ring collider. The camera rides the beam axis inside the
             pipe, passes a blue ring magnet on every beat and red focusing magnets that flash on the
             kick, and slows to a halt just before the interaction point on each downbeat, when the two
             bunches cross there. The collision is collide's physics; tracks curl out through the
             tracker, and calorimeter cells light up where they land (r = 1.6). Then the camera
             accelerates through the detector and laps the ring for the next crossing. The tube's wires
             are neon (#75 comment 6472180040): hot core + coloured halo, hue bands streaming along the
             tube, a new palette colour every bar, a rainbow sweep on the drop; each kick fires a light
             ring that reaches the IP on the next downbeat; the bass breathes and plucks the wires,
             the hats shimmer them, the snare flashes the magnets in the complementary colour.
  A small strip (bottom right) keeps 12's glueball spectrum: nothing below 1730 MeV, the gap.
  Not to scale: the fireball is drawn in femtometres (×0.045), the tracks in metres, and time
  is slowed so a collision lasts about a bar. The fireball is an analytic blast wave, not a
  fluid solver yet (Flow Lab, 13, will provide one).

  Everything per event is a pure function of the bar number and a seed (a PCG hash shared by
  JS and GLSL), so QA can recompute any track. window.__qa: event(bar), trackParams(seed, i),
  trackPos(event, i, t), jetSums(jetSeed, n, quench), fireballAt(event, tfm), strings
  {cascades, totals}, events, errors, camera {u, s, pos, offAxis, pipeR} (beamline), wakes [{bar, step,
  dir, entry, fireballR, cs, v, speed, tBeat}] and dijets [{bar, step, pT1, pT2, AJ, tBeat}] (no
  half-angle: QA fits it from the picture), bunchPos(bar, tSec), ringPoint(s), camS(u), wires {baseHue,
  pulses, pulsePhase, wobbleAmp, breath, glowPx, clearance (in tube radii)}; events pulse / pulse-arrive.
  Modules: window.__modules (ISF-style inputs).
-->

<body>
<div id="wrap">
  <canvas id="c"></canvas>

<script>
'use strict';

const query = new URLSearchParams(location.search);
// beamline replaces strings in auto (#58, user: strings "quite boring"); strings stays one tap away
const SCENES = ['collide', 'beamline', 'quench', 'strings'];
const AUTO = ['collide', 'beamline', 'quench'];
const COARSE = matchMedia('(pointer: coarse)').matches;
// lead (ms): read the drums this far ahead of the heard clock, if QA box finds the picture late.
// res: 'cap' draws the particles at up to 2560×1440 pixels and scales the glow up to the
// screen (QA box: 30 fps at 1440p, 15 at 4K at full size); ?res=native draws every pixel.
const params = { scene: 'auto', bars: 8, bpm: 120, bpb: 4, muted: false, lead: 0, seed: 1, res: 'cap',
                 n: 30000, gain: 1, tau: 0.08, loss: 0.06,
                 kick: 'x...x...x...x...', snare: '....x.......x...', hat: 'x.x.x.x.x.x.x.x.' };

// ---------- physics constants ----------
const B_T = 0.5;            // detector field along the beam, tesla (ALICE's solenoid)
const T_C = 0.156;          // GeV, QCD crossover / hadronization temperature
const R_AU = 7.0;           // fm, gold nucleus radius (1.2·197^(1/3) ≈ 7.0)
const FBS = 0.045;          // world units per fm for the fireball and nuclei
const FMC_S = 0.06;         // seconds of picture per fm/c of fireball time
const DET_R = 2.5;          // m, drawn detector barrel
const SPEED = 2.0;          // m per second of picture (tracks, slowed down)
const TRAIL_K = 3, TRAIL_DT = 0.04;   // line segments per track, seconds each
const TRACK_LIFE = 2.4;               // s; tracks fade from 1.4 s, so about one event's tracks are drawn at a time
const FIRE_N = 24000;                 // fireball points
const JET_N = 700;          // particles per jet
const KAPPA = 1.0, MQ = 0.33, STR_FM = 0.12, STR_S = 0.12;   // strings: GeV/fm, GeV, units/fm, s per fm/c

// ---------- shared hash (JS twin of the GLSL one) ----------
function pcg(v) {
  v >>>= 0;
  const s = (Math.imul(v, 747796405) + 2891336453) >>> 0;
  const w = Math.imul(((s >>> ((s >>> 28) + 4)) ^ s) >>> 0, 277803737) >>> 0;
  return ((w >>> 22) ^ w) >>> 0;
}
const rnd = (seed, i, k) => pcg((seed ^ pcg((i * 8 + k) >>> 0)) >>> 0) / 4294967296;

// ---------- Metronome (as 11, with a look-ahead read) ----------
const TAU = { kick: 0.150, snare: 0.120, hat: 0.040 };
const LANES = ['kick', 'snare', 'hat'];
const metronome = {
  ctx: null, master: null, bus: null, noise: null, timer: 0, playing: false,
  nextTime: 0, step: 0, hits: [], steps: [],
  start() {
    if (!this.ctx) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.ctx = ctx;
      this.bus = ctx.createGain(); this.master = ctx.createGain();
      this.bus.connect(this.master); this.master.connect(ctx.destination);
      this.noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = this.noise.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    this.ctx.resume();
    this.master.gain.value = params.muted ? 0 : 0.35;
    this.nextTime = this.ctx.currentTime + 0.05; this.step = 0; this.hits = []; this.steps = [];
    this.playing = true;
    this.timer = setInterval(() => this.schedule(), 25);
    this.schedule();
  },
  stop() { clearInterval(this.timer); this.playing = false; },
  setMuted(m) { if (this.master) this.master.gain.value = m ? 0 : 0.35; },
  schedule() {
    while (this.nextTime < this.ctx.currentTime + 0.1) {
      this.queueStep(this.step, this.nextTime);
      this.nextTime += 60 / params.bpm / 4; this.step++;
    }
    const old = this.ctx.currentTime - 1;
    this.hits = this.hits.filter(h => h.time > old);
    while (this.steps.length > 2 && this.steps[1].time < old) this.steps.shift();
  },
  queueStep(step, time) {
    const inBar = step % (params.bpb * 4);
    this.steps.push({ time, step });
    for (const lane of LANES) {
      if (params[lane][inBar % 16] !== 'x') continue;
      const vel = inBar === 0 ? 1.0 : 0.7;
      this.hits.push({ lane, time, vel });
      this.click(lane, time, vel);
    }
  },
  click(lane, t, vel) {
    const ctx = this.ctx, g = ctx.createGain();
    g.connect(this.bus);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vel, t + 0.003);
    let src;
    if (lane === 'kick') {
      src = ctx.createOscillator();
      src.frequency.setValueAtTime(150, t); src.frequency.exponentialRampToValueAtTime(60, t + 0.08);
      src.connect(g);
    } else {
      src = ctx.createBufferSource(); src.buffer = this.noise;
      const f = ctx.createBiquadFilter();
      f.type = lane === 'snare' ? 'bandpass' : 'highpass';
      f.frequency.value = lane === 'snare' ? 1800 : 8000;
      src.connect(f); f.connect(g);
    }
    const end = t + TAU[lane] * 4;
    g.gain.exponentialRampToValueAtTime(0.001, end);
    src.start(t); src.stop(end + 0.01);
  },
  latency() { return this.ctx ? Math.min(0.3, this.ctx.outputLatency || this.ctx.baseLatency || 0) : 0; },
  // levels and the bar position at the moment the listener hears them (plus `lead` seconds)
  read(lead = 0) {
    const out = { kick: 0, snare: 0, hat: 0, bars: -1 };
    if (!this.ctx) return out;
    const now = this.ctx.currentTime - this.latency() + lead;
    for (const h of this.hits) {
      const dt = now - h.time;
      if (dt >= 0) out[h.lane] = Math.max(out[h.lane], h.vel * (1 - Math.exp(-dt / 0.005)) * Math.exp(-dt / TAU[h.lane]));
    }
    let last = null;
    for (const s of this.steps) if (s.time <= now) last = s;
    if (last) out.bars = (last.step + Math.min(1, (now - last.time) / (60 / params.bpm / 4))) / (params.bpb * 4);
    return out;
  },
};

// ---------- the physics, in JS (drives the uniforms; QA recomputes from it) ----------
// Fireball: an almond of overlap, short axis along b. Transverse axes accelerate at a = A/R0
// (pressure gradient ∝ 1/size) up to 0.85c; along the beam it grows at 0.95c (Bjorken).
function fireballAxes(fb, t) {   // t in fm/c → semi-axes in fm {x, out (long), in (short)}
  const ax = (R0, a) => { const tc = 0.85 / a; return t < tc ? R0 + 0.5 * a * t * t : R0 + 0.5 * a * tc * tc + 0.85 * (t - tc); };
  return { x: fb.Rx0 + 0.95 * t, out: ax(fb.Rout0, fb.aOut), in: ax(fb.Rin0, fb.aIn) };
}
function fireballT(fb, t) {
  const a = fireballAxes(fb, t);
  return fb.T0 * Math.cbrt((fb.Rx0 * fb.Rout0 * fb.Rin0) / (a.x * a.out * a.in));
}
function makeFireball(energy, b) {
  const Rin0 = R_AU - b / 2, Rout0 = Math.sqrt(R_AU * R_AU - b * b / 4), A = 1.6;
  const fb = { b, Rin0, Rout0, Rx0: 0.6, aIn: A / Rin0, aOut: A / Rout0, T0: 0.28 + 0.22 * energy };
  let t = 0; while (fireballT(fb, t) > T_C && t < 40) t += 0.01;
  fb.th = t;                                 // fm/c at hadronization
  fb.thS = t * FMC_S;                        // seconds of picture
  fb.ecc = (Rout0 * Rout0 - Rin0 * Rin0) / (Rout0 * Rout0 + Rin0 * Rin0);
  fb.v2 = 0.2 * fb.ecc;                      // hydro response, v2 ≈ 0.2 ε
  return fb;
}

const sectionOf = n => {
  const scene = params.scene === 'auto' ? AUTO[Math.floor(n / params.bars) % AUTO.length] : params.scene;
  const sb = ((n % params.bars) + params.bars) % params.bars, build = Math.max(1, params.bars - 2), drop = sb >= build;
  return { scene, drop, energy: drop ? 1.3 : 0.3 + 0.7 * sb / build };
};
const evCache = new Map();
function eventFor(n) {   // the collision on bar n's downbeat, or null (strings scene)
  if (n < 0) return null;
  const sec = sectionOf(n);
  if (sec.scene === 'strings') return null;
  const key = `${n}|${sec.scene}|${sec.energy}|${params.seed}|${params.snare}|${params.bpb}`;
  let ev = evCache.get(key);
  if (!ev) {
    const seed = pcg(n * 7919 + params.seed * 104729);
    const b = sec.drop ? 1.5 + 2 * rnd(seed, 0, 1) : 3 + 6 * rnd(seed, 0, 1);   // fm; the drop is near-central
    const psi = 2 * Math.PI * rnd(seed, 0, 2);
    const fb = makeFireball(sec.energy, b);
    const jets = [];
    for (let s = 0; s < params.bpb * 4; s++) {
      if (params.snare[s % 16] !== 'x') continue;
      jets.push({ step: s, seed: pcg(seed + 31 * (s + 1)), phi: 2 * Math.PI * rnd(seed, 1000 + s, 7),
                  quench: sec.scene === 'quench' ? (sec.drop ? 0.75 : 0.6) : 0 });
    }
    ev = { n, seed, scene: sec.scene, drop: sec.drop, energy: sec.energy, b, psi, fb, jets };
    evCache.set(key, ev);
    if (evCache.size > 64) evCache.delete(evCache.keys().next().value);
  }
  return ev;
}
const basis = psi => ({ ein: [0, Math.sin(psi), Math.cos(psi)], eout: [0, Math.cos(psi), -Math.sin(psi)] });

// ---------- beamline: a ring collider; the interaction point (IP) is the origin, the beam runs along +x there ----------
// The camera rides the beam axis round the ring once a bar. Its arclength is C·g(u) − STOP with g(u) = u − sin(2πu)/2π
// (u = phase in the bar): g'(0) = 0, so it slows to a halt STOP before the IP on every downbeat, watches the
// collision, then accelerates through the detector and laps the ring. It passes one ring magnet per beat.
const RING_R = 24, RING_C = 2 * Math.PI * RING_R, PIPE_R = 0.35, CAM_STOP = 0.9, CAL_R = 1.6, CAL_X = 2.4, BUNCH_V = 9;
const ringG = u => u - Math.sin(2 * Math.PI * u) / (2 * Math.PI);
function ringPoint(s) {   // arclength s from the IP, along the beam
  const th = s / RING_R;
  return { p: [RING_R * Math.sin(th), 0, RING_R * (Math.cos(th) - 1)], t: [Math.cos(th), 0, -Math.sin(th)] };
}
const camS = u => RING_C * ringG(u) - CAM_STOP;
function bunchPos(bar, tSec) {   // the two bunch centres, tSec after bar's downbeat (they cross the IP at tSec = 0)
  return { a: ringPoint(BUNCH_V * tSec).p, b: ringPoint(-BUNCH_V * tSec).p, sA: BUNCH_V * tSec, sB: -BUNCH_V * tSec };
}

// One bulk track: the same maths as the vertex shader.
function trackParams(seed, i, ev) {
  const u0 = rnd(seed, i, 0), u1 = rnd(seed, i, 1), u2 = rnd(seed, i, 2), u3 = rnd(seed, i, 3), u4 = rnd(seed, i, 4);
  const pT = 0.12 * -Math.log(Math.max(u0 * u1, 1e-7)) * 1.6 * (0.85 + 0.3 * ev.energy);
  const phi0 = 2 * Math.PI * u2, phi = phi0 - ev.fb.v2 * Math.sin(2 * phi0);
  const q = u3 < 0.36 ? -1 : u3 < 0.72 ? 1 : 0;
  const eta = (2 * u4 - 1) * 1.4;
  return { pT, phi, q, eta, r0: pT / (0.3 * B_T) };
}
// Path in the transverse plane for a track of radius r0 losing radius at k per unit length:
// r(s) = r0 − k s, which is r = p/(0.3 B) with constant dE/dx. Closed form via the turning
// angle θ: s = r0 (1 − e^(−kθ))/k.
function helix(r0, k, sT) {
  const sMax = k > 1e-4 ? 0.995 * r0 / k : Infinity, s = Math.min(sT, sMax);
  const th = k > 1e-4 ? -Math.log(1 - k * s / r0) / k : s / r0;
  const e = Math.exp(-k * th), d = 1 + k * k;
  return { X: r0 * (e * (Math.sin(th) - k * Math.cos(th)) + k) / d, Y: r0 * (1 - e * (k * Math.sin(th) + Math.cos(th))) / d, s, th, r: r0 - k * s };
}
function trackPos(ev, i, t) {   // world position of bulk track i, t seconds after hadronization
  const P = trackParams(ev.seed, i, ev), u5 = rnd(ev.seed, i, 5);
  const A = fireballAxes(ev.fb, ev.fb.th), rad = 0.75 + 0.25 * u5;
  const ex = A.x * Math.tanh(P.eta) * FBS * 0.8, ein = A.in * Math.cos(P.phi) * rad * FBS, eout = A.out * Math.sin(P.phi) * rad * FBS;
  const d = SPEED * Math.max(0, t), sT = d / Math.cosh(P.eta);
  let X, Y, s;
  if (P.q !== 0) ({ X, Y, s } = helix(P.r0, params.loss, sT)); else { X = Math.min(sT, DET_R * 1.2); Y = 0; s = X; }
  const xl = s * Math.sinh(P.eta), c = Math.cos(P.phi), sn = Math.sin(P.phi);
  const tin = ein + X * c - P.q * Y * sn, tout = eout + X * sn + P.q * Y * c;
  const { ein: E1, eout: E2 } = basis(ev.psi);
  return [ex + xl, E1[1] * tin + E2[1] * tout, E1[2] * tin + E2[2] * tout];
}
function jetSums(jseed, n, quench) {
  let a = 0, b = 0;
  for (let i = 0; i < n; i++) {
    const pT = 1.0 + 30 * rnd(jseed, i, 0) ** 3;
    a += pT; b += pT * (1 - quench);
  }
  return { E1: a, E2: b, AJ: (a - b) / (a + b) };
}

// ---------- WebGL ----------
const canvas = document.getElementById('c');
const ov = document.getElementById('ov'), octx = ov.getContext('2d');
const hud = document.getElementById('hud');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false });
function fail(msg) { hud.textContent = msg; throw new Error(msg); }
if (!gl) fail('WebGL2 is not available in this browser.');
if (!gl.getExtension('EXT_color_buffer_float') && !gl.getExtension('EXT_color_buffer_half_float')) fail('This GPU cannot render to float textures.');

function compile(type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src); gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) fail('Shader error:\n' + gl.getShaderInfoLog(sh));
  return sh;
}
function program(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) fail('Link error:\n' + gl.getProgramInfoLog(p));
  const u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const nm = gl.getActiveUniform(p, i).name.replace('[0]', ''); u[nm] = gl.getUniformLocation(p, nm); }
  return { p, u };
}
const FULL_VS = `#version 300 es
out vec2 vUv;
void main() {
  vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  vUv = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;
const emptyVao = gl.createVertexArray();
const HASH_GLSL = `
uniform uint uSeed;
uint pcg(uint v) { uint s = v * 747796405u + 2891336453u; uint w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u; return (w >> 22u) ^ w; }

      wobbleAmp: wob, breath, glowPx, haloShift: shift * 360, halo, bass: bassEnv, clearance: breath - wob, drop: sec.drop };
    for (const p of pulses) {   // the pulse launch (on its kick) and its arrival at the IP (the next downbeat)
      if (!metronome.playing || logged.has(`p${n}.${p.step}`)) continue;
      logged.add(`p${n}.${p.step}`);
      const tb = stepTime(n * params.bpb * 4 + p.step);
      if (tb !== null) logEvent({ type: 'pulse', bar: n, step: p.step, tBeat: tb, tArrive: tb + (params.bpb * 4 - p.step) * beatSec / 4 }, now);
    }
  } else wiresQA = null;

  const sprites = [];
  let flash = 0, drawn = 0;
  for (let m = n - 2; m <= n + 1 && !(QA_WIRES && beam); m++) {
    const ev = eventFor(m);
    if (!ev) continue;
    const t = tMus - m * barSec;
    if (t < -beatSec) continue;
    const { ein, eout } = basis(ev.psi);
    if (beam && t < 0 && t > -1.8) {   // the two bunches race in along the pipe and cross at the IP on the downbeat
      const B = bunchPos(m, t), fade = Math.min(1, (t + 1.8) / 0.4) * (ev.drop ? 1.4 : 0.7 + 0.5 * ev.energy);
      for (const [s0, col] of [[B.sA, [0.55, 0.75, 1.0]], [B.sB, [1.0, 0.8, 0.45]]]) {
        const { p, t: tg } = ringPoint(s0), n2 = [-tg[2], 0, tg[0]];
        for (let k = 0; k < 160; k++) {
          const g = (a, b) => Math.sqrt(-2 * Math.log(Math.max(1e-6, rnd(ev.seed ^ 0x2545f491, k * 2 + (s0 < 0 ? 0 : 1), a)))) * Math.cos(2 * Math.PI * rnd(ev.seed ^ 0x2545f491, k * 2 + (s0 < 0 ? 0 : 1), b));
          const dl = 0.22 * g(0, 1), dy = 0.04 * g(2, 3), dz = 0.04 * g(4, 5);
          sprites.push(p[0] + tg[0] * dl + n2[0] * dz, p[1] + dy, p[2] + tg[2] * dl + n2[2] * dz, col[0] * fade, col[1] * fade, col[2] * fade, 6);
        }
      }
    }
    nucleiSprites(sprites, ev, t, beatSec);
    if (t >= 0 && metronome.playing && !logged.has('c' + m)) {
      logged.add('c' + m);
      const tb = stepTime(m * params.bpb * 4);
      if (tb !== null) logEvent({ type: 'collision', bar: m, b: ev.b, tBeat: tb }, now);
    }
    if (t >= 0 && t < ev.fb.thS + 0.15) {   // the fireball
      const tf = t / FMC_S, A = fireballAxes(ev.fb, Math.min(tf, ev.fb.th)), T = fireballT(ev.fb, Math.min(tf, ev.fb.th));
      const fade = t < ev.fb.thS ? 1 : 1 - (t - ev.fb.thS) / 0.15;
      // beamline (user: "the explosion is a bit too bright and blinding"): the camera sits 0.9 from the IP, so the
      // fireball fills the view; there it is dimmer, its points smaller, it swells in over 80 ms and the flash is a quarter
      const near = beam ? 0.3 * Math.min(1, t / 0.08) : 1;
      const glow = Math.min(60, (T / T_C) ** 4) * 0.012 * (40000 / FIRE_N) * fade * near;
      flash = Math.max(flash, (ev.drop ? 0.3 : 0.12) * Math.min(1, (T / T_C) ** 4 / 40) * fade * Math.exp(-t / 0.12) * (beam ? 0.25 * Math.min(1, t / 0.08) : 1));
      gl.useProgram(fireProg.p);
      gl.uniformMatrix4fv(fireProg.u.uVP, false, vp);
      gl.uniform1ui(fireProg.u.uSeed, ev.seed);
      gl.uniform3f(fireProg.u.uAxW, A.x * FBS, A.out * FBS, A.in * FBS);
      gl.uniform3fv(fireProg.u.uEin, ein); gl.uniform3fv(fireProg.u.uEout, eout);
      gl.uniform3fv(fireProg.u.uCol, fireCol(T, ev.fb.T0));
      gl.uniform1f(fireProg.u.uBright, glow * fg * params.gain);
      gl.uniform1f(fireProg.u.uScale, H / (beam ? 80 : 45));
      gl.uniform1f(fireProg.u.uTime, now / 1000);
      gl.bindVertexArray(emptyVao); gl.drawArrays(gl.POINTS, 0, FIRE_N);
    }
    const tt = t - ev.fb.thS;
    if (beam && tt >= 0 && tt < TRACK_LIFE) {   // calorimeter cells light where tracks reach r = CAL_R
      for (const hit of calHits(ev)) {
        const age = tt - hit.t;
        if (age < 0) continue;
        const a = 2 * Math.PI / 64, ph = Math.round(Math.atan2(hit.p[2], hit.p[1]) / a) * a, x = Math.round(hit.p[0] / 0.2) * 0.2;
        const f = Math.exp(-age / 0.45) * (0.6 + 0.6 * Math.min(1, hit.pT)) * (ev.drop ? 1.3 : 1);
        const c = hit.q > 0 ? [1.0, 0.55, 0.2] : hit.q < 0 ? [0.4, 0.6, 1.0] : [0.7, 1.0, 0.55];
        sprites.push(x, CAL_R * Math.cos(ph), CAL_R * Math.sin(ph), c[0] * f, c[1] * f, c[2] * f, 9);
      }
    }
    if (tt >= 0 && tt < TRACK_LIFE) {   // hadrons: the bulk tracks
      gl.useProgram(trackProg.p);
      setTrackUniforms(vp, ev, tt, 0, fg * (beam ? 0.6 : 1));
      gl.uniform1f(trackProg.u.uGain, 0.9 * Math.sqrt(100000 / params.n) * fg * params.gain);
      gl.bindVertexArray(emptyVao); gl.drawArrays(gl.LINES, 0, params.n * TRAIL_K * 2);
      drawn += params.n;
    }
    for (const j of ev.jets) {   // jet pairs on the snares
      const tj = t - j.step * beatSec / 4;
      if (tj < 0 || tj >= TRACK_LIFE) continue;
      const jetDir = [ein[0] * Math.cos(j.phi + Math.PI) + eout[0] * Math.sin(j.phi + Math.PI), ein[1] * Math.cos(j.phi + Math.PI) + eout[1] * Math.sin(j.phi + Math.PI),
                      ein[2] * Math.cos(j.phi + Math.PI) + eout[2] * Math.sin(j.phi + Math.PI)];   // the quenched side (side 1 in the shader)
      const Afb = fireballAxes(ev.fb, ev.fb.th), Rfb = 0.5 * (Afb.in + Afb.out) * FBS;
      if (!logged.has(`j${m}.${j.step}`)) {
        logged.add(`j${m}.${j.step}`);
        const tb = metronome.playing ? stepTime(m * params.bpb * 4 + j.step) : null;
        if (tb !== null) logEvent({ type: 'jet', bar: m, quench: j.quench, tBeat: tb }, now);
        const S = jetSums(j.seed, JET_N, j.quench);
        dijetsQA.push({ bar: m, step: j.step, pT1: S.E1, pT2: S.E2, AJ: S.AJ, tBeat: tb }); if (dijetsQA.length > 64) dijetsQA.shift();
        if (j.quench > 0) { wakesQA.push({ bar: m, step: j.step, dir: jetDir, entry: [0, 0, 0], fireballR: Rfb, cs: CS, v: V_JET, speed: SPEED, tBeat: tb }); if (wakesQA.length > 64) wakesQA.shift(); }
      }
      if (j.quench > 0 && tj < WAKE_LIFE + 0.2) {   // the Mach cone: a V behind the absorbed jet, opening at asin(c_s / v)
        // drawn WAKE_L long (bigger than the plasma, so it reads), with a short glowing trail of the last 0.2 s
        const tanA = Math.tan(Math.asin(CS / V_JET));
        const p1 = [1, 0, 0], p2 = [jetDir[1] * p1[2] - jetDir[2] * p1[1], jetDir[2] * p1[0] - jetDir[0] * p1[2], jetDir[0] * p1[1] - jetDir[1] * p1[0]];
        for (const lag of [0, 0.05, 0.1, 0.15, 0.2]) {
          const tl = tj - lag;
          if (tl <= 0 || tl > WAKE_LIFE) continue;
          const apexD = Math.min(SPEED * tl, WAKE_L), grow = 1 + Math.max(0, SPEED * tl - WAKE_L) * 0.15;
          const fade = (1 - tl / WAKE_LIFE) * (0.8 + 0.6 * j.quench) * (1 - lag / 0.25) * 1.8;
          for (let li = 1; li <= 20; li++) {
            const l = apexD * li / 20, r = l * tanA * grow, f = fade * (1 - 0.6 * li / 20) * Math.min(1, li / 5) * (li <= 2 ? 1.6 : 1);
            for (let k = 0; k < 36; k++) {
              const ps = k / 36 * 2 * Math.PI, c = Math.cos(ps), s = Math.sin(ps);
              sprites.push(jetDir[0] * (apexD - l) + (p1[0] * c + p2[0] * s) * r, jetDir[1] * (apexD - l) + (p1[1] * c + p2[1] * s) * r,
                           jetDir[2] * (apexD - l) + (p1[2] * c + p2[2] * s) * r, 1.0 * f, 0.45 * f, 0.12 * f, 7);
            }
          }
        }
      }
      gl.useProgram(trackProg.p);
      setTrackUniforms(vp, ev, tj, 1, fg);
      gl.uniform1ui(trackProg.u.uSeed, j.seed);
      gl.uniform1f(trackProg.u.uJetPhi, j.phi);
      gl.uniform1f(trackProg.u.uQuench, j.quench);
      gl.uniform1i(trackProg.u.uJetN, JET_N);
      gl.uniform1f(trackProg.u.uGain, 0.8 * fg * params.gain);
      gl.bindVertexArray(emptyVao); gl.drawArrays(gl.LINES, 0, 2 * JET_N * TRAIL_K * 2);
      qaState.lastJet = { bar: m, step: j.step, seed: j.seed, phi: j.phi, quench: j.quench, ...jetSums(j.seed, JET_N, j.quench) };
    }
    if (t >= 0) qaState.lastEvent = ev;
    if (beam && t >= 0 && metronome.playing && !logged.has('x' + m)) {   // the bunch crossing (at the IP on the downbeat by construction)
      logged.add('x' + m);
      const tb = stepTime(m * params.bpb * 4);
      if (tb !== null) { logEvent({ type: 'crossing', bar: m, tBeat: tb }, now); logEvent({ type: 'pulse-arrive', bar: m, tBeat: tb }, now); }
    }
  }
  if (logged.size > 400) logged.clear();
  if (!(QA_WIRES && beam)) stringSprites(sprites, L.kick, L.hat);
  if (sprites.length) {
    for (let i = 3; i < sprites.length; i += 7) { sprites[i] *= fg * params.gain; sprites[i + 1] *= fg * params.gain; sprites[i + 2] *= fg * params.gain; }
    gl.bindBuffer(gl.ARRAY_BUFFER, spriteBuf.buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(sprites), gl.DYNAMIC_DRAW);
    gl.useProgram(spriteProg.p); gl.uniformMatrix4fv(spriteProg.u.uVP, false, vp); gl.uniform1f(spriteProg.u.uScale, H / 160);
    gl.bindVertexArray(spriteBuf.vao); gl.drawArrays(gl.POINTS, 0, sprites.length / 7);
  }
  if (neonDraw) neonDraw();
  gl.disable(gl.BLEND);

  // bloom and tone map
  gl.bindVertexArray(emptyVao);
  const pass = (prog, dst, src, set) => {
    gl.bindFramebuffer(gl.FRAMEBUFFER, dst ? dst.fbo : null);
    gl.viewport(0, 0, dst ? dst.w : CW, dst ? dst.h : CH);
    gl.useProgram(prog.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, src.t); gl.uniform1i(prog.u.uSrc ?? prog.u.uAcc, 0);
    if (set) set(prog);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  };
  pass(brightProg, rt.b1, rt.acc, p => gl.uniform2f(p.u.uPx, 1 / W, 1 / H));
  for (let k = 0; k < 2; k++) {
    pass(blurProg, rt.b2, rt.b1, p => gl.uniform2f(p.u.uDir, (1 + k) / rt.b1.w, 0));
    pass(blurProg, rt.b1, rt.b2, p => gl.uniform2f(p.u.uDir, 0, (1 + k) / rt.b1.h));
  }
  pass(finalProg, null, rt.acc, p => {
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, rt.b1.t); gl.uniform1i(p.u.uBloom, 1);
    gl.uniform1f(p.u.uFlash, flash * params.gain);
  });
  if (neonDraw) {   // take this frame's wires back out of the trail buffer
    gl.bindFramebuffer(gl.FRAMEBUFFER, rt.acc.fbo); gl.viewport(0, 0, W, H);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE); gl.blendEquation(gl.FUNC_REVERSE_SUBTRACT);
    neonDraw();
    gl.blendEquation(gl.FUNC_ADD); gl.disable(gl.BLEND);
  }

  qaState.scene = sec.scene; qaState.bar = n; qaState.drawnTracks = drawn;
  if (QA_WIRES && beam) { if (!ov.dataset.qaw) { ov.dataset.qaw = 1; octx.clearRect(0, 0, ov.width, ov.height); } }
  else if (now - lastOv > 66) { lastOv = now; delete ov.dataset.qaw; drawOverlay(sec, L); }
  Object.assign(window.__qa, { scene: sec.scene, bars, drop: sec.drop, energy: sec.energy, drawnTracks: drawn, render: [W, H], screen: [CW, CH],
    lastEvent: qaState.lastEvent && summary(qaState.lastEvent), lastJet: qaState.lastJet, strings: stringsQA(), latency: metronome.latency(),
    camera: qaState.camera, wakes: wakesQA.slice(), dijets: dijetsQA.slice(), wires: wiresQA });
  frames++;
  if (now - lastFpsTime > 500) { fps = Math.round(frames * 1000 / (now - lastFpsTime)); frames = 0; lastFpsTime = now; }
  if (now - lastHud > 200) {
    lastHud = now;
    const state = metronome.playing ? '▶' : (metronome.ctx ? '■' : 'tap ▶ Play');
    hud.textContent = `Little Bang · ${sec.scene} · ${sec.drop ? 'DROP' : 'build-up'} · ${params.bpm} bpm · ${state}\n` +
      `${drawn.toLocaleString()} tracks drawn · ${W}×${H}${W !== CW ? ` → ${CW}×${CH}` : ''} · ${fps} fps`;
  }
}
function setTrackUniforms(vp, ev, t, mode, fg) {
  const u = trackProg.u, { ein, eout } = basis(ev.psi), A = fireballAxes(ev.fb, ev.fb.th);
  gl.uniformMatrix4fv(u.uVP, false, vp);
  gl.uniform1ui(u.uSeed, ev.seed);
  gl.uniform1f(u.uT, t); gl.uniform1f(u.uTrail, TRAIL_DT); gl.uniform1i(u.uK, TRAIL_K);
  gl.uniform1i(u.uMode, mode); gl.uniform1i(u.uJetN, JET_N);
  gl.uniform1f(u.uSpeed, SPEED); gl.uniform1f(u.uLoss, params.loss); gl.uniform1f(u.uB, B_T);
  gl.uniform1f(u.uEnergy, ev.energy); gl.uniform1f(u.uV2, ev.fb.v2); gl.uniform1f(u.uDet, DET_R);
  gl.uniform1f(u.uJetPhi, 0); gl.uniform1f(u.uQuench, 0);
  gl.uniform3fv(u.uEin, ein); gl.uniform3fv(u.uEout, eout);
  gl.uniform3f(u.uAx, A.x * FBS, A.out * FBS, A.in * FBS);
}
function summary(ev) {
  return { bar: ev.n, seed: ev.seed, scene: ev.scene, drop: ev.drop, energy: ev.energy, b: ev.b, psi: ev.psi,
           fireball: { ...ev.fb }, jets: ev.jets.map(j => ({ ...j })) };
}

// the overlay: labels and the glueball strip (12's gap, kept small)
const GLUEBALLS = [{ name: '0++', mev: 1730 }, { name: '2++', mev: 2400 }, { name: '0−+', mev: 2590 }];
function drawOverlay(sec, L) {
  const c = octx, W = ov.width, H = ov.height, f = px => `600 ${Math.round(px)}px ui-monospace, Menlo, monospace`;
  c.clearRect(0, 0, W, H);
  c.textAlign = 'left'; c.fillStyle = 'rgba(230,236,245,0.85)'; c.font = f(H / 34);
  const ev = qaState.lastEvent;
  let line1 = '', line2 = '';
  if (sec.scene === 'beamline') {
    line1 = 'beamline · the bunches cross on the downbeat';
    line2 = ev ? `Au + Au · b = ${ev.b.toFixed(1)} fm · tracks curl in 0.5 T · calorimeter lights where they land` : 'ring magnets on the beat · focusing on the kick';
  } else if (sec.scene === 'strings') {
    const s = stringsQA();
    line1 = 'string breaking · κ = 1 GeV/fm';
    line2 = `${s.totalBreaks} breaks · every group white`;
  } else if (ev) {
    line1 = `Au + Au · b = ${ev.b.toFixed(1)} fm · T₀ = ${Math.round(ev.fb.T0 * 1000)} MeV`;
    line2 = `hadronize at 156 MeV after ${ev.fb.th.toFixed(1)} fm/c · v₂ = ${ev.fb.v2.toFixed(3)}`;
    if (sec.scene === 'quench' && qaState.lastJet) line2 = `jet quenching · A_J = ${qaState.lastJet.AJ.toFixed(2)}`;
  }
  c.fillText(line1, W * 0.04, H * 0.07);
  c.font = f(H / 48); c.fillStyle = 'rgba(200,212,232,0.6)';
  c.fillText(line2, W * 0.04, H * 0.115);
  // glueball strip
  const x0 = W * 0.62, x1 = W * 0.96, y0 = H * 0.9, hgt = H * 0.06, X = m => x0 + m / 3200 * (x1 - x0);
  c.fillStyle = 'rgba(30,20,50,0.55)'; c.fillRect(X(0), y0 - hgt, X(1730) - X(0), hgt);
  c.fillStyle = 'rgba(200,180,255,0.6)'; c.font = f(H / 60); c.textAlign = 'center';
  c.fillText('gap', (X(0) + X(1730)) / 2, y0 - hgt / 2 + H / 160);
  const lv = [L.kick, L.snare, L.hat];
  GLUEBALLS.forEach((g, i) => {
    const h = hgt * (0.3 + 0.7 * lv[i]);
    c.fillStyle = 'rgba(255,255,255,0.85)'; c.fillRect(X(g.mev) - W / 400, y0 - h, W / 200, h);
  });
  c.strokeStyle = 'rgba(200,210,230,0.4)'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(X(0), y0); c.lineTo(X(3200), y0); c.stroke();
  c.textAlign = 'left'; c.fillStyle = 'rgba(200,210,230,0.5)';
  c.fillText('glueballs, MeV', X(0), y0 + H / 40);
}

window.__qa = {
  errors, events, B: B_T, Tc: T_C, kappa: KAPPA, mq: MQ, fbs: FBS, speed: SPEED, jetN: JET_N,
  rnd, pcg, event: n => { const ev = eventFor(n); return ev && summary(ev); },
  trackParams: (seed, i, energy = 1, v2 = 0) => trackParams(seed, i, { energy, fb: { v2 } }),
  trackPos: (bar, i, t) => { const ev = eventFor(bar); return ev ? trackPos(ev, i, t) : null; },
  helix, jetSums, fireballAt: (bar, tfm) => { const ev = eventFor(bar); return ev ? { axes: fireballAxes(ev.fb, tfm), T: fireballT(ev.fb, tfm) } : null; },
  loss: () => params.loss,
  bunchPos, ringPoint, camS, ringR: RING_R, pipeR: PIPE_R, calR: CAL_R, cs: CS,
};
const q = k => query.get(k);
if (q('scene') && (q('scene') === 'auto' || SCENES.includes(q('scene')))) params.scene = q('scene');
for (const k of ['bars', 'bpm', 'n', 'gain', 'tau', 'loss', 'lead', 'seed']) { const v = parseFloat(q(k)); if (Number.isFinite(v)) params[k] = v; }
if (q('res') === 'native') params.res = 'native';
params.n = Math.max(1000, Math.min(1000000, Math.round(params.n)));
params.muted = q('muted') === '1';
sync();
requestAnimationFrame(frame);
</script>
<script src="panic.js"></script>
