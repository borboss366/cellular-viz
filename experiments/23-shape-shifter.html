<!--
  23 · Shape Shifter   (Millennium track #37, Poincaré take two; spec: #37 comment 6412117304)

  The user found 14's curve and pinch boring and asked for a sphere or torus that turns into a
  kettle or a cup, changes colour, vibrates and bumps to the music, with a flying camera. 14 stays.

  Topology stays honest: a shape only morphs into shapes with the same number of holes (genus).
    genus 1  mug → kettle with handle → doughnut → ring → mug …  (the coffee mug = doughnut joke)
    genus 0  kettle without handle → vase / bowl / apple → sphere ("round out")
  The genus changes only at two logged events, Perelman's move of cutting a thin neck:
    surgery  over the 2 bars before a genus-1 section's drop (bar S − 2) the handle's far point
             thins with radius ∝ √(T − t), as in a Ricci-flow neck pinch, and reaches 0 exactly
             on the drop; a cut opens there, the stubs cap off and are absorbed (genus 1 → 0)
    attach   on a genus-0 section the stubs grow back with the cut open, the cut closes exactly
             on the drop and the neck grows back as √τ (0 → 1)
  Every shape is one signed distance function built from IQ primitives: a rounded, tapered body,
  an optional top cavity (the body offset inward and lifted, so it opens only through the top),
  a spout and a knob that grow out of the body, and a handle torus whose ring passes through
  the body (its tube radius narrows at the far point, and a slab there cuts it open). Keyframes are
  parameter sets, and morphs interpolate the parameters, never two SDFs, so every in-between
  shape is a genus-0 body plus (or minus) one open handle.

  Surface and music: displacement d − A·w with kick rings spreading from a point over ~1 beat,
  a slow breathing swell, hat ripples and snare waves. A is capped at 0.4 × the local feature
  thickness (handle tube, cup wall, spout), so bumps never change the genus.
  Colour = Gaussian curvature K = (∇f·adj(H)·∇f)/|∇f|⁴ from the SDF's Hessian at the hit: warm
  where K > 0, cool where K < 0 (Gauss–Bonnet: ∫K dA = 2πχ = 4π(1 − g)); glaze per section:
  ceramic, chrome, iridescent. Camera: a slow orbit; on the bar before a surgery it dives through
  the handle (only while the genus is 1).

  Everything is a pure function of the bar position, so QA can rebuild any moment.
  window.__qa: sdf(x, y, z [, bars]), genus(n, bars) (cubical complex of the solid on an n³ grid:
  χ_solid = V − E + F − C, surface χ = 2χ_solid, g = 1 − χ_solid), totalK(n, bars) (co-area
  integral of the same K), featureMin, bump {A, capRule}, cam {pos, sdf}, shape {from, to, u,
  params, genus}, events (kick/snare/hat, morph, surgery, attach, fly), errors.
-->

<script>
'use strict';

const query = new URLSearchParams(location.search);
// family: auto alternates a genus-1 section (morphs, surgery on its drop) and a genus-0 section
// (morphs to a sphere, attach on its drop); '1' / '0' hold one family without events.
// res: 'cap' renders at most 1920×1080 pixels and lets the browser scale up; 'native' renders all.
const params = { family: 'auto', palette: 'auto', fly: true, bumpAmp: 0.5, curvColor: 0.7,
                 morphBars: 8, orbitBars: 16, steps: 96, march: 'sor', bpm: 120, bpb: 4, muted: false, res: 'cap',
                 kick: 'x...x...x...x...', snare: '....x.......x...', hat: 'x.x.x.x.x.x.x.x.' };
const PALETTES = ['ceramic', 'chrome', 'iridescent'];
// #88 GPU gate for ray-march scenes (comment 6491353229): declared render scales, fractions of the full
// device-pixel canvas per axis. Solo plays at soloScale; in a crossfade the host drops it to blendScale.
const PERF = { soloScale: 0.75, blendScale: 0.5 };
const THICK = 0.12, SPR = 0.09;

// ---------- keyframes (parameter sets) ----------
// ra, rb, h: rounded body (radius ra + rb, half height h + rb); taper: radius × (1 + taper·y);
// dimple: apple top; cav: top cavity 0…1; spout, knob: grow out 0…1; handle torus in the xy plane
// at (hx, hy) with ring radius Rh and tube rh. The ring always passes through the body (or, for
// the torus shapes, the tiny body sits inside the tube), and the body never fills the hole.
const KEYS = ['ra', 'rb', 'h', 'taper', 'dimple', 'cav', 'spout', 'knob', 'hx', 'hy', 'Rh', 'rh'];
const HANDLE = { hx: 0.56, hy: 0.02, Rh: 0.27, rh: 0.09 };
const KF = {
  mug:      { ra: 0.40, rb: 0.06, h: 0.38, taper: 0,     dimple: 0, cav: 0.95, spout: 0, knob: 0, ...HANDLE },
  kettle:   { ra: 0.05, rb: 0.47, h: 0.06, taper: 0.12,  dimple: 0, cav: 0,    spout: 1, knob: 1, hx: 0.55, hy: 0.08, Rh: 0.30, rh: 0.09 },
  doughnut: { ra: 0,    rb: 0.10, h: 0,    taper: 0,     dimple: 0, cav: 0,    spout: 0, knob: 0, hx: 0.48, hy: 0, Rh: 0.48, rh: 0.24 },
  ring:     { ra: 0,    rb: 0.06, h: 0,    taper: 0,     dimple: 0, cav: 0,    spout: 0, knob: 0, hx: 0.60, hy: 0, Rh: 0.60, rh: 0.09 },
  kettle0:  { ra: 0.05, rb: 0.47, h: 0.06, taper: 0.12,  dimple: 0, cav: 0,    spout: 1, knob: 1, ...HANDLE },
  vase:     { ra: 0.16, rb: 0.12, h: 0.46, taper: -0.55, dimple: 0, cav: 0.85, spout: 0, knob: 0, ...HANDLE },
  bowl:     { ra: 0.42, rb: 0.08, h: 0.20, taper: 0.5,   dimple: 0, cav: 0.97, spout: 0, knob: 0, ...HANDLE },
  apple:    { ra: 0,    rb: 0.50, h: 0,    taper: 0,     dimple: 1, cav: 0,    spout: 0, knob: 0, ...HANDLE },
  sphere:   { ra: 0,    rb: 0.55, h: 0,    taper: 0,     dimple: 0, cav: 0,    spout: 0, knob: 0, ...HANDLE },
};
const G1 = ['mug', 'kettle', 'doughnut', 'ring'], G0 = ['kettle0', 'vase', 'bowl', 'apple'];

// ---------- clock (experiments/clock.js, #132) and audio-in (batch A, #135) ----------
// The copied metronome is gone: beats come from the shared clock (?clock=…, default: its metronome, the same clicks
// as before; metronome.read().beats is exactly the old metronome.beats()). metronome.hits, .steps, .ctx and
// .latency() are unchanged, so the page's sync log reads them as before. audio-in (?audio=…, default 'clock') adds
// the shared hooks: audio.frameStart(now) at the top of each frame, then audio.due(BEAT_LANES) right after the read,
// which logs each hit the visuals reached in __qa.beatLog. This page reads no drum levels.
const metronome = Clock.create({ source: query.get('clock') || 'metronome', settings: params, hitStep: false });
const BEAT_LANES = ['kick', 'snare', 'hat'];   // every hit is logged in the page's own sync log on the frame it is heard
const audio = AudioIn.create({ clock: metronome, source: query.get('audio') || 'clock' }).start();

// ---------- the state at any bar position (pure, so QA can rebuild any moment) ----------
const ease = u => u * u * (3 - 2 * u);
const clamp01 = x => Math.max(0, Math.min(1, x));
function hash(n) { let x = Math.imul(n | 0, 0x9E3779B1) >>> 0; x ^= x >>> 15; x = Math.imul(x, 0x85EBCA77) >>> 0; x ^= x >>> 13; return (x >>> 0) / 4294967296; }
const S_BARS = () => 2 * params.morphBars;   // a section: two morphs
function famOf(k) { return params.family === 'auto' ? (k % 2 === 0 ? 1 : 0) : +params.family; }
function keysOfSection(k) {   // the two keyframes a section passes through (bar 0 and bar M)
  const c = Math.floor(k / 2), f = famOf(k);
  if (f === 1) { const i = (2 * (params.family === 'auto' ? c : k)) % G1.length; return [G1[i], G1[(i + 1) % G1.length]]; }
  return [G0[(params.family === 'auto' ? c : k) % G0.length], params.family === 'auto' ? 'sphere' : G0[(k + 1) % G0.length]];
}
function lerpKF(A, B, u) { const o = {}; for (const key of KEYS) o[key] = A[key] + (B[key] - A[key]) * u; return o; }
function stateAt(bars) {
  const S = S_BARS(), M = params.morphBars, k = Math.max(0, Math.floor(bars / S)), sb = bars - k * S, fam = famOf(k);
  const [k0, k1] = keysOfSection(k), next = keysOfSection(k + 1)[0];
  const from = sb < M ? k0 : k1, to = sb < M ? k1 : next, u = ease(clamp01((sb < M ? sb : sb - M) / M));
  const P = lerpKF(KF[from], KF[to], u);
  // the handle: a = present (stubs absorbed as a → 0), p = neck pinch at the far point
  // (neck radius rh·a·(1 − p)), w = half-width of the cut slab there (w > 0: the handle is open).
  // The drop is bar S − 2 of each section. Surgery: p = 1 − √(1 − s) with s linear over the
  // 2 bars before the drop, so the neck radius ∝ √(T − t) as in a Ricci-flow neck pinch, and it is
  // 0 exactly on the drop; then the cut opens (w > 0) and the stubs cap off and are absorbed.
  // Attach runs it backwards: the stubs grow with the cut open, the cut closes exactly on the
  // drop with a pinched neck, and the neck grows back as √τ.
  let a = fam === 1 ? 1 : 0, p = 0, w = 0, genus = fam;
  const events = params.family === 'auto', tau = sb - (S - 2);
  if (fam === 1 && events) {
    if (tau < 0) p = 1 - Math.sqrt(1 - clamp01((sb - (S - 4)) / 2));
    else { p = 1 - ease(clamp01(tau / 0.5)); w = 0.12 * ease(clamp01(tau / 0.25)); a = 1 - ease(clamp01((tau - 0.5) / 1.5)); genus = 0; }
  }
  if (fam === 0 && events) {
    if (tau <= 0) { a = ease(clamp01((sb - (S - 6)) / 2)); w = 0.12 * (1 - ease(clamp01((sb - (S - 4)) / 2))); p = ease(clamp01(sb - (S - 4))); }
    else { a = 1; p = 1 - Math.sqrt(clamp01(tau)); genus = 1; }
  }
  P.a = a; P.p = p; P.w = w;
  const beats = bars * params.bpb;
  // music, deterministic from the patterns: kick rings, breathing, hats, snare waves
  const rings = [], spb = 60 / params.bpm;
  for (let b = Math.floor(beats); b > beats - 3 && b >= 0 && rings.length < 4; b--) {
    if (params.kick[(b * 4) % 16] !== 'x') continue;
    const age = beats - b, th = hash(b) * 2 * Math.PI, z = hash(b + 7777) * 2 - 1, r = Math.sqrt(1 - z * z);
    rings.push([Math.cos(th) * r * 0.7, z * 0.7, Math.sin(th) * r * 0.7, age]);
  }
  const env = (lane, tau) => {   // seconds since the lane's last step, as a decaying level
    const step = Math.floor(beats * 4);
    for (let s2 = step; s2 > step - 16 && s2 >= 0; s2--) if (params[lane][s2 % 16] === 'x') return Math.exp(-((beats * 4 - s2) * spb / 4) / tau);
    return 0;
  };
  const wave = { A: params.bumpAmp * 0.16, bass: 0.5 + 0.5 * Math.sin(2 * Math.PI * beats / 8), hat: env('hat', 1.0), snare: env('snare', 0.15) };
  const center = shapeCenter(P);
  for (const rg of rings) { rg[0] += center[0]; rg[1] += center[1]; rg[2] += center[2]; }
  const thin = [];
  if (P.a > 0.001 && P.w === 0) thin.push(P.rh * P.a * (1 - P.p));
  if (P.cav > 0.001) thin.push(THICK);
  if (P.spout > 0.01) thin.push(spoutR(P));
  if (P.knob > 0.01) thin.push(knobR(P));
  return { bars, beats, k, sb, fam, from, to, u, P, rings, wave, center, featureMin: thin.length ? Math.min(...thin) : null, genus, tau, S, M };
}
const spoutR = P => SPR * clamp01((P.ra + P.rb) / 0.3);
const knobR = P => 0.07 * (0.3 + 0.7 * P.knob);
const liftOf = P => { const L0 = 2.5 * (P.h + P.rb) + 0.3; return L0 + (THICK + 0.03 - L0) * P.cav; };
function shapeCenter(P) {
  const wb = P.ra + P.rb + P.h, wh = P.a * (P.Rh + P.rh);
  return [wh * P.hx / (wb + wh + 1e-6), wh * P.hy / (wb + wh + 1e-6), 0];
}

// ---------- the SDF, in JS (the GLSL below is the same, line for line) ----------
const smin = (a, b, k) => { const h = clamp01(0.5 + 0.5 * (b - a) / k); return b + (a - b) * h - k * h * (1 - h); };
const smax = (a, b, k) => -smin(-a, -b, k);
function bodyF(P, x, y, z) {
  const sc = 1 + P.taper * Math.max(-1, Math.min(1, y));
  const qx = x / sc, qz = z / sc;
  const dx = Math.hypot(qx, qz) - P.ra, dy = Math.abs(y) - P.h;
  let b = (Math.min(Math.max(dx, dy), 0) + Math.hypot(Math.max(dx, 0), Math.max(dy, 0)) - P.rb) * Math.min(1, sc);
  const top = P.h + P.rb, dd = Math.hypot(x, y - (top + 0.10), z) - 0.20;
  return b + (smax(b, -dd, 0.08) - b) * P.dimple;
}
function segDist(px, py, pz, ax, ay, az, bx, by, bz) {
  const pax = px - ax, pay = py - ay, paz = pz - az, bax = bx - ax, bay = by - ay, baz = bz - az;
  const bb = bax * bax + bay * bay + baz * baz, h = bb > 1e-12 ? clamp01((pax * bax + pay * bay + paz * baz) / bb) : 0;
  return Math.hypot(pax - bax * h, pay - bay * h, paz - baz * h);
}
function partsJS(P, x, y, z) {
  let body = bodyF(P, x, y, z);
  const R0 = P.ra + P.rb, spR = spoutR(P);
  const s1x = -R0 * 0.4 + (-R0 - 0.30 + R0 * 0.4) * P.spout, s1y = 0.32 * P.spout;
  const spD = segDist(x, y, z, -R0 * 0.4, 0, 0, s1x, s1y, 0);
  body = smin(body, spD - spR, 0.06);
  const ky = (P.h + P.rb + 0.04) * P.knob, kR = knobR(P), knD = Math.hypot(x, y - ky, z);
  body = smin(body, knD - kR, 0.04);
  const qx = x - P.hx, qy = y - P.hy, rho = Math.hypot(qx, qy) - P.Rh, phi = Math.atan2(qy, qx);
  const rl = P.rh * P.a * (1 - P.p * Math.exp(-(phi * phi) / 0.16)), tubeD = Math.hypot(rho, z);
  let dh = tubeD - rl;
  if (P.w > 0) dh = smax(dh, -Math.max(Math.abs(qy) - P.w, -qx), Math.min(0.03, P.w));
  if (P.a <= 0.001) dh = 1e3;
  let base = smin(body, dh, 0.04);
  const dIn = bodyF(P, x, y - liftOf(P), z) + THICK;
  if (P.cav > 0.001) base = smax(base, -dIn, 0.03);
  return { base, rl, tubeD, dIn, spD, spR, knD, kR };
}
function wavesJS(st, x, y, z) {
  let w = 0;
  for (const r of st.rings) { const d = Math.hypot(x - r[0], y - r[1], z - r[2]) - 0.9 * r[3]; w += Math.exp(-(d * d) / 0.0144) * Math.exp(-r[3] / 0.8); }
  w += 0.5 * st.wave.bass;
  w += 0.12 * st.wave.hat * Math.sin(23 * x + 17 * y + 29 * z + st.beats * 1.5);
  w += 0.35 * st.wave.snare * Math.sin(y * 9 - st.beats * 6.2832);
  return Math.max(-1, Math.min(1, w));
}
const sstep = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
function sdfJS(st, x, y, z) {
  const P = st.P, p = partsJS(P, x, y, z);
  let A = st.wave.A;
  if (P.a > 0.001) A = A + (Math.min(A, 0.4 * p.rl) - A) * (1 - sstep(p.rl + 0.03, p.rl + 0.15, p.tubeD));
  if (P.cav > 0.001) A = A + (Math.min(A, 0.4 * THICK) - A) * (1 - sstep(THICK, THICK + 0.12, Math.abs(p.dIn)));
  A = A + (Math.min(A, 0.4 * p.spR) - A) * (1 - sstep(p.spR + 0.03, p.spR + 0.15, p.spD));
  A = A + (Math.min(A, 0.4 * p.kR) - A) * (1 - sstep(p.kR + 0.03, p.kR + 0.15, p.knD));
  return p.base - A * wavesJS(st, x, y, z);
}

// ---------- QA: genus from the solid's cubical complex, ∫K dA by co-area ----------
function genusAt(st, n = 64) {
  const c = st.center, L = 1.5, h = 2 * L / n, inside = new Uint8Array(n * n * n);
  let C = 0;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) for (let k = 0; k < n; k++) {
    const v = sdfJS(st, c[0] - L + (i + 0.5) * h, c[1] - L + (j + 0.5) * h, c[2] - L + (k + 0.5) * h) < 0 ? 1 : 0;
    inside[(i * n + j) * n + k] = v; C += v;
  }
  const at = (i, j, k) => i >= 0 && j >= 0 && k >= 0 && i < n && j < n && k < n && inside[(i * n + j) * n + k] === 1;
  let V = 0, E = 0, F = 0;
  for (let i = 0; i <= n; i++) for (let j = 0; j <= n; j++) for (let k = 0; k <= n; k++) {
    // a lattice vertex belongs to the complex if any of its 8 cubes is inside
    let vIn = false;
    for (let a = -1; a <= 0 && !vIn; a++) for (let b = -1; b <= 0 && !vIn; b++) for (let d = -1; d <= 0 && !vIn; d++) if (at(i + a, j + b, k + d)) vIn = true;
    if (vIn) V++;
    // edges along x, y, z starting here (4 cubes each)
    if (i < n && (at(i, j - 1, k - 1) || at(i, j, k - 1) || at(i, j - 1, k) || at(i, j, k))) E++;
    if (j < n && (at(i - 1, j, k - 1) || at(i, j, k - 1) || at(i - 1, j, k) || at(i, j, k))) E++;
    if (k < n && (at(i - 1, j - 1, k) || at(i, j - 1, k) || at(i - 1, j, k) || at(i, j, k))) E++;
    // faces normal to x, y, z (2 cubes each)
    if (j < n && k < n && (at(i - 1, j, k) || at(i, j, k))) F++;
    if (i < n && k < n && (at(i, j - 1, k) || at(i, j, k))) F++;
    if (i < n && j < n && (at(i, j, k - 1) || at(i, j, k))) F++;
  }
  const chiSolid = V - E + F - C;
  return { n, V, E, F, C, chiSolid, chi: 2 * chiSolid, g: 1 - chiSolid };
}
function curvJS(st, x, y, z, e = 0.006) {
  const f = (a, b, c) => sdfJS(st, x + a, y + b, z + c), f0 = f(0, 0, 0);
