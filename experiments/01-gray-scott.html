<!doctype html>
<!--
  01 · Gray-Scott reaction-diffusion

  Two chemicals A and B on a 512×512 torus. Each step:
    A' = A + Da·∇²A − A·B² + f·(1 − A)
    B' = B + Db·∇²B + A·B² − (k + f)·B
  A is fed in at rate f, B is removed at rate k + f, and the reaction A + 2B → 3B
  turns A into B. Da = 1.0, Db = 0.5, dt = 1, with the 3×3 Laplacian
  (centre −1, edges 0.2, corners 0.05) from Karl Sims' tutorial.
  Small changes in (f, k) give spots, splitting cells, worms, mazes or coral.

  Drawing: your finger paints B into the field.
  Rendering: B is mapped through a 5-stop colour gradient, with a little
  relief lighting taken from the gradient of B.
  WebGL2, float render targets (32-bit if available, else 16-bit), ping-pong FBOs.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>01 · Gray-Scott</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #05070c; color: #e8eef5;
    font: 14px/1.3 system-ui, -apple-system, sans-serif; }
  body { display: flex; flex-direction: column; }
  #wrap { position: relative; width: min(100vw, calc(100dvh - 230px)); aspect-ratio: 1;
    margin: 0 auto; flex: none; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud { position: absolute; left: 6px; bottom: 6px; padding: 4px 7px; border-radius: 6px;
    background: rgba(0,0,0,.55); font: 12px/1.35 ui-monospace, Menlo, monospace;
    white-space: pre; pointer-events: none; }
  #panel { flex: 1; overflow-y: auto; padding: 8px 12px 16px; }
  .row { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
  .row label { width: 92px; flex: none; color: #9fb0c3; }
  .row input[type=range] { flex: 1; }
  .row output { width: 58px; text-align: right; font-family: ui-monospace, monospace; }
  .buttons { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
  button { flex: 1 1 22%; padding: 9px 6px; border: 1px solid #2a3647; border-radius: 8px;
    background: #121a26; color: inherit; font: inherit; }
  button.on { background: #24496b; border-color: #4f86b8; }
  button.wide { flex-basis: 100%; }
  a { color: #7fb4e6; }
  @media (orientation: landscape) {
    body { flex-direction: row; }
    #wrap { width: auto; height: 100dvh; margin: 0; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud">loading…</div>
</div>
<div id="panel">
  <div class="buttons" id="presets"></div>
  <div class="row"><label for="f">feed f</label><input id="f" type="range" min="0.010" max="0.100" step="0.0001"><output id="fOut"></output></div>
  <div class="row"><label for="k">kill k</label><input id="k" type="range" min="0.040" max="0.075" step="0.0001"><output id="kOut"></output></div>
  <div class="row"><label for="steps">steps/frame</label><input id="steps" type="range" min="1" max="30" step="1"><output id="stepsOut"></output></div>
  <div class="row"><label for="brush">brush</label><input id="brush" type="range" min="2" max="30" step="1"><output id="brushOut"></output></div>
  <div class="row"><label for="relief">relief</label><input id="relief" type="range" min="0" max="1" step="0.05"><output id="reliefOut"></output></div>
  <div class="buttons">
    <button id="reset">Reset</button>
    <button id="clear">Clear</button>
    <button id="pause">Pause</button>
    <button id="copy" class="wide">Copy setup</button>
  </div>
  <a href="../index.html">← all experiments</a>
</div>

<script>
'use strict';

const SIZE = 512;   // simulation grid is SIZE × SIZE, wrapping at the edges

// Each preset sets f, k and a colour gradient (dark → light, 5 stops).
const PRESETS = {
  coral:       { f: 0.0545, k: 0.0620, palette: ['#04121f', '#0b3d5c', '#1f8a8a', '#f2c57c', '#ff6f59'] },
  mitosis:     { f: 0.0367, k: 0.0649, palette: ['#0d0221', '#3a0ca3', '#7209b7', '#f72585', '#ffd6ff'] },
  worms:       { f: 0.0780, k: 0.0610, palette: ['#0b0b0b', '#283618', '#606c38', '#dda15e', '#fefae0'] },
  fingerprint: { f: 0.0370, k: 0.0600, palette: ['#000814', '#001d3d', '#00507a', '#e0b13a', '#fff3c4'] },
};

const params = { preset: 'coral', f: 0, k: 0, steps: 10, brush: 8, relief: 0.6, paused: false };

// ---------- WebGL setup ----------
const canvas = document.getElementById('c');
const hud = document.getElementById('hud');
const gl = canvas.getContext('webgl2', { antialias: false });
if (!gl) fail('WebGL2 is not available in this browser.');

function fail(msg) { hud.textContent = msg; throw new Error(msg); }

// Fullscreen triangle generated from gl_VertexID, so no vertex buffers are needed.
const VERT = `#version 300 es
out vec2 vUv;
void main() {
  vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  vUv = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

// One reaction-diffusion step, plus the finger brush (a capsule from uBrush.xy to uBrush.zw).
const SIM = `#version 300 es
precision highp float;
uniform sampler2D uState;   // r = A, g = B
uniform float uF, uK;
uniform vec4 uBrush;        // segment endpoints in texels
uniform float uBrushR;      // brush radius in texels, 0 = not drawing
out vec4 outColor;

vec2 at(ivec2 p) {
  ivec2 s = textureSize(uState, 0);
  return texelFetch(uState, (p + s) % s, 0).rg;
}

void main() {
  ivec2 p = ivec2(gl_FragCoord.xy);
  vec2 c = at(p);
  vec2 lap = -c
    + 0.20 * (at(p + ivec2( 1, 0)) + at(p + ivec2(-1, 0)) + at(p + ivec2(0, 1)) + at(p + ivec2(0, -1)))
    + 0.05 * (at(p + ivec2( 1, 1)) + at(p + ivec2(-1, 1)) + at(p + ivec2(1, -1)) + at(p + ivec2(-1, -1)));

  float a = c.r, b = c.g;
  float abb = a * b * b;
  a += 1.0 * lap.r - abb + uF * (1.0 - a);
  b += 0.5 * lap.g + abb - (uK + uF) * b;

  if (uBrushR > 0.0) {
    vec2 size = vec2(textureSize(uState, 0));
    vec2 d = gl_FragCoord.xy - uBrush.xy;
    d -= size * round(d / size);                       // nearest copy on the torus
    vec2 e = uBrush.zw - uBrush.xy;
    float h = clamp(dot(d, e) / max(dot(e, e), 1e-6), 0.0, 1.0);
    float dist = length(d - e * h);
    b = max(b, 0.9 * (1.0 - smoothstep(uBrushR * 0.7, uBrushR, dist)));
  }

  outColor = vec4(clamp(a, 0.0, 1.0), clamp(b, 0.0, 1.0), 0.0, 1.0);
}`;

// Colour B through the gradient; add relief lighting from the slope of B.
const DRAW = `#version 300 es
precision highp float;
uniform sampler2D uState;
uniform vec3 uPal[5];
uniform float uRelief;
in vec2 vUv;
out vec4 outColor;

float fetchB(ivec2 p) {
  ivec2 s = textureSize(uState, 0);
  return texelFetch(uState, (p + s) % s, 0).g;   // p is never below -2 here
}

// Manual bilinear filter (float textures are not always filterable on phones).
float sampleB(vec2 t) {
  t -= 0.5;
  ivec2 i = ivec2(floor(t));
  vec2 f = fract(t);
  float b00 = fetchB(i), b10 = fetchB(i + ivec2(1, 0));
  float b01 = fetchB(i + ivec2(0, 1)), b11 = fetchB(i + ivec2(1, 1));
  return mix(mix(b00, b10, f.x), mix(b01, b11, f.x), f.y);
}

vec3 palette(float t) {
  t = clamp(t, 0.0, 1.0) * 4.0;
  vec3 c = uPal[0];
  for (int i = 0; i < 4; i++) c = mix(c, uPal[i + 1], clamp(t - float(i), 0.0, 1.0));
  return c;
}

void main() {
  vec2 t = vUv * vec2(textureSize(uState, 0));
  float b = sampleB(t);
  vec3 col = palette(smoothstep(0.02, 0.42, b));

  float dx = sampleB(t + vec2(1, 0)) - sampleB(t - vec2(1, 0));
  float dy = sampleB(t + vec2(0, 1)) - sampleB(t - vec2(0, 1));
  vec3 n = normalize(vec3(-dx * 6.0, -dy * 6.0, 1.0));
  vec3 L = normalize(vec3(-0.5, 0.6, 1.0));
  float diff = dot(n, L);
  float spec = pow(max(dot(reflect(-L, n), vec3(0, 0, 1)), 0.0), 24.0);
  vec3 lit = col * (0.55 + 0.5 * diff) + 0.35 * spec;

  outColor = vec4(mix(col, lit, uRelief), 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) fail('Shader error:\n' + gl.getShaderInfoLog(s));
  return s;
}

function program(fragSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fragSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) fail('Link error:\n' + gl.getProgramInfoLog(p));
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const name = gl.getActiveUniform(p, i).name.replace('[0]', '');
    u[name] = gl.getUniformLocation(p, name);
  }
  return { p, u };
}

const simProg = program(SIM);
const drawProg = program(DRAW);
gl.bindVertexArray(gl.createVertexArray());   // empty VAO: positions come from gl_VertexID

// ---------- Ping-pong state textures ----------
// Prefer 32-bit floats; fall back to 16-bit where the phone only supports those.
const hasF32 = gl.getExtension('EXT_color_buffer_float');
const hasF16 = gl.getExtension('EXT_color_buffer_half_float');
let targets = null, precisionLabel = '';
for (const fmt of [hasF32 && gl.RGBA32F, (hasF32 || hasF16) && gl.RGBA16F].filter(Boolean)) {
  targets = makeTargets(fmt);
  if (targets) { precisionLabel = fmt === gl.RGBA32F ? 'f32' : 'f16'; break; }
}
if (!targets) fail('This device cannot render to float textures.');

function makeTargets(internalFormat) {
  const list = [];
  for (let i = 0; i < 2; i++) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, SIZE, SIZE, 0, gl.RGBA, gl.FLOAT, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) return null;
    list.push({ tex, fbo });
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return list;
}

let cur = 0;   // index of the texture holding the current state
let seededAt = performance.now();   // when the field was last reseeded, for Copy setup

// Fill the field with A = 1, B = 0, plus a few random squares of B as seeds.
function seed(withSpots) {
  const data = new Float32Array(SIZE * SIZE * 4);
  for (let i = 0; i < SIZE * SIZE; i++) { data[i * 4] = 1; data[i * 4 + 3] = 1; }
  const spots = withSpots ? 40 : 0;
  for (let s = 0; s < spots; s++) {
    const r = 3 + Math.floor(Math.random() * 6);
    const cx = Math.floor(Math.random() * SIZE), cy = Math.floor(Math.random() * SIZE);
    for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) {
      const i = (((cy + y + SIZE) % SIZE) * SIZE + (cx + x + SIZE) % SIZE) * 4;
      data[i] = 0.5; data[i + 1] = 0.25 + Math.random() * 0.05;
    }
  }
  gl.bindTexture(gl.TEXTURE_2D, targets[cur].tex);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, SIZE, SIZE, gl.RGBA, gl.FLOAT, data);
  seededAt = performance.now();
}

// ---------- Touch / mouse drawing ----------
const pointer = { down: false, x: 0, y: 0, lastX: 0, lastY: 0 };

function toGrid(e) {
  const r = canvas.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width * SIZE, (1 - (e.clientY - r.top) / r.height) * SIZE];
}
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  [pointer.x, pointer.y] = toGrid(e);
  pointer.lastX = pointer.x; pointer.lastY = pointer.y;
  pointer.down = true;
});
canvas.addEventListener('pointermove', e => { if (pointer.down) [pointer.x, pointer.y] = toGrid(e); });
for (const ev of ['pointerup', 'pointercancel']) canvas.addEventListener(ev, () => { pointer.down = false; });

// ---------- UI ----------
const $ = id => document.getElementById(id);
const presetBox = $('presets');
for (const name of Object.keys(PRESETS)) {
  const b = document.createElement('button');
  b.textContent = name;
  b.onclick = () => applyPreset(name);
  presetBox.appendChild(b);
}

function hexToRgb(h) { return [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255); }

let paletteFlat = [];
let basePreset = 'coral';   // last preset picked: its palette stays after sliders move
function applyPreset(name) {
  const p = PRESETS[name];
  basePreset = name;
  params.preset = name; params.f = p.f; params.k = p.k;
  paletteFlat = p.palette.flatMap(hexToRgb);
  for (const b of presetBox.children) b.classList.toggle('on', b.textContent === name);
  syncSliders();
  seed(true);
}

const sliders = { f: 4, k: 4, steps: 0, brush: 0, relief: 2 };   // name → decimals shown
function syncSliders() {
  for (const [name, dec] of Object.entries(sliders)) {
    $(name).value = params[name];
    $(name + 'Out').textContent = Number(params[name]).toFixed(dec);
  }
}
for (const [name, dec] of Object.entries(sliders)) {
  $(name).addEventListener('input', e => {
    params[name] = parseFloat(e.target.value);
    $(name + 'Out').textContent = params[name].toFixed(dec);
    if (name === 'f' || name === 'k') markCustom();
  });
}
function markCustom() {   // hand-tuned values no longer match a preset
  params.preset = 'custom';
  for (const b of presetBox.children) b.classList.remove('on');
}
$('reset').onclick = () => seed(true);
$('clear').onclick = () => seed(false);
$('pause').onclick = e => { params.paused = !params.paused; e.target.classList.toggle('on', params.paused); };

// ---------- Copy setup ----------
// One tap copies the settings as text plus a link that reopens this exact setup.
// The link's query (?preset=coral&f=0.0545&...) is read back by loadFromUrl() below.
function setupLink() {
  const q = new URLSearchParams({ preset: basePreset });
  for (const name of Object.keys(sliders)) q.set(name, params[name]);
  return location.origin + location.pathname + '?' + q;
}
function setupText() {
  const secs = Math.round((performance.now() - seededAt) / 1000);
  return `01 · Gray-Scott · ${params.preset}` + (params.preset === 'custom' ? ` (from ${basePreset})` : '') + '\n' +
    `f ${params.f.toFixed(4)}  k ${params.k.toFixed(4)}  Da 1.0  Db 0.5\n` +
    `steps ${params.steps}  brush ${params.brush}  relief ${params.relief.toFixed(2)}\n` +
    `${SIZE}² ${precisionLabel} · ${fps} fps · ${secs}s since reset\n` +
    setupLink();
}
$('copy').onclick = async e => {
  const text = setupText(), btn = e.target;
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch {   // older browsers or no clipboard permission: fall back to a hidden textarea
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    ok = document.execCommand('copy'); ta.remove();
  }
  if (!ok) { prompt('Copy this:', text); return; }
  btn.textContent = 'Copied ✓';
  setTimeout(() => { btn.textContent = 'Copy setup'; }, 1500);
};

function loadFromUrl() {
  const q = new URLSearchParams(location.search);
  applyPreset(PRESETS[q.get('preset')] ? q.get('preset') : 'coral');
  let changed = false;
  for (const name of Object.keys(sliders)) {
    const v = parseFloat(q.get(name));
    if (Number.isNaN(v) || v === params[name]) continue;
    params[name] = v;
    if (name === 'f' || name === 'k') changed = true;
  }
  if (changed) markCustom();
  syncSliders();
}

// ---------- Main loop ----------
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.min(1024, Math.round(canvas.clientWidth * dpr));
  const h = Math.min(1024, Math.round(canvas.clientHeight * dpr));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
}

function step(drawBrush) {
  const next = 1 - cur;
  gl.bindFramebuffer(gl.FRAMEBUFFER, targets[next].fbo);
  gl.viewport(0, 0, SIZE, SIZE);
  gl.useProgram(simProg.p);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, targets[cur].tex);
  gl.uniform1i(simProg.u.uState, 0);
  gl.uniform1f(simProg.u.uF, params.f);
  gl.uniform1f(simProg.u.uK, params.k);
  gl.uniform4f(simProg.u.uBrush, pointer.lastX, pointer.lastY, pointer.x, pointer.y);
  gl.uniform1f(simProg.u.uBrushR, drawBrush ? params.brush : 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  cur = next;
}

let frames = 0, fps = 0, lastFpsTime = performance.now();
function frame(now) {
  resize();
  const steps = params.paused ? (pointer.down ? 1 : 0) : params.steps;
  for (let i = 0; i < steps; i++) step(pointer.down && i === 0);
  pointer.lastX = pointer.x; pointer.lastY = pointer.y;

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(drawProg.p);
  gl.bindTexture(gl.TEXTURE_2D, targets[cur].tex);
  gl.uniform1i(drawProg.u.uState, 0);
  gl.uniform3fv(drawProg.u.uPal, paletteFlat);
  gl.uniform1f(drawProg.u.uRelief, params.relief);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  frames++;
  if (now - lastFpsTime > 500) {
    fps = Math.round(frames * 1000 / (now - lastFpsTime));
    frames = 0; lastFpsTime = now;
    hud.textContent =
      `Gray-Scott · ${params.preset}\n` +
      `f ${params.f.toFixed(4)}  k ${params.k.toFixed(4)}  Da 1.0  Db 0.5\n` +
      `${SIZE}² ${precisionLabel} · ${params.steps} steps/frame · ${fps} fps`;
  }
  requestAnimationFrame(frame);
}

loadFromUrl();
requestAnimationFrame(frame);
</script>
</body>
</html>
