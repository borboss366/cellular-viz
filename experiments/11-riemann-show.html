<!--
  11 · Riemann, the show   (Millennium track #37, 09 take two; spec: #37 comment 6389364446)

  09 stays as the calm, flat phase portrait. This page is the show: five scenes on the
  beat, switching every `bars` bars with a one-bar fade (or pinned with ?scene=).
  The art is in camera, light and timing; the maths underneath is exact.

  Shared clock: the camera height t_cam is warped so the k-th non-trivial zero lands on
  the k-th downbeat (linear in between), so every scene hits a zero on every "one".

    ribbon  ζ(½+it) as a glowing 3-D tube: x = Re ζ, y = Im ζ, z = t. A chase camera
            rides along it; the bass shakes and rolls it. The tube crosses the centre
            axis exactly at the zeros: shockwave ring, flash and label there.
    march   the zeros as runway lights marching up the critical line, one per beat;
            their real, uneven gaps are the groove (they repel like eigenvalues).
    scope   Hardy's Z(t) (real, with sign changes exactly at the zeros) as an
            oscilloscope trace, sparking at each crossing, over the metronome's own
            waveform from an AnalyserNode.
    primes  Riemann's explicit formula: π(x) ≈ Σ μ(n)/n·Π₀(x^(1/n)),
            Π₀(y) ≈ li(y) − Σ_ρ li(y^ρ) − log 2. One zero is added per beat during the
            build-up, the curve sharpens into the prime staircase, and at the drop the
            exact steps light up at 2, 3, 5, 7, 11, …
    canyon  terrain height = log|ζ(σ+it)|, so the zeros are bottomless glowing pits on
            the line σ = ½. A drone flies down the valley; the colours are 09's phases.
    map     09's flat phase portrait, gliding with the same camera (the calm one).

  Maths: ζ(½+it) and Z(t) = e^(iθ(t)) ζ(½+it) on the CPU in double precision (Borwein's
  η with 160 terms, θ from a complex log Γ), sampled every 0.02 for 0 ≤ t ≤ 120; zeros
  by bisection on Z. The map and the canyon's height texture use the GPU version
  (128 terms, functional equation in logs). li(y^ρ) by the asymptotic series of Ei.
  window.__qa: zeros, ribbon minima of |ζ| from the drawn samples, scope crossings from
  the drawn samples, the prime steps, approxPi(x, K).
-->

<script>
'use strict';

const query = new URLSearchParams(location.search);
const SCENES = ['ribbon', 'march', 'scope', 'primes', 'canyon', 'map'];
const params = { scene: 'auto', bars: 8, bpm: 120, bpb: 4, muted: false,
                 kick: 'x...x...x...x...', snare: '....x.......x...', hat: 'x.x.x.x.x.x.x.x.' };

// =====================================================================================
// Maths on the CPU (double precision)
// =====================================================================================
const T_MAX = 120, DT = 0.02, NS = Math.round(T_MAX / DT) + 1;
const LN2 = Math.log(2), SQRT2 = Math.SQRT2;

function borweinCoeffs(n) {   // c_k = (d_k − d_n)/d_n
  const d = new Float64Array(n + 1);
  let term = 1 / n, sum = term;
  d[0] = n * sum;
  for (let i = 1; i <= n; i++) {
    term *= 4 * (n + i - 1) * (n - i + 1) / ((2 * i) * (2 * i - 1));
    sum += term; d[i] = n * sum;
  }
  const c = new Float64Array(n);
  for (let k = 0; k < n; k++) c[k] = (d[k] - d[n]) / d[n];
  return c;
}
const NB_CPU = 160, C_CPU = borweinCoeffs(NB_CPU);
const W_CPU = new Float64Array(NB_CPU), L_CPU = new Float64Array(NB_CPU);
for (let k = 0; k < NB_CPU; k++) {   // sign · c_k · (k+1)^(−½), and log(k+1)
  L_CPU[k] = Math.log(k + 1);
  W_CPU[k] = (k % 2 ? -1 : 1) * C_CPU[k] * Math.exp(-0.5 * L_CPU[k]);
}
// ζ(½ + it) = η / (1 − 2^(½−it)),  η = −Σ (−1)^k c_k (k+1)^(−½) e^(−it log(k+1))
function zetaHalf(t) {
  let er = 0, ei = 0;
  for (let k = 0; k < NB_CPU; k++) { const a = t * L_CPU[k]; er += W_CPU[k] * Math.cos(a); ei -= W_CPU[k] * Math.sin(a); }
  er = -er; ei = -ei;
  const dr = 1 - SQRT2 * Math.cos(t * LN2), di = SQRT2 * Math.sin(t * LN2), q = dr * dr + di * di;
  return [(er * dr + ei * di) / q, (ei * dr - er * di) / q];
}
const LG = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313,
  -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
function lnGamma(zr, zi) {   // Lanczos, Re z ≥ ½
  zr -= 1;
  let xr = LG[0], xi = 0;
  for (let k = 1; k < 9; k++) { const dr = zr + k, q = dr * dr + zi * zi; xr += LG[k] * dr / q; xi -= LG[k] * zi / q; }
  const tr = zr + 7.5, ti = zi;
  const ltr = 0.5 * Math.log(tr * tr + ti * ti), lti = Math.atan2(ti, tr);
  const ar = zr + 0.5, ai = zi;
  return [0.5 * Math.log(2 * Math.PI) + ar * ltr - ai * lti - tr + 0.5 * Math.log(xr * xr + xi * xi),
          ar * lti + ai * ltr - ti + Math.atan2(xi, xr)];
}
// Riemann–Siegel θ(t) = arg Γ(¼ + it/2) − (t/2) log π   (Γ(z) = Γ(z+1)/z keeps Lanczos in range)
function theta(t) {
  return lnGamma(1.25, t / 2)[1] - Math.atan2(t / 2, 0.25) - t / 2 * Math.log(Math.PI);
}
function hardyZ(t) { const z = zetaHalf(t), th = theta(t); return Math.cos(th) * z[0] - Math.sin(th) * z[1]; }

// Samples every DT, and the zeros by bisection on Z.
const S_re = new Float64Array(NS), S_im = new Float64Array(NS), S_Z = new Float64Array(NS);
for (let i = 0; i < NS; i++) {
  const t = i * DT, z = zetaHalf(t), th = theta(t);
  S_re[i] = z[0]; S_im[i] = z[1]; S_Z[i] = Math.cos(th) * z[0] - Math.sin(th) * z[1];
}
const ZEROS = [];
for (let i = 1; i < NS; i++) {
  if (i * DT < 10 || Math.sign(S_Z[i]) === Math.sign(S_Z[i - 1])) continue;
  let lo = (i - 1) * DT, hi = i * DT, flo = S_Z[i - 1];
  for (let k = 0; k < 50; k++) { const m = (lo + hi) / 2, fm = hardyZ(m); if (Math.sign(fm) === Math.sign(flo)) { lo = m; flo = fm; } else hi = m; }
  ZEROS.push((lo + hi) / 2);
}
const sampleAt = (arr, t) => {   // linear interpolation in the samples
  const f = Math.max(0, Math.min(NS - 1.001, t / DT)), i = Math.floor(f), u = f - i;
  return arr[i] * (1 - u) + arr[i + 1] * u;
};

// Explicit formula: Π₀(y) ≈ li(y) − Σ_k 2·Re li(y^ρ_k) − log 2,  π(x) = Σ μ(n)/n Π₀(x^(1/n)).
const EULER = 0.5772156649015329;
function li(y) {   // real li(y) = Ei(log y), series
  const u = Math.log(y);
  let s = EULER + Math.log(Math.abs(u)), term = 1;
  for (let k = 1; k < 80; k++) { term *= u / k; s += term / k; if (Math.abs(term / k) < 1e-17) break; }
  return s;
}
// 2·Re Ei(z), z = (½ + iγ)u, by the asymptotic series e^z/z Σ m!/z^m (the iπ branch term is
// imaginary and cancels with the conjugate zero).
function twoReLiRho(gamma, u) {
  const zr = 0.5 * u, zi = gamma * u, m2 = zr * zr + zi * zi, M = Math.min(30, Math.floor(Math.sqrt(m2)));
  let sr = 1, si = 0, tr = 1, ti = 0;
  for (let m = 1; m <= M; m++) {   // term *= m / z
    const nr = (tr * zr + ti * zi) * m / m2, ni = (ti * zr - tr * zi) * m / m2;
    tr = nr; ti = ni; sr += tr; si += ti;
  }
  const e = Math.exp(zr), er = e * Math.cos(zi), ei = e * Math.sin(zi);
  const qr = (er * zr + ei * zi) / m2, qi = (ei * zr - er * zi) / m2;   // e^z / z
  return 2 * (qr * sr - qi * si);
}
function Pi0(y, K) {
  if (y < 2) return 0;
  const u = Math.log(y);
  let s = li(y) - LN2;
  for (let k = 0; k < K && k < ZEROS.length; k++) s -= twoReLiRho(ZEROS[k], u);
  return s;
}
const MOBIUS = [0, 1, -1, -1, 0, -1, 1, -1, 0, 0, 1];
function approxPi(x, K) {
  let s = 0;
  for (let n = 1; n <= 10; n++) { if (!MOBIUS[n]) continue; const y = Math.pow(x, 1 / n); if (y < 2) break; s += MOBIUS[n] / n * Pi0(y, K); }
  return s;
}
const PRIMES = []; for (let n = 2; n <= 100; n++) if (PRIMES.every(p => n % p)) PRIMES.push(n);
const piExact = x => PRIMES.filter(p => p <= x).length;

// =====================================================================================
// Metronome (as 04) with an analyser for the scope's waveform
// =====================================================================================
const TAU = { kick: 0.150, snare: 0.120, hat: 0.040 };
const LANES = ['kick', 'snare', 'hat'];
const metronome = {
  ctx: null, master: null, bus: null, analyser: null, noise: null, timer: 0, playing: false,
  nextTime: 0, step: 0, hits: [], steps: [], wave: new Float32Array(2048),
  start() {
    if (!this.ctx) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.ctx = ctx;
      this.bus = ctx.createGain(); this.master = ctx.createGain(); this.analyser = ctx.createAnalyser();
      this.analyser.fftSize = 2048;
      this.bus.connect(this.master); this.bus.connect(this.analyser); this.master.connect(ctx.destination);
      this.noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = this.noise.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    this.ctx.resume();
    this.master.gain.value = params.muted ? 0 : 0.35;
    this.nextTime = this.ctx.currentTime + 0.05; this.step = 0; this.hits = []; this.steps = [];
    this.playing = true;
    this.timer = setInterval(() => this.schedule(), 25);
    this.schedule();
  },
  stop() { clearInterval(this.timer); this.playing = false; },
  setMuted(m) { if (this.master) this.master.gain.value = m ? 0 : 0.35; },
  schedule() {
    while (this.nextTime < this.ctx.currentTime + 0.1) {
      this.queueStep(this.step, this.nextTime);
      this.nextTime += 60 / params.bpm / 4; this.step++;
    }
    const old = this.ctx.currentTime - 1;
    this.hits = this.hits.filter(h => h.time > old);
    while (this.steps.length > 2 && this.steps[1].time < old) this.steps.shift();
  },
  queueStep(step, time) {
    const inBar = step % (params.bpb * 4);
    this.steps.push({ time, step });
    for (const lane of LANES) {
      if (params[lane][inBar % 16] !== 'x') continue;
      const vel = inBar === 0 ? 1.0 : 0.7;
      this.hits.push({ lane, time, vel });
      this.click(lane, time, vel);
    }
  },
  click(lane, t, vel) {
    const ctx = this.ctx, g = ctx.createGain();
    g.connect(this.bus);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vel, t + 0.003);
    let src;
    if (lane === 'kick') {
      src = ctx.createOscillator();
      src.frequency.setValueAtTime(150, t); src.frequency.exponentialRampToValueAtTime(60, t + 0.08);
      src.connect(g);
    } else {
      src = ctx.createBufferSource(); src.buffer = this.noise;
      const f = ctx.createBiquadFilter();
      f.type = lane === 'snare' ? 'bandpass' : 'highpass';
      f.frequency.value = lane === 'snare' ? 1800 : 8000;
      src.connect(f); f.connect(g);
    }
    const end = t + TAU[lane] * 4;
    g.gain.exponentialRampToValueAtTime(0.001, end);
    src.start(t); src.stop(end + 0.01);
  },
  read() {
    const out = { kick: 0, snare: 0, hat: 0, bars: -1 };
    if (!this.ctx) return out;
    const now = this.ctx.currentTime - Math.min(0.3, this.ctx.outputLatency || this.ctx.baseLatency || 0);
    for (const h of this.hits) {
      const dt = now - h.time;
      if (dt >= 0) out[h.lane] = Math.max(out[h.lane], h.vel * (1 - Math.exp(-dt / 0.005)) * Math.exp(-dt / TAU[h.lane]));
    }
    let last = null;
    for (const s of this.steps) if (s.time <= now) last = s;
    if (last) {
      const sixteenth = 60 / params.bpm / 4, frac = Math.min(1, (now - last.time) / sixteenth);
      out.bars = (last.step + frac) / (params.bpb * 4);
    }
    if (this.analyser) this.analyser.getFloatTimeDomainData(this.wave);
    return out;
  },
};

// The warped clock: the k-th zero on the k-th downbeat.
const LOOP_ZEROS = 30;
function tAtBars(bars) {
  const n = Math.min(LOOP_ZEROS, ZEROS.length - 1);
  const b = ((bars % n) + n) % n, k = Math.floor(b), u = b - k;
  return ZEROS[k] + u * (ZEROS[k + 1] - ZEROS[k]);
}

// =====================================================================================
// WebGL
// =====================================================================================
const canvas = document.getElementById('c');
const hud = document.getElementById('hud');
const gl = canvas.getContext('webgl2', { antialias: true, alpha: false });
if (!gl) fail('WebGL2 is not available in this browser.');
function fail(msg) { hud.textContent = msg; throw new Error(msg); }
const hasFloatRT = !!(gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float'));

function compile(type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src); gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) fail('Shader error:\n' + gl.getShaderInfoLog(sh));
  return sh;
}
function program(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) fail('Link error:\n' + gl.getProgramInfoLog(p));
  const u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const nm = gl.getActiveUniform(p, i).name.replace('[0]', ''); u[nm] = gl.getUniformLocation(p, nm); }
  return { p, u };
}
const FULL_VS = `#version 300 es
out vec2 vUv;
void main() {
  vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  vUv = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

// ---- GPU zeta (as 09, 128 terms) ----
const NB_GPU = 128;
const ZETA_GLSL = `
const float PI = 3.14159265, LN2 = 0.69314718, LNPI = 1.14472989;
uniform float uC[${NB_GPU}];
vec2 cmul(vec2 a, vec2 b) { return vec2(a.x * b.x - a.y * b.y, a.x * b.y + a.y * b.x); }
vec2 cdiv(vec2 a, vec2 b) { return vec2(a.x * b.x + a.y * b.y, a.y * b.x - a.x * b.y) / dot(b, b); }
vec2 cexp(vec2 z) { return exp(z.x) * vec2(cos(z.y), sin(z.y)); }
vec2 clog(vec2 z) { float m = max(abs(z.x), abs(z.y)); vec2 u = z / max(m, 1e-30); return vec2(log(m) + 0.5 * log(dot(u, u)), atan(z.y, z.x)); }
vec2 csin(vec2 z) { return vec2(sin(z.x) * cosh(z.y), cos(z.x) * sinh(z.y)); }
vec2 clogsin(vec2 z) {
  if (abs(z.y) <= 1.0) return clog(csin(z));
  float sg = sign(z.y); vec2 w = vec2(z.x, abs(z.y));
  vec2 e2 = cexp(vec2(-2.0 * w.y, 2.0 * w.x));
  vec2 r = vec2(w.y - 0.69314718, 1.57079633 - w.x) + clog(vec2(1.0, 0.0) - e2);
  return vec2(r.x, sg * r.y);
}
vec2 eta(vec2 s) {
  vec2 acc = vec2(0.0);
  for (int k = 0; k < ${NB_GPU}; k++) acc += (k % 2 == 0 ? 1.0 : -1.0) * uC[k] * cexp(-s * log(float(k + 1)));
  return -acc;
}
vec2 logZetaRight(vec2 s) { return clog(cdiv(eta(s), vec2(1.0, 0.0) - cexp((vec2(1.0, 0.0) - s) * LN2))); }
vec2 logGamma(vec2 z) {
  float c[9] = float[9](0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313,
    -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7);
  z -= vec2(1.0, 0.0);
  vec2 x = vec2(c[0], 0.0);
  for (int i = 1; i < 9; i++) x += cdiv(vec2(c[i], 0.0), z + vec2(float(i), 0.0));
  vec2 t = z + vec2(7.5, 0.0);
  return vec2(0.5 * log(2.0 * PI), 0.0) + cmul(z + vec2(0.5, 0.0), clog(t)) - t + clog(x);
}
vec2 logZeta(vec2 s) {
  if (s.x >= 0.5) return logZetaRight(s);
  vec2 r = vec2(1.0, 0.0) - s;
  return s * LN2 + (s - vec2(1.0, 0.0)) * LNPI + clogsin(s * (PI * 0.5)) + logGamma(r) + logZetaRight(r);
}
vec3 hsv(float h, float s, float v) {
  vec3 k = clamp(abs(mod(h * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0);
  return v * mix(vec3(1.0), k, s);
}
vec3 phaseColour(vec2 lz, float pad) {
  float band = fract(lz.x / LN2);
  float ray = abs(fract(lz.y / (2.0 * PI) * 12.0 + 0.5) - 0.5);
  float v = (0.55 + 0.4 * pow(band, 0.6)) * (1.0 - 0.18 * smoothstep(0.06, 0.0, ray));
  return hsv(lz.y / (2.0 * PI) + pad * 0.25, 0.8, v);
}`;
const C_GPU = new Float32Array(borweinCoeffs(NB_GPU));

// ---- map scene ----
const mapProg = program(FULL_VS, `#version 300 es
precision highp float;
${ZETA_GLSL}
uniform vec2 uCenter, uHalf;
uniform float uKick, uPad;
in vec2 vUv;
out vec4 o;
void main() {
  vec2 s = uCenter + (vUv * 2.0 - 1.0) * uHalf;
  vec3 col = phaseColour(logZeta(s), uPad) * (1.0 + 0.25 * uKick);
  o = vec4(col, 1.0);
}`);

// ---- canyon: log ζ baked into a texture once, then ray-marched ----
const LZ_W = 256, LZ_H = 2048, LZ_S0 = -1.5, LZ_S1 = 2.5;   // σ range; t: 0..T_MAX
const bakeProg = program(FULL_VS, `#version 300 es
precision highp float;
${ZETA_GLSL}
in vec2 vUv;
out vec4 o;
void main() {
  vec2 s = vec2(mix(${LZ_S0.toFixed(2)}, ${LZ_S1.toFixed(2)}, vUv.x), vUv.y * ${T_MAX.toFixed(1)});
  vec2 lz = logZeta(s);
  o = vec4(clamp(lz.x, -12.0, 12.0), lz.y, 0.0, 1.0);
}`);

    c.beginPath(); c.moveTo(W / 2 + side * sw(-0.8), sy(-0.8)); c.lineTo(W / 2 + side * sw(80), sy(80)); c.stroke();
  }
  for (let t = Math.ceil(tc - 0.8); t < tc + 60; t++) {
    const d = t - tc, a = Math.max(0, 0.25 - d / 240);
    c.strokeStyle = `rgba(120, 140, 220, ${a})`;
    c.beginPath(); c.moveTo(W / 2 - sw(d), sy(d)); c.lineTo(W / 2 + sw(d), sy(d)); c.stroke();
  }
  c.strokeStyle = 'rgba(255, 255, 255, 0.25)';   // the critical line
  c.beginPath(); c.moveTo(W / 2, sy(-0.8)); c.lineTo(W / 2, hz); c.stroke();
  // beads
  const lz = lastZero(bars);
  c.textAlign = 'left';
  for (let i = ZEROS.length - 1; i >= 0; i--) {
    const d = ZEROS[i] - tc;
    if (d < -0.8 || d > 70) continue;
    const y = sy(d), r = (W / 30) / (1 + Math.max(0, d) * k) * (1 + 0.5 * L.kick * (i === lz.k ? 1 : 0.3));
    const passed = i === lz.k && lz.beatsSince < 2;
    const a = Math.min(1, 1.2 - d / 70);
    const grd = c.createRadialGradient(W / 2, y, 0, W / 2, y, r * (passed ? 4 : 2.5));
    grd.addColorStop(0, `rgba(255, 245, 220, ${a})`);
    grd.addColorStop(0.3, `rgba(255, 170, 80, ${a * 0.8})`);
    grd.addColorStop(1, 'rgba(255, 120, 40, 0)');
    c.fillStyle = grd;
    c.beginPath(); c.arc(W / 2, y, r * (passed ? 4 : 2.5), 0, 7); c.fill();
    if (d < 30) {
      c.fillStyle = `rgba(255, 236, 200, ${a * 0.9})`;
      c.font = FONT(Math.max(10, r * 0.9));
      c.fillText(zeroLabel(ZEROS[i]), W / 2 + r * 2.8, y + r * 0.3);
    }
  }
  return false;
}

const scopeCrossings = [];
function sceneScope(slot, S) {
  const { W, H, tc, L, bars } = S, c = slot.ctx;
  c.fillStyle = '#020407'; c.fillRect(0, 0, W, H);
  const t0 = tc - 9, t1 = tc + 3, X = t => (t - t0) / (t1 - t0) * W;
  const midY = H * 0.42, amp = H * 0.11;
  c.strokeStyle = 'rgba(80, 255, 200, 0.12)'; c.lineWidth = 1;   // graticule
  for (let i = 0; i <= 10; i++) { c.beginPath(); c.moveTo(i * W / 10, 0); c.lineTo(i * W / 10, H); c.stroke(); }
  for (let i = 0; i <= 8; i++) { c.beginPath(); c.moveTo(0, i * H / 8); c.lineTo(W, i * H / 8); c.stroke(); }
  c.strokeStyle = 'rgba(255, 255, 255, 0.3)';
  c.beginPath(); c.moveTo(0, midY); c.lineTo(W, midY); c.stroke();
  // Z(t), three passes for glow
  const N = Math.min(2000, W);
  for (const [lw, a] of [[W / 160, 0.08], [W / 400, 0.25], [Math.max(1.5, W / 1200), 1]]) {
    c.strokeStyle = `rgba(110, 255, 210, ${a})`; c.lineWidth = lw;
    c.beginPath();
    for (let i = 0; i <= N; i++) {
      const t = t0 + (t1 - t0) * i / N, z = sampleAt(S_Z, Math.max(0, t));
      const y = midY - Math.tanh(z / 2.5) * 2.5 * amp;
      if (i === 0) c.moveTo(X(t), y); else c.lineTo(X(t), y);
    }
    c.stroke();
  }
  // crossings in view: tick, label, sparks just after the playhead passes
  c.textAlign = 'center'; c.font = FONT(H / 45);
  for (const z of ZEROS) {
    if (z < t0 || z > t1) continue;
    const x = X(z), past = tc - z;
    c.strokeStyle = 'rgba(255, 220, 160, 0.6)';
    c.beginPath(); c.moveTo(x, midY - H * 0.03); c.lineTo(x, midY + H * 0.03); c.stroke();
    c.fillStyle = 'rgba(255, 230, 190, 0.85)';
    c.fillText(zeroLabel(z), x, midY + H * 0.07);
    if (past >= 0 && past < 1.2) {
      const a = 1 - past / 1.2, n = 18;
      c.strokeStyle = `rgba(255, 240, 200, ${a})`; c.lineWidth = Math.max(1, W / 900);
      for (let i = 0; i < n; i++) {
        const ang = i / n * Math.PI * 2, r0 = H * 0.01, r1 = H * (0.03 + 0.12 * past) * (1 + L.kick);
        c.beginPath(); c.moveTo(x + Math.cos(ang) * r0, midY + Math.sin(ang) * r0);
        c.lineTo(x + Math.cos(ang) * r1, midY + Math.sin(ang) * r1); c.stroke();
      }
    }
  }
  c.strokeStyle = 'rgba(255, 255, 255, 0.5)';   // playhead
  c.beginPath(); c.moveTo(X(tc), 0); c.lineTo(X(tc), H); c.stroke();
  // the metronome's own waveform underneath
  const wv = metronome.wave, wy = H * 0.8, wa = H * 0.12;
  c.strokeStyle = 'rgba(255, 90, 200, 0.7)'; c.lineWidth = Math.max(1, W / 1000);
  c.beginPath();
  for (let i = 0; i < wv.length; i += 2) { const x = i / wv.length * W, y = wy - wv[i] * wa * 3; if (i === 0) c.moveTo(x, y); else c.lineTo(x, y); }
  c.stroke();
  c.fillStyle = 'rgba(110, 255, 210, 0.8)'; c.textAlign = 'left'; c.font = FONT(H / 40);
  c.fillText('Z(t)', W * 0.02, H * 0.06);
  c.fillStyle = 'rgba(255, 90, 200, 0.8)';
  c.fillText('the beat', W * 0.02, H * 0.66);
  return false;
}

const primesCache = { K: null, pts: null, x1: 60 };
function scenePrimes(slot, S) {
  const { W, H, L, bars, sectionBars } = S, c = slot.ctx;
  const beatsIn = sectionBars * params.bpb, buildBeats = Math.max(4, (params.bars - 2) * params.bpb);
  const Kmax = Math.min(30, ZEROS.length);
  const drop = beatsIn >= buildBeats;
  const K = drop ? Kmax : Math.max(0, Math.min(Kmax, Math.floor(beatsIn * Kmax / buildBeats)));
  const x0 = 1.5, x1 = primesCache.x1, yMax = piExact(x1) + 1.5;
  if (primesCache.K !== K) {
    const n = 900, pts = new Float32Array(n * 2);
    for (let i = 0; i < n; i++) { const x = x0 + (x1 - x0) * i / (n - 1); pts[i * 2] = x; pts[i * 2 + 1] = approxPi(x, K); }
    primesCache.K = K; primesCache.pts = pts;
  }
  const mx = W * 0.07, my = H * 0.1;
  const X = x => mx + (x - x0) / (x1 - x0) * (W - 2 * mx), Y = y => H - my - y / yMax * (H - 2 * my);
  c.fillStyle = '#04030a'; c.fillRect(0, 0, W, H);
  // the exact staircase: dim during the build, bright at the drop
  const da = drop ? 0.95 : 0.18;
  c.strokeStyle = `rgba(255, 210, 120, ${da})`; c.lineWidth = Math.max(1.5, W / 700) * (drop ? 1.6 : 1);
  c.beginPath(); c.moveTo(X(x0), Y(0));
  let prev = 0;
  for (const p of PRIMES) { if (p > x1) break; c.lineTo(X(p), Y(prev)); c.lineTo(X(p), Y(prev + 1)); prev++; }
  c.lineTo(X(x1), Y(prev)); c.stroke();
  // the approximation with K zeros
  for (const [lw, a] of [[W / 150, 0.1], [W / 450, 0.35], [Math.max(1.5, W / 1100), 1]]) {
    c.strokeStyle = `rgba(120, 200, 255, ${a})`; c.lineWidth = lw;
    c.beginPath();
    const pts = primesCache.pts;
    for (let i = 0; i < pts.length; i += 2) { const x = X(pts[i]), y = Y(Math.max(-1, Math.min(yMax, pts[i + 1]))); if (i === 0) c.moveTo(x, y); else c.lineTo(x, y); }
    c.stroke();
  }
  // primes along the axis, flashing at the drop
  c.textAlign = 'center'; c.font = FONT(H / 42);
  for (const p of PRIMES) {
    if (p > x1) break;
    c.fillStyle = `rgba(255, 220, 150, ${drop ? 0.6 + 0.4 * L.kick : 0.35})`;
    c.fillText(p, X(p), H - my * 0.35);
  }
  c.textAlign = 'left';
  c.fillStyle = 'rgba(200, 225, 255, 0.9)'; c.font = FONT(H / 14, 700);
  c.fillText(drop ? 'π(x)' : `${K} zeros`, mx, my * 1.1);
  return false;
}

function sceneCanyon(slot, S) {
  const { W, H, tc, L, bars, flash } = S;
  bakeCanyon();
  gl.bindFramebuffer(gl.FRAMEBUFFER, slot.fbo);
  gl.viewport(0, 0, W, H);
  if (!lzTex) { gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT); return false; }
  const sway = 0.5 * Math.sin(bars * 0.4);
  const eye = [sway + 0.04 * L.kick * (Math.random() - 0.5), 3.2 + 0.25 * L.kick, (tc - 5) * 1.0];
  const at = [0, -1.2, (tc + 4) * 1.0];
  // Screen right = +x (larger σ), as in the flat map: right = up×fwd, up = fwd×right.
  const fwd = norm3(sub3(at, eye)), roll = 0.08 * Math.sin(bars * Math.PI) * (0.3 + L.kick);
  const right = norm3(cross3([Math.sin(roll), Math.cos(roll), 0], fwd)), up = cross3(fwd, right);
  gl.useProgram(canyonProg.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, lzTex);
  gl.uniform1i(canyonProg.u.uLZ, 0);
  gl.uniform3fv(canyonProg.u.uEye, eye);
  gl.uniform3fv(canyonProg.u.uFwd, fwd);
  gl.uniform3fv(canyonProg.u.uRight, right);
  gl.uniform3fv(canyonProg.u.uUp, up);
  gl.uniform1f(canyonProg.u.uAspect, W / H);
  gl.uniform1f(canyonProg.u.uKick, L.kick);
  gl.uniform1f(canyonProg.u.uPad, S.pad);
  gl.uniform1f(canyonProg.u.uFlash, flash);
  gl.uniform1f(canyonProg.u.uSnare, L.snare);
  gl.uniform1f(canyonProg.u.uHat, L.hat);
  gl.uniform1f(canyonProg.u.uBeats, bars * params.bpb);
  const near = ZEROS.filter(z => z > tc - 8).slice(0, 8);   // pits behind and ahead
  while (near.length < 8) near.push(-1000);
  gl.uniform1fv(canyonProg.u.uZ, near);
  gl.bindVertexArray(emptyVao);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  // labels on the zeros ahead
  const c = slot.ctx;
  c.clearRect(0, 0, W, H);
  c.font = FONT(H / 40); c.textAlign = 'center';
  // the same projection as the ray-marcher: rd = 1.6·fwd + q.x·right + q.y·up
  for (const z of ZEROS) {
    const dz = z - tc;
    if (dz < -3 || dz > 30) continue;
    const v = sub3([0, -1.8, z], eye), cz = dot3(v, fwd);
    if (cz <= 0.1) continue;
    const qx = 1.6 * dot3(v, right) / cz, qy = 1.6 * dot3(v, up) / cz;
    c.fillStyle = `rgba(255, 230, 190, ${Math.max(0, 1 - dz / 30)})`;
    c.fillText(zeroLabel(z), (qx / (W / H) * 0.5 + 0.5) * W, (1 - (qy * 0.5 + 0.5)) * H);
  }
  return true;
}

function sceneMap(slot, S) {
  const { W, H, tc, L } = S;
  gl.bindFramebuffer(gl.FRAMEBUFFER, slot.fbo);
  gl.viewport(0, 0, W, H);
  gl.useProgram(mapProg.p);
  const hx = 3.5 * (1 - 0.04 * L.kick);
  gl.uniform2f(mapProg.u.uCenter, 0.5, tc);
  gl.uniform2f(mapProg.u.uHalf, hx, hx * H / W);
  gl.uniform1f(mapProg.u.uKick, L.kick);
  gl.uniform1f(mapProg.u.uPad, S.pad);
  gl.bindVertexArray(emptyVao);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  return false;
}
const SCENE_FN = { ribbon: sceneRibbon, march: sceneMarch, scope: sceneScope, primes: scenePrimes, canyon: sceneCanyon, map: sceneMap };
const GL_SCENES = new Set(['ribbon', 'canyon', 'map']);

// Draw one scene into a slot; 2D scenes go up as the slot's texture, GL ones keep their 2D canvas as overlay.
function renderSlot(i, name, S) {
  const slot = slots[i];
  const overlay = SCENE_FN[name](slot, S);
  if (!GL_SCENES.has(name)) upload(slot.tex, slot.cv);
  else if (overlay) upload(slot.ovTex, slot.cv);
  return GL_SCENES.has(name) && overlay;
}

// =====================================================================================
// UI and the main loop
// =====================================================================================
const $ = id => document.getElementById(id);
$('play').onclick = () => {
  if (metronome.playing) metronome.stop(); else metronome.start();
  clockStart = performance.now();
  $('play').textContent = metronome.playing ? '■ Stop' : '▶ Play';
  $('play').classList.toggle('on', metronome.playing);
};
$('mute').onclick = () => { params.muted = !params.muted; metronome.setMuted(params.muted); sync(); };
$('full').onclick = () => {
  const w = $('wrap');
  if (document.fullscreenElement) document.exitFullscreen();
  else (w.requestFullscreen || w.webkitRequestFullscreen).call(w);
};
for (const name of ['auto', ...SCENES]) {
  const b = document.createElement('button');
  b.textContent = name;
  b.onclick = () => { params.scene = name; sync(); };
  $('scenes').appendChild(b);
}
for (const name of ['bars', 'bpm']) {
  $(name).addEventListener('input', e => { params[name] = parseFloat(e.target.value); $(name + 'Out').textContent = params[name]; });
}
function sync() {
  for (const name of ['bars', 'bpm']) { $(name).value = params[name]; $(name + 'Out').textContent = params[name]; }
  $('mute').classList.toggle('on', params.muted);
  for (const b of $('scenes').children) b.classList.toggle('on', b.textContent === params.scene);
}
function setupLink() {
  const q = new URLSearchParams({ scene: params.scene, bars: params.bars, bpm: params.bpm });
  return location.origin + location.pathname + '?' + q;
}
$('copy').onclick = async e => {
  const text = `11 · Riemann show · ${params.scene} · ${params.bpm} bpm · ${params.bars} bars/scene\n${setupLink()}`;
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    ok = document.execCommand('copy'); ta.remove();
  }
  if (!ok) { prompt('Copy this:', text); return; }
  e.target.textContent = 'Copied ✓';
  setTimeout(() => { e.target.textContent = 'Copy setup'; }, 1500);
};

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.min(2560, Math.round(canvas.clientWidth * dpr));
  const h = Math.min(1440, Math.round(canvas.clientHeight * dpr));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  sizeSlots(canvas.width, canvas.height);
}
let clockStart = performance.now(), frames = 0, fps = 0, lastFpsTime = performance.now(), lastHud = 0;
let lastK = -1, flash = 0;
// The next frame is booked first, and a frame that throws is reported and skipped,
// so one bad frame can never stop the show (it froze on frame 1 before: QA box, #40).
const errors = [];
function frame(now) {
  requestAnimationFrame(frame);
  try { draw(now); }
  catch (e) {
    if (errors.length < 20) { errors.push(String(e && e.stack || e)); console.error(e); }
    hud.textContent = `frame error: ${e && e.message}`;
  }
}
function draw(now) {
  resize();
  const L = metronome.read();
  // rAF's timestamp can be a little older than clockStart on the first frame: never negative.
  const bars = Math.max(0, metronome.playing && L.bars >= 0 ? L.bars : (now - clockStart) / 1000 * params.bpm / 60 / params.bpb);
  const tc = tAtBars(bars);
  const lz = lastZero(bars);
  if (lz.k !== lastK) { flash = 1; lastK = lz.k; }   // a zero on the downbeat
  flash = Math.max(0, flash - 0.05);
  const W = canvas.width, H = canvas.height;
  const pad = 0.5 - 0.5 * Math.cos(bars / 4 * Math.PI * 2);

  // which scenes, and the fade between them
  let cur, prev = null, mix = 1, sectionBars;
  if (params.scene === 'auto') {
    const idx = Math.floor(bars / params.bars);
    cur = SCENES[idx % SCENES.length];
    sectionBars = bars - idx * params.bars;
    if (idx > 0 && sectionBars < 1) { prev = SCENES[(idx - 1) % SCENES.length]; mix = sectionBars; }
  } else {
    cur = params.scene;
    sectionBars = bars % params.bars;
  }
  const S = { W, H, tc, L, bars, flash, pad, sectionBars };
  const hasB = renderSlot(1, cur, S);
  const hasA = prev ? renderSlot(0, prev, { ...S, sectionBars: params.bars - 1 + sectionBars }) : false;

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.useProgram(compProg.p);
  const bind = (unit, tex, name) => { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex); gl.uniform1i(compProg.u[name], unit); };
  bind(0, slots[0].tex, 'uA'); bind(1, slots[1].tex, 'uB'); bind(2, slots[0].ovTex, 'uOA'); bind(3, slots[1].ovTex, 'uOB');
  gl.uniform1f(compProg.u.uMix, prev ? mix : 1);
  gl.uniform1f(compProg.u.uHasOA, hasA ? 1 : 0);
  gl.uniform1f(compProg.u.uHasOB, hasB ? 1 : 0);
  gl.uniform1f(compProg.u.uFlash, flash * 0.6);
  gl.bindVertexArray(emptyVao);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // Every frame, so a reading taken on a downbeat isn't up to 200 ms stale.
  window.__qa.scene = cur; window.__qa.tCam = tc; window.__qa.bars = bars;
  frames++;
  if (now - lastFpsTime > 500) { fps = Math.round(frames * 1000 / (now - lastFpsTime)); frames = 0; lastFpsTime = now; }
  if (now - lastHud > 200) {
    lastHud = now;
    const state = metronome.playing ? '▶' : (metronome.ctx ? '■' : 'tap ▶ Play');
    hud.textContent = `Riemann show · ${cur}${prev ? ` ← ${prev}` : ''} · ${params.bpm} bpm · ${state}\n` +
      `t ${tc.toFixed(2)} · last zero ${zeroLabel(ZEROS[lz.k])} · ${ZEROS.length} zeros to t=${T_MAX}\n` +
      `${W}×${H} · ${fps} fps`;
  }
}

// QA: everything the checks need, from the same data the scenes draw.
for (let i = 1; i < NS; i++) {
  if (i * DT < 10 || Math.sign(S_Z[i]) === Math.sign(S_Z[i - 1])) continue;
  const t = (i - 1) * DT + DT * S_Z[i - 1] / (S_Z[i - 1] - S_Z[i]);   // linear, as drawn
  scopeCrossings.push(+t.toFixed(4));
}
window.__qa = {
  zeros: ZEROS.map(z => +z.toFixed(6)), ribbonMinima, scopeCrossings,
  primeSteps: PRIMES.filter(p => p <= primesCache.x1), approxPi, piExact, hardyZ, zetaHalf,
  scene: null, tCam: null, bars: null, errors,
};

const q = k => query.get(k);
if (q('scene') && (q('scene') === 'auto' || SCENES.includes(q('scene')))) params.scene = q('scene');
for (const k of ['bars', 'bpm']) { const v = parseFloat(q(k)); if (Number.isFinite(v)) params[k] = v; }
params.muted = q('muted') === '1';
sync();
requestAnimationFrame(frame);
</script>
</body>
