<!--
  25 · Shape Shifter II   (Poincaré, v2 of 23; spec: #56 comment 6414973925. 23 stays as it is.)

  The user liked 23 and asked for more shape changes, faster, and a camera that moves more:
  around the shape and through the holes.

  Shapes. Every shape is one SDF: a genus-0 body (rounded cylinder or box, taper, dimple, cap,
  bar, spikes, top cavity, spout, knob) plus up to three handle slots. Each handle is a ring
  torus or a (2,3) torus-knot tube (the trefoil: homeomorphic to a solid torus, not isotopic to
  one). A handle is anchored on the body: its core loop dips a depth `pen` into the body at one
  spot (the body's surface point along the slot direction d, found by a search on the body
  SDF), so each closed handle ∖ body is one arc fixed at both ends, and it adds exactly one to
  the genus. Keyframes (table below, each with its genus) set the body and slot parameters,
  and morphs interpolate the parameters, so the genus is the number of closed handles.
    genus 0  sphere, egg, bell, mushroom, bottle, rounded cube, spiky blob, teapot, vase, bowl, apple
    genus 1  mug, kettle, bagel, key ring, handbag, racket; trefoil ×3 (knot cycles)
    genus 2  urn, double torus, glasses, amphora, trophy; trefoil + ring ×2
    genus 3  urn with a lid loop, pretzel, triple torus; trefoil + two rings ×2
  Genus walk: phrases of 8 bars go 0 → 1 → … → maxGenus → … → 1 → 0. Every second cycle slot A
  is a trefoil knot instead of a ring. The genus changes only on phrase downbeats, one handle per
  event: surgery (the neck radius ∝ √(T − t), a Ricci-flow neck pinch, reaches 0 on the
  downbeat; then a cut opens and the stubs are absorbed) or attach (stubs grow with the cut open,
  the cut closes on the downbeat, and the neck grows back as √τ).

  Pace. A 32-bar song loop: breakdown (morph every 4 bars), normal (2), build (1), drop (½,
  from bar 24). Each morph eases in and out after a 1-beat hold, so every shape lands exactly on
  a step boundary (a downbeat) and holds for one beat. On each kick the shape squashes and
  stretches (scale 1 → 1 + squash → 1 over ¼ beat), and the surface bumps, with the bump depth
  capped at 0.4 × the local thickness of every thin part.

  Camera. orbit (one turn per `orbitBars`, radius and height on slow noise, banking into turns),
  skim (in builds: hugs the surface at 0.25 from the bump-free SDF) and thread (mid-phrase,
  bars 2–5.5: a Hermite path from the base path through the centre of every closed handle along
  its axis, a slalom when g ≥ 2, then back to the base path). Positions and tangents match at
  both ends, so there are no cuts unless cutOnDrop is on. FOV kicks +8° on the drop. Through a
  ring the camera's path links the core loop once; through the trefoil's centre twice (the
  knot winds twice round its axis). The orbit sits at 1.75× the shape's reach (so the shape fills
  the frame's height); skim shares its azimuth and the two blend round the centre. The look aims
  from the centre toward the path ahead, but never more than a cone off the centre (28°; in a
  thread 0.6× the shape's angular radius + 12°), and it is a Hann-filtered mean of the raw aims
  over ±0.5 bar, so it turns smoothly. Below 55 fps the render scale steps down (?dynres=0: off).

  Everything is a pure function of the bar position. window.__qa:
    sdf(x, y, z [, bars]), genus(n, bars) (cubical complex χ, as 23), totalK(n, bars),
    genusExpected(bars), keyframes [{name, genus}], keyframeAt(bars), handles(bars)
    [{slot, type, c, n, R, r, Rk, closed}], camera(bars) {eye, fwd, up, mode, sdf, fov},
    thread(bars) (the thread window holding bars: per hole the signed crossings of its spanning
    disk (linking), the minimum SDF on the path and the clearance ratio), angSpeed (deg/s, last
    frame), events (kick/snare/hat, land, surgery, attach, thread, drop, cut), errors.
-->

<script>
'use strict';

const query = new URLSearchParams(location.search);
// pace: 'auto' follows the song loop, or a fixed number of morphs per 4 bars (0.5, 1, 2, 4, 8).
// res: 'cap' renders at most 1920×1080 pixels and lets the browser scale up; 'native' renders all.
const params = { pace: 'auto', maxGenus: 3, camMode: 'auto', throughEvery: 8, slalom: true, bank: 8, cutOnDrop: false, squash: 0.04,
                 palette: 'auto', bumpAmp: 0.5, curvColor: 0.7, orbitBars: 4, steps: 96, march: 'sor', bpm: 120, bpb: 4, muted: false, res: 'cap', scale: 1, dynres: true,
                 kick: 'x...x...x...x...', snare: '....x.......x...', hat: 'x.x.x.x.x.x.x.x.' };
const PALETTES = ['ceramic', 'chrome', 'iridescent'];
// #88 GPU gate for ray-march scenes (comment 6491353229): declared render scales, fractions of the full
// device-pixel canvas per axis. Solo plays at soloScale; in a crossfade the host drops it to blendScale.
const PERF = { soloScale: 0.75, blendScale: 0.5 };
let fixedScale = null;   // null: the old cap (≤ 1920×1080) + dynamic resolution; else exactly this fraction a side
function setRenderScale(s) {   // 'solo' | 'blend' | a number 0.25–1 | null (back to cap + dynres); returns the scale in force
  const v = s === 'solo' ? PERF.soloScale : s === 'blend' ? PERF.blendScale : s === null ? NaN : parseFloat(s);
  fixedScale = Number.isFinite(v) ? Math.max(0.25, Math.min(1, v)) : null;
  return fixedScale;
}
const PACES = [0.5, 1, 2, 4, 8];
const THICK = 0.12, SPR = 0.09;
const SONG = [{ name: 'breakdown', from: 0, to: 8, P: 4 }, { name: 'normal', from: 8, to: 16, P: 2 },
              { name: 'build', from: 16, to: 24, P: 1 }, { name: 'drop', from: 24, to: 32, P: 0.5 }];
const DROP_BAR = 24;
const TW0 = 2, TW1 = 5.5;   // the fly-through window, in bars of the phrase

// ---------- keyframes ----------
// body: ra, rb, h (rounded cylinder: radius ra + rb, half height h + rb), taper (radius × (1 + taper·y)),
// dimple (apple top), cav (top cavity 0…1), spout, knob (grow out 0…1), box (0 cylinder … 1 rounded box),
// spike (harmonic bumps), capR, capY (mushroom cap ellipsoid), barL, barR (horizontal capsule along x).
// slot: d (direction of the anchor from the body centre), n (ring axis, made ⊥ d), R (core radius),
// r (tube), pen (how deep the core loop dips into the body), Rk (knot: the tube circle's radius).
const BODY_KEYS = ['ra', 'rb', 'h', 'taper', 'dimple', 'cav', 'spout', 'knob', 'box', 'spike', 'capR', 'capY', 'barL', 'barR'];
const BODY0 = { ra: 0, rb: 0.5, h: 0, taper: 0, dimple: 0, cav: 0, spout: 0, knob: 0, box: 0, spike: 0, capR: 0, capY: 0, barL: 0, barR: 0.05 };
const body = o => ({ ...BODY0, ...o });
const ring = (d, n, R, r, pen) => ({ d, n, R, r, pen, Rk: 0 });
const knot = (R, Rk, r, pen) => ({ d: [0, 1, 0], n: [0, 0, 1], R, r, pen, Rk });
const X = [1, 0, 0], NX = [-1, 0, 0], Y = [0, 1, 0], Z = [0, 0, 1];
// parked slots (a slot a keyframe doesn't use): where its stubs grow before an attach and shrink
// after a surgery. Per variant: 0 = rings, 1 = slot A is a trefoil sitting on top.
const PARK = [
  [ring(X, Z, 0.27, 0.085, 0.06), ring(NX, Z, 0.27, 0.085, 0.06), ring(Y, Z, 0.22, 0.07, 0.08)],
  [knot(0.36, 0.15, 0.07, 0.05), ring([1, -1.3, 0], Z, 0.22, 0.065, 0.08), ring([-1, -1.3, 0], Z, 0.22, 0.065, 0.08)],
];
// Rule learned from QA (#57 check 2026-10-26-1316): within a genus, rings keep their axis (all n = z
// for rings next to other rings or a cavity), so a morph only slides and resizes them; a ring that
// turns while morphing can cross another ring, or dip into a cup through its rim, and add a hole.
const B = {
  sphere: body({ rb: 0.5 }), ball: body({ rb: 0.42 }), bead: body({ rb: 0.16 }),
  egg: body({ rb: 0.4, h: 0.16, taper: -0.3 }),
  bell: body({ ra: 0.26, rb: 0.1, h: 0.28, taper: -0.6, knob: 0.7 }),
  mushroom: body({ ra: 0.07, rb: 0.07, h: 0.22, capR: 0.48, capY: 0.24 }),
  bottle: body({ ra: 0.17, rb: 0.09, h: 0.48, taper: -0.62, cav: 0.9 }),
  cube: body({ ra: 0.3, rb: 0.1, h: 0.3, box: 1 }),
  spiky: body({ rb: 0.48, spike: 0.06 }),
  teapot: body({ ra: 0.05, rb: 0.47, h: 0.06, taper: 0.12, spout: 1, knob: 1 }),
  vase: body({ ra: 0.16, rb: 0.12, h: 0.46, taper: -0.55, cav: 0.85 }),
  bowl: body({ ra: 0.42, rb: 0.08, h: 0.2, taper: 0.5, cav: 0.97 }),
  apple: body({ rb: 0.5, dimple: 1 }),
  mug: body({ ra: 0.4, rb: 0.06, h: 0.38, cav: 0.95 }),
  small: body({ rb: 0.1 }),
  key: body({ rb: 0.07, barL: 0.22, barR: 0.05 }),
  bag: body({ ra: 0.3, rb: 0.08, h: 0.24, box: 1 }),
  stick: body({ ra: 0, rb: 0.05, h: 0.35 }),
  urn: body({ ra: 0.12, rb: 0.36, h: 0.12, taper: -0.15 }),
  core: body({ rb: 0.2 }),
  bridge: body({ rb: 0.06, barL: 0.16, barR: 0.045 }),
  cup: body({ ra: 0.36, rb: 0.07, h: 0.26, taper: 0.35 }),
  jar: body({ ra: 0.16, rb: 0.12, h: 0.46, taper: -0.55 }),
  knotCore: body({ rb: 0.26 }),
  core3: body({ rb: 0.34 }),
  ball3: body({ rb: 0.3 }),
};
const dir = (deg, plane) => { const a = deg * Math.PI / 180; return plane === 'xz' ? [Math.cos(a), 0, Math.sin(a)] : [Math.cos(a), Math.sin(a), 0]; };
// [name, genus, variant, body, slots]; the first of each (genus, variant) list is its gate: the shape
// that is on screen at every phrase downbeat, where the handles are cut or attached.
const KEYS = [
  ['sphere', 0, 0, B.sphere], ['egg', 0, 0, B.egg], ['bell', 0, 0, B.bell],
  ['mushroom', 0, 0, B.mushroom, [ring([1, -0.9, 0], Z, 0.2, 0.07, 0.08)]],
  ['bottle', 0, 0, B.bottle], ['rounded cube', 0, 0, B.cube], ['spiky blob', 0, 0, B.spiky], ['teapot', 0, 0, B.teapot],
  ['vase', 0, 0, B.vase], ['bowl', 0, 0, B.bowl], ['apple', 0, 0, B.apple],
  ['mug', 1, 0, B.mug, [ring(X, Z, 0.27, 0.085, 0.04)]],
  ['kettle', 1, 0, B.teapot, [ring([1, 0.15, 0], Z, 0.3, 0.09, 0.12), ring([0, 0, -1], NX, 0.25, 0.08, 0.1)]],
  ['bagel', 1, 0, B.small, [ring(X, Z, 0.42, 0.24, 0.1)]],
  ['key ring', 1, 0, B.key, [ring(X, Z, 0.36, 0.05, 0.05)]],
  ['handbag', 1, 0, B.bag, [ring(Y, Z, 0.3, 0.045, 0.06)]],
  ['racket', 1, 0, B.stick, [ring(Y, Z, 0.42, 0.06, 0.06), ring([-1, -0.8, 0], Z, 0.2, 0.07, 0.05)]],
  ['urn', 2, 0, B.urn, [ring(X, Z, 0.25, 0.08, 0.12), ring(NX, Z, 0.25, 0.08, 0.12)]],
  ['double torus', 2, 0, B.core, [ring(X, Z, 0.42, 0.15, 0.2), ring(NX, Z, 0.42, 0.15, 0.2), ring(Z, X, 0.22, 0.07, 0.08)]],
  ['glasses', 2, 0, B.bridge, [ring(X, Z, 0.3, 0.04, 0.04), ring(NX, Z, 0.3, 0.04, 0.04), ring(Y, Z, 0.08, 0.035, 0.03)]],
  ['amphora', 2, 0, B.jar, [ring([1, 0.35, 0], Z, 0.24, 0.06, 0.1), ring([-1, 0.35, 0], Z, 0.24, 0.06, 0.1)]],
  ['trophy', 2, 0, B.cup, [ring([1, 0.2, 0], Z, 0.3, 0.06, 0.12), ring([-1, 0.2, 0], Z, 0.3, 0.06, 0.12)]],
  ['urn with lid loop', 3, 0, B.urn, [ring(X, Z, 0.25, 0.08, 0.12), ring(NX, Z, 0.25, 0.08, 0.12), ring(Y, Z, 0.22, 0.07, 0.08)]],
  ['pretzel', 3, 0, B.knotCore, [ring(dir(-30), Z, 0.3, 0.07, 0.06), ring(dir(210), Z, 0.3, 0.07, 0.06), ring(Y, Z, 0.3, 0.07, 0.06)]],
  ['triple torus', 3, 0, B.core3, [ring(dir(-30), Z, 0.28, 0.11, 0.08), ring(dir(210), Z, 0.28, 0.11, 0.08), ring(Y, Z, 0.28, 0.11, 0.08)]],
  ['ball', 0, 1, B.ball], ['egg ', 0, 1, B.egg], ['teapot ', 0, 1, B.teapot],
  ['trefoil', 1, 1, B.bead, [knot(0.4, 0.17, 0.095, 0.05)]],
  ['trefoil on an egg', 1, 1, B.egg, [knot(0.34, 0.14, 0.068, 0.05)]],
  ['big trefoil', 1, 1, B.bead, [knot(0.5, 0.2, 0.11, 0.05)]],
  ['trefoil + ring', 2, 1, B.ball3, [knot(0.36, 0.15, 0.08, 0.05), ring([1, -0.7, 0], Z, 0.24, 0.07, 0.08)]],
  ['trefoil + ring on an egg', 2, 1, B.egg, [knot(0.32, 0.13, 0.065, 0.05), ring([1, -0.5, 0], Z, 0.22, 0.065, 0.08)]],
  ['trefoil + two rings', 3, 1, B.ball3, [knot(0.36, 0.15, 0.08, 0.05), ring([1, -0.7, 0], Z, 0.24, 0.07, 0.08), ring([-1, -0.7, 0], Z, 0.24, 0.07, 0.08)]],
  ['trefoil + two rings on an egg', 3, 1, B.egg, [knot(0.32, 0.13, 0.065, 0.05), ring([1, -0.5, 0], Z, 0.22, 0.065, 0.08), ring([-1, -0.5, 0], Z, 0.22, 0.065, 0.08)]],
];
const KF = {}, LISTS = [[[], [], [], []], [[], [], [], []]];
for (const [name, genus, variant, b, slots] of KEYS) { KF[name] = { name, genus, variant, body: b, slots: slots || [] }; LISTS[variant][genus].push(name); }

// ---------- metronome (as 19) ----------
const TAU = { kick: 0.150, snare: 0.120, hat: 0.040 };
const LANES = ['kick', 'snare', 'hat'];
const metronome = {
  ctx: null, master: null, noise: null, timer: 0, playing: false, nextTime: 0, step: 0, hits: [], steps: [],
  start() {
    if (!this.ctx) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.ctx = ctx; this.master = ctx.createGain(); this.master.connect(ctx.destination);
      this.noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = this.noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    this.ctx.resume(); this.master.gain.value = params.muted ? 0 : 0.35;
    this.nextTime = this.ctx.currentTime + 0.05; this.step = 0; this.hits = []; this.steps = [];
    this.playing = true; this.timer = setInterval(() => this.schedule(), 25); this.schedule();
  },
  stop() { clearInterval(this.timer); this.playing = false; },
  setMuted(m) { if (this.master) this.master.gain.value = m ? 0 : 0.35; },
  schedule() {
    while (this.nextTime < this.ctx.currentTime + 0.1) { this.queueStep(this.step, this.nextTime); this.nextTime += 60 / params.bpm / 4; this.step++; }
    const old = this.ctx.currentTime - 1;
    this.hits = this.hits.filter(h => h.time > old);
    while (this.steps.length > 2 && this.steps[1].time < old) this.steps.shift();
  },
  queueStep(step, time) {
    const inBar = step % (params.bpb * 4); this.steps.push({ time, step });
    for (const lane of LANES) { if (params[lane][inBar % 16] !== 'x') continue; const vel = inBar === 0 ? 1 : 0.7; this.hits.push({ lane, time, vel }); this.click(lane, time, vel); }
  },
  click(lane, t, vel) {
    const ctx = this.ctx, g = ctx.createGain(); g.connect(this.master);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vel, t + 0.003);
    let src;
    if (lane === 'kick') { src = ctx.createOscillator(); src.frequency.setValueAtTime(150, t); src.frequency.exponentialRampToValueAtTime(60, t + 0.08); src.connect(g); }
    else { src = ctx.createBufferSource(); src.buffer = this.noise; const f = ctx.createBiquadFilter(); f.type = lane === 'snare' ? 'bandpass' : 'highpass'; f.frequency.value = lane === 'snare' ? 1800 : 8000; src.connect(f); f.connect(g); }
    const end = t + TAU[lane] * 4; g.gain.exponentialRampToValueAtTime(0.001, end); src.start(t); src.stop(end + 0.01);
  },
  latency() { return this.ctx ? Math.min(0.3, this.ctx.outputLatency || this.ctx.baseLatency || 0) : 0; },
  beats() {   // the beat position as heard
    if (!this.ctx) return -1;
    const now = this.ctx.currentTime - this.latency();
    let last = null; for (const s of this.steps) if (s.time <= now) last = s;
    return last ? (last.step + Math.min(1, (now - last.time) / (60 / params.bpm / 4))) / 4 : -1;
  },
};


// ---------- small maths ----------
const ease = u => u * u * (3 - 2 * u);
const clamp01 = x => Math.max(0, Math.min(1, x));
const lerp = (a, b, u) => a + (b - a) * u;
const sstep = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const sub3 = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const add3 = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const mul3 = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const len3 = a => Math.hypot(a[0], a[1], a[2]);
const cross3 = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];

const q = k => query.get(k);

if (['auto', 'orbit', 'skim', 'thread'].includes(q('camMode'))) params.camMode = q('camMode');

params.scale = Math.max(0.25, Math.min(1, parseFloat(q('scale')) || 1));

  scaleNow: { get: () => fixedScale !== null ? fixedScale : null, enumerable: true },
  renderFrac: { get: () => { const dw = Math.round(canvas.clientWidth * Math.min(window.devicePixelRatio || 1, 2)) || 1; return (canvas.width * (dyn.scale < 1 && (params.dynres || fixedScale !== null) ? dyn.scale : 1)) / dw; }, enumerable: true } });

(function warmUp() {

    if (params.dynres || fixedScale !== null) ensureRT(canvas.width, canvas.height);
    gl.useProgram(marchProg.p);
    gl.bindFramebuffer(gl.FRAMEBUFFER, rt.fbo || null);
    gl.viewport(0, 0, 1, 1);
    gl.bindVertexArray(emptyVao); gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    if (rt.tex) {
      gl.useProgram(blitProg.p);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, rt.tex); gl.uniform1i(blitProg.u.uTex, 0);
